name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        display: [1080x1920, 1080x2340, 1080x2400]
    env:
      SMOKE_DISPLAYS: ${{ matrix.display }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Archive exact build sources
        if: matrix.display == '1080x1920'
        run: git archive --format=zip HEAD -o sanguo11-mobile-source.zip
      - uses: actions/upload-artifact@v4
        if: matrix.display == '1080x1920'
        with:
          name: sanguo11-mobile-source
          path: sanguo11-mobile-source.zip
          retention-days: 30
          if-no-files-found: error
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify offline content pipeline
        if: matrix.display == '1080x1920'
        run: |
          python3 tools/content/build_content.py --check
          python3 tools/content/build_mobile_scenarios.py --check
          python3 tools/content/test_content.py
          bash scripts/test-ui-models.sh
      - name: Verify core rules and saves
        if: matrix.display == '1080x1920'
        run: bash scripts/test-core.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint Android
        run: |
          if [ "$SMOKE_DISPLAYS" = "1080x1920" ]; then
            ./gradlew --no-daemon test :core:check lint
          fi
          ./gradlew --no-daemon assembleDebug :app:assembleDebugAndroidTest
      - name: Build pinned v0.9 upgrade baseline
        if: matrix.display == '1080x1920'
        run: |
          git fetch --depth=1 origin 5ff24223f723a5ce4830b6c3753b479877e1ae94
          mkdir -p /tmp/sanguo-v09-upgrade app/build/upgrade
          git archive 5ff24223f723a5ce4830b6c3753b479877e1ae94 | tar -x -C /tmp/sanguo-v09-upgrade
          (cd /tmp/sanguo-v09-upgrade && ./gradlew --no-daemon :app:assembleDebug)
          cp /tmp/sanguo-v09-upgrade/app/build/outputs/apk/debug/app-debug.apk app/build/upgrade/v09.apk
      - name: Download actual verified v0.25 APK for in-place upgrade
        if: matrix.display == '1080x1920'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/zjjxwpstcnsm-gif/sanguo11-mobile/actions/artifacts/10436410691/zip > /tmp/v025-verified.zip
          unzip -j /tmp/v025-verified.zip '*.apk' -d /tmp/v025-verified
          cp /tmp/v025-verified/*.apk app/build/upgrade/v025.apk
          echo 'd065889f86ee60988927105dac928eab18bf2d7773d8ccec0dc7fcc960bcd123  app/build/upgrade/v025.apk' | sha256sum -c -
      - name: Download actual verified v0.26 APK for in-place upgrade
        if: matrix.display == '1080x1920'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/zjjxwpstcnsm-gif/sanguo11-mobile/actions/artifacts/10442343895/zip > /tmp/v026-verified.zip
          unzip -j /tmp/v026-verified.zip '*.apk' -d /tmp/v026-verified
          cp /tmp/v026-verified/*.apk app/build/upgrade/v026.apk
          echo '47edc0678bbe0117ffe9388a95ed0fdbb8dab98e5896074c399caafd7ab121c0  app/build/upgrade/v026.apk' | sha256sum -c -
      - name: Download actual verified v0.27 APK for in-place upgrade
        if: matrix.display == '1080x1920'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/zjjxwpstcnsm-gif/sanguo11-mobile/actions/artifacts/10446263614/zip > /tmp/v027-verified.zip
          unzip -j /tmp/v027-verified.zip '*.apk' -d /tmp/v027-verified
          cp /tmp/v027-verified/*.apk app/build/upgrade/v027.apk
          echo '8f0ca650ddbd0dc4615e3306ae407be6e8042aff6fc04bf0d3a4e2deb74c41dc  app/build/upgrade/v027.apk' | sha256sum -c -
      - name: Check bundled scenario resources
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              for name in ['assets/portraits/officers.png', 'assets/map/buildings.png', 'scenarios/index.txt', 'scenarios/m0-skirmish.properties', 'scenarios/regional-sandbox.properties', 'scenarios/river-siege-sandbox.properties', 'scenarios/officer-reference-drill.properties', 'content/index.txt', 'content/officers.tsv', 'content/sites.tsv', 'scenarios/contest-drill.properties', 'scenarios/fieldworks-drill.properties', 'scenarios/estates-drill.properties', 'scenarios/world-drill.properties', 'scenarios/lifecycle-drill.properties', 'scenarios/heroes-mobile-sandbox.properties', 'scenarios/central-mobile-sandbox.properties', 'scenarios/jingxiang-mobile-sandbox.properties']:
                  assert name in apk.namelist(), name
          PY
      - name: Enable KVM for Android runtime verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installed game flow on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            if [ "$SMOKE_DISPLAYS" = "1080x1920" ]; then bash scripts/verify-upgrade.sh; bash scripts/verify-upgrade-v025.sh; bash scripts/verify-upgrade-v026.sh; bash scripts/verify-upgrade-v027.sh; fi
            bash scripts/smoke-android.sh
      - name: Check stable development signature and record digest
        if: matrix.display == '1080x1920'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SIGNATURE.txt
          python3 - <<'PYVERIFY'
          from pathlib import Path
          signature=Path('app/build/outputs/apk/debug/SIGNATURE.txt').read_text()
          assert '8f64ee37f8ff58de8f5a199aac2ae745a5bc927d0d0eabac7540083a5e551f24' in signature
          PYVERIFY
          cd app/build/outputs/apk/debug
          cp app-debug.apk "sanguo11-mobile-v028-$(git rev-parse --short HEAD).apk"
          sha256sum sanguo11-mobile-v028-*.apk | tee SHA256SUMS
          git rev-parse HEAD > BUILD_COMMIT
      - uses: actions/upload-artifact@v4
        if: matrix.display == '1080x1920'
        with:
          name: sanguo11-mobile-v028-apk
          path: |
            app/build/outputs/apk/debug/sanguo11-mobile-v028-*.apk
            app/build/outputs/apk/debug/BUILD_COMMIT
            app/build/outputs/apk/debug/SHA256SUMS
            app/build/outputs/apk/debug/SIGNATURE.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-${{ matrix.display }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence-${{ matrix.display }}
          path: app/build/smoke
          if-no-files-found: ignore
