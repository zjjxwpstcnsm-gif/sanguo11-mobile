name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Archive exact build sources
        run: git archive --format=zip HEAD -o sanguo11-mobile-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sanguo11-mobile-source
          path: sanguo11-mobile-source.zip
          retention-days: 30
          if-no-files-found: error
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify offline content pipeline
        run: |
          python3 tools/content/build_content.py --check
          python3 tools/content/test_content.py
          bash scripts/test-ui-models.sh
      - name: Verify core rules and saves
        run: bash scripts/test-core.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint Android
        run: |
          ./gradlew --no-daemon test :core:check
          ./gradlew --no-daemon lint
          ./gradlew --no-daemon assembleDebug :app:assembleDebugAndroidTest
      - name: Build pinned v0.9 upgrade baseline
        run: |
          git fetch --depth=1 origin 5ff24223f723a5ce4830b6c3753b479877e1ae94
          mkdir -p /tmp/sanguo-v09-upgrade app/build/upgrade
          git archive 5ff24223f723a5ce4830b6c3753b479877e1ae94 | tar -x -C /tmp/sanguo-v09-upgrade
          (cd /tmp/sanguo-v09-upgrade && ./gradlew --no-daemon :app:assembleDebug)
          cp /tmp/sanguo-v09-upgrade/app/build/outputs/apk/debug/app-debug.apk app/build/upgrade/v09.apk
      - name: Check bundled scenario resources
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              for name in ['scenarios/index.txt', 'scenarios/m0-skirmish.properties', 'scenarios/regional-sandbox.properties', 'scenarios/river-siege-sandbox.properties', 'scenarios/officer-reference-drill.properties', 'content/index.txt', 'content/officers.tsv', 'content/sites.tsv', 'scenarios/contest-drill.properties', 'scenarios/fieldworks-drill.properties', 'scenarios/estates-drill.properties', 'scenarios/world-drill.properties']:
                  assert name in apk.namelist(), name
          PY
      - name: Enable KVM for Android runtime verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installed game flow on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/verify-upgrade.sh && bash scripts/smoke-android.sh
      - name: Check stable development signature and record digest
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SIGNATURE.txt
          python3 - <<'PYVERIFY'
          from pathlib import Path
          signature=Path('app/build/outputs/apk/debug/SIGNATURE.txt').read_text()
          assert '8f64ee37f8ff58de8f5a199aac2ae745a5bc927d0d0eabac7540083a5e551f24' in signature
          PYVERIFY
          cd app/build/outputs/apk/debug
          cp app-debug.apk "sanguo11-mobile-v015-$(git rev-parse --short HEAD).apk"
          sha256sum sanguo11-mobile-v015-*.apk | tee SHA256SUMS
          git rev-parse HEAD > BUILD_COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: sanguo11-mobile-v015-apk
          path: |
            app/build/outputs/apk/debug/sanguo11-mobile-v015-*.apk
            app/build/outputs/apk/debug/BUILD_COMMIT
            app/build/outputs/apk/debug/SHA256SUMS
            app/build/outputs/apk/debug/SIGNATURE.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: app/build/smoke
          if-no-files-found: ignore
