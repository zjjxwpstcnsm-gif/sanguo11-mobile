name: Architecture verified source delivery
on:
  push:
    branches: [agent/architecture-foundation]
    paths: [.ci/architecture-change.py, .github/workflows/architecture-apply.yml]
permissions:
  contents: write
concurrency:
  group: architecture-source-delivery
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/agent/architecture-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply checked production source
        run: python3 .ci/architecture-change.py
      - name: Complete state parity, session and existing U01 tests
        run: |
          mkdir -p out/architecture
          set -o pipefail
          bash scripts/test-architecture.sh 2>&1 | tee out/architecture/java-tests.log
      - name: Commit and push actual production code without force
        run: |
          git diff --check
          git config user.name 'Architecture Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core game-api game-runtime app unity scripts settings.gradle
          git diff --cached --quiet && { echo 'No production change'; exit 1; }
          git commit -m 'refactor(runtime): unify authority, native commands, save and lifecycle ownership'
          git push origin HEAD:refs/heads/agent/architecture-foundation
          git rev-parse HEAD > out/architecture/SOURCE_COMMIT
          git bundle create out/architecture/source.bundle HEAD
          git show --stat HEAD > out/architecture/CHANGES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-runtime-source
          path: |
            out/architecture/source.bundle
            out/architecture/SOURCE_COMMIT
            out/architecture/CHANGES.txt
            out/architecture/java-tests.log
          retention-days: 3
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build exact committed native Android application and instrumentation
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -PunityBridgeProbe=true 2>&1 | tee out/architecture/android-build.log
          cp app/build/outputs/apk/debug/app-debug.apk out/architecture/sanguo11-architecture-native.apk
          sha256sum out/architecture/sanguo11-architecture-native.apk > out/architecture/SHA256SUMS.txt
          stat -c %s out/architecture/sanguo11-architecture-native.apk > out/architecture/APK_BYTES
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/architecture/sanguo11-architecture-native.apk > out/architecture/APK_METADATA.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('out/architecture/sanguo11-architecture-native.apk') as apk:
              assert not any(n.endswith('/libunity.so') for n in apk.namelist())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-native-apk-and-build-evidence
          path: |
            out/architecture/sanguo11-architecture-native.apk
            out/architecture/SOURCE_COMMIT
            out/architecture/SHA256SUMS.txt
            out/architecture/APK_BYTES
            out/architecture/APK_METADATA.txt
            out/architecture/android-build.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native runtime, Activity recreation and presentation switching
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w game.sanguo.mobile.dev.test/game.sanguo.mobile.UnityBridgeInstrumentation | tee out/architecture/android-runtime.log
            adb logcat -d > out/architecture/logcat.txt
            adb exec-out screencap -p > out/architecture/native-screen.png
            grep -q 'u01=PASS' out/architecture/android-runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-native-runtime-evidence
          path: |
            out/architecture/android-runtime.log
            out/architecture/logcat.txt
            out/architecture/native-screen.png
            out/architecture/SOURCE_COMMIT
