name: Architecture verified source delivery
on:
  push:
    branches: [agent/architecture-foundation]
    paths: [.ci/architecture-change.py, .github/workflows/architecture-apply.yml]
permissions:
  contents: write
concurrency:
  group: architecture-source-delivery
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/agent/architecture-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply source transformation with checked anchors
        run: python3 .ci/architecture-change.py
      - name: Existing Java bridge and fixture compatibility gate
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: bash scripts/test-unity-u01.sh
      - name: Commit actual production source, never force push
        run: |
          git diff --check
          git config user.name 'Architecture Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core game-api game-runtime app unity scripts settings.gradle
          git diff --cached --quiet && { echo 'No production change'; exit 1; }
          git commit -m 'refactor(architecture): extract platform-free protocol and bridge runtime modules'
          git push origin HEAD:refs/heads/agent/architecture-foundation
      - name: Export committed source for offline verification
        run: |
          mkdir -p /tmp/architecture-delivery
          git bundle create /tmp/architecture-delivery/source.bundle HEAD
          git rev-parse HEAD > /tmp/architecture-delivery/SOURCE_COMMIT
          git show --stat HEAD > /tmp/architecture-delivery/CHANGES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-committed-source
          path: /tmp/architecture-delivery/
          retention-days: 3
