name: Corners61 exact source APK install and publication
on:
  push:
    branches: [agent/map-corners-boundary-v061]
    paths: [.github/workflows/corners61-delivery.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: corners61-delivery
  cancel-in-progress: false
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact guarded v061 delta and push functional source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          if test -f .ci/corners61-payload-01.txt; then
            python3 - <<'PY'
          import base64,hashlib,json,lzma,subprocess
          from pathlib import Path
          parts=sorted(Path('.ci').glob('corners61-payload-*.txt'))
          assert len(parts)==13
          raw=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='6d4a52c8ac4d6305000d8efc8da6504a5c6e47c5ec84efbf2b1c7e78cfdd722c'
          plan=json.loads(raw)
          assert plan['base_commit']=='049652d45641ff247c964ec30f70f5cff5c629f3'
          assert len(plan['files'])==44
          for name,meta in plan['files'].items():
              p=Path(name)
              assert not p.is_absolute() and '..' not in p.parts and not p.is_symlink() and 'MAP_SAN11' not in name
              assert not name.startswith(('.github/','.git/')) and name!='tools/content/materialize_native56.py'
              assert (hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None)==meta['before'],name
          subprocess.run(['git','apply','--check','--binary','-'],input=plan['patch'].encode(),check=True)
          subprocess.run(['git','apply','--index','--binary','-'],input=plan['patch'].encode(),check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())==set(plan['files'])
          for name,meta in plan['files'].items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==meta['after'],name
          Path('out/APPLIED_SOURCE.json').write_text(json.dumps(plan['files'],indent=2)+'\n')
          PY
            python3 tools/content/audit_native61.py --check
            python3 tools/content/test_audit61.py
            python3 scripts/verify-map-release.py
            rm .ci/corners61-payload-*.txt
            git add .ci
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(map): v0.61 restore 206 source cells and add 1051 guarded exterior cells'
            git push origin HEAD:agent/map-corners-boundary-v061
          fi
          git rev-parse HEAD > out/BUILD_COMMIT
          git status --porcelain > out/WORKTREE_STATUS
          test ! -s out/WORKTREE_STATUS
          cp version.properties out/VERSION
          cp docs/validation/v061/source-grid-audit.json out/
          git archive --format=zip -o out/sanguo11-mobile-v061-source.zip HEAD
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Retrieve actual old installed saves and exact v060 upgrade APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 35521913246 -R zjjxwpstcnsm-gif/sanguo11-mobile -n reference59-v058-baseline -D out/baseline58
          gh run download 35549692460 -R zjjxwpstcnsm-gif/sanguo11-mobile -n reference60-v059-baseline -D out/baseline59
          gh run download 35554158663 -R zjjxwpstcnsm-gif/sanguo11-mobile -n corners61-v060-baseline -D out/baseline60
          for revision in 58 59 60;do test "$(cat out/baseline$revision/BASELINE_INSTALLED_STATUS)" = success;done
          gh release download v0.60.0-fec13cba0906 -R zjjxwpstcnsm-gif/sanguo11-mobile -p '*.apk' -D out/old
          mv out/old/*.apk out/upgrade-v060.apk
          echo '50b2ed1df0dd405e6cc14b907c1968a69e837aee08f3af5f41c7fe34df88b412  out/upgrade-v060.apk' | sha256sum -c -
          bash scripts/canonical-legacy61.sh
      - name: Directed model coordinate save and movement regressions
        id: core
        continue-on-error: true
        env:
          REFERENCE61_LEGACY: out/legacy61
          REFERENCE61_REQUIRE_LEGACY: 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-map61.sh | tee out/reference61-core.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Assemble exact final functional commit and verify signed APK identity
        id: build
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest | tee out/gradle.txt
          python3 tools/check_apk_content.py app/build/outputs/apk/debug/app-debug.apk | tee out/apk-content.txt
          python3 scripts/verify-map-release.py app/build/outputs/apk/debug/app-debug.apk | tee -a out/apk-content.txt
          sha=$(git rev-parse --short=12 HEAD)
          apk="out/sanguo11-mobile-v0.61.0-$sha.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > out/SIGNATURE.txt
          grep -q '8f64ee37f8ff58de8f5a199aac2ae745a5bc927d0d0eabac7540083a5e551f24' out/SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > out/APK_INFO.txt
          grep -q "versionCode='61' versionName='0.61.0'" out/APK_INFO.txt
          grep -q "package: name='game.sanguo.mobile.dev'" out/APK_INFO.txt
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          apk=next(Path('out').glob('sanguo11-mobile-v0.61.0-*.apk'))
          sha=Path('out/BUILD_COMMIT').read_text().strip()
          configs=list(Path('app/build/generated').rglob('BuildConfig.java'))
          assert any(sha[:12] in p.read_text() and 'SOURCE_REVISION' in p.read_text() for p in configs)
          with zipfile.ZipFile(apk) as z:
              native=z.read('maps/national-map-v056.properties')
              assert hashlib.sha256(native).hexdigest()=='d5d5659e40a23619dd8515713d21997715733d20cc937a964662591e22f076c4'
              exterior=z.read('maps/national-exterior-v061.properties')
              assert hashlib.sha256(exterior).hexdigest()=='451fed332f742aaef8a88e5781c15eda8e1ad0fd29ae7d20c3e0dbe82214a60f'
              art=[n for n in z.namelist() if n.startswith('assets/map/cities-v056/') and n.endswith('.png')]
              assert len(art)==30
              for n in z.namelist():
                  assert 'MAP_SAN11' not in n and 'reference61-corrections' not in n and 'reference-v061' not in n,n
                  if n.endswith('.dex'):
                      for symbol in [b'Lgame/sanguo/core/MapTap57Fixture;',b'Lgame/sanguo/mobile/Reference61Probe;']:assert symbol not in z.read(n),symbol
          Path('out/APK_IDENTITY.json').write_text(json.dumps({'source_sha':sha,'workflow_bootstrap_sha':'${{ github.sha }}','versionName':'0.61.0','versionCode':61,'package':'game.sanguo.mobile.dev','sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'bytes':apk.stat().st_size,'native_map_revision':61,'map_sha256':hashlib.sha256(native).hexdigest(),'exterior_sha256':hashlib.sha256(exterior).hexdigest(),'city_pngs':len(art),'city_art_revision':56,'save_codec':31,'certificate_sha256':'8f64ee37f8ff58de8f5a199aac2ae745a5bc927d0d0eabac7540083a5e551f24'},indent=2)+'\n')
          PY
          (cd out;sha256sum sanguo11*.apk *source.zip > SHA256SUMS)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install exact APK and verify full corner views and retained game flow
        id: installed
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/android-map61.sh
      - name: Preserve truthful results and before-after screenshots
        if: always()
        env:
          SOURCE: ${{ steps.source.outcome }}
          CORE: ${{ steps.core.outcome }}
          BUILD: ${{ steps.build.outcome }}
          INSTALLED: ${{ steps.installed.outcome }}
        run: |
          mkdir -p out review-stills apk-identity
          python3 - <<'PY'
          import os,json,shutil
          from pathlib import Path
          Path('out/VALIDATION_STATUS.json').write_text(json.dumps({k:os.environ.get(k,'unknown') for k in ['SOURCE','CORE','BUILD','INSTALLED']},indent=2)+'\n')
          for label,root in [('before',Path('out/baseline60/android')),('after',Path('out/android/reference61'))]:
              if root.exists():
                  dest=Path('review-stills')/label;dest.mkdir(exist_ok=True)
                  for p in root.rglob('*'):
                      if p.is_file() and p.suffix in ('.png','.txt','.json'):shutil.copy2(p,dest/p.name)
          for p in Path('out').glob('*'):
              if p.is_file() and (p.suffix in ('.txt','.json') or p.name in ('BUILD_COMMIT','VERSION','SHA256SUMS','TESTED_APK_SHA256','UPGRADE_SAVE_BEFORE','UPGRADE_SAVE_AFTER')):shutil.copy2(p,Path('review-stills')/p.name)
          shutil.make_archive('out/corners61-screenshots-and-logs','zip','review-stills')
          PY
      - name: Publish standalone tested APK and verify release bytes
        id: publication
        if: steps.source.outcome == 'success' && steps.core.outcome == 'success' && steps.build.outcome == 'success' && steps.installed.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(cat out/BUILD_COMMIT)
          tag="v0.61.0-${sha:0:12}"
          apk=$(find out -maxdepth 1 -name 'sanguo11-mobile-v0.61.0-*.apk')
          sha256sum -c out/TESTED_APK_SHA256
          if ! gh release view "$tag" >/dev/null 2>&1;then
            gh release create "$tag" --target "$sha" --title 'v0.61.0 · 两角外景与水面修订' --notes '206 unique source cells V to Q; 1051 explicitly scoped exterior presentation cells, not gameplay terrain. 14 northwest VOID cells remain unresolved. New games use revision61; actual old v058/v059/v060 saves preserved. Exact signed APK installed on API29 x86_64 emulator with corner and retained-gameplay probes; not physical ARM performance certification and not 100% original boundary/navigation fidelity.'
          fi
          gh release upload "$tag" "$apk" out/APK_IDENTITY.json out/VALIDATION_STATUS.json out/ANDROID_STATUS.json out/SIGNATURE.txt out/SHA256SUMS out/sanguo11-mobile-v061-source.zip out/corners61-screenshots-and-logs.zip --clobber
          gh release view "$tag" --json url,tagName,targetCommitish,assets > out/PUBLICATION.json
          mkdir -p out/release-check
          gh release download "$tag" -p "$(basename "$apk")" -D out/release-check
          cmp "$apk" "out/release-check/$(basename "$apk")"
          sha256sum "out/release-check/$(basename "$apk")" > out/RELEASE_VERIFIED_APK_SHA256
      - name: Collect compact APK identity artifact
        if: always()
        run: |
          mkdir -p apk-identity
          find out -maxdepth 1 -name 'sanguo11-mobile-v0.61.0-*.apk' -exec cp '{}' apk-identity/ \;
          for f in APK_IDENTITY.json VALIDATION_STATUS.json ANDROID_STATUS.json SIGNATURE.txt APK_INFO.txt BUILD_COMMIT VERSION SHA256SUMS TESTED_APK_SHA256 RELEASE_VERIFIED_APK_SHA256 PUBLICATION.json UPGRADE_SAVE_BEFORE UPGRADE_SAVE_AFTER LEGACY_SAVE_HASHES;do if test -f "out/$f";then cp "out/$f" apk-identity/;fi;done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corners61-apk-identity
          path: apk-identity
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corners61-review-stills
          path: review-stills
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corners61-source
          path: out/sanguo11-mobile-v061-source.zip
          retention-days: 14
      - name: Require verified source build installation and publication
        if: always()
        run: |
          test '${{ steps.source.outcome }}' = success
          test '${{ steps.core.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.installed.outcome }}' = success
          test '${{ steps.publication.outcome }}' = success
