name: Custom officer editor verification
on:
  push:
    branches: [agent/custom-officer-editor-20260922-b7e4]
    paths:
      - .github/workflows/custom-officer-editor.yml
      - .ci/officer-fix.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: officer-editor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/agent/custom-officer-editor-20260922-b7e4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply reviewed fixes in isolated checkout and push without force
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/custom-officers
          if test -f .ci/officer-fix.py; then
            python3 .ci/officer-fix.py
            git diff --check
            git add app/src core/src scripts docs
            git rm .ci/officer-fix.py
            git config user.name 'Officer editor integration'
            git config user.email 'officer-editor@users.noreply.github.com'
            git commit -m 'fix(officers): validate Android editor and portable identity transactions'
            git push origin HEAD:refs/heads/agent/custom-officer-editor-20260922-b7e4
          fi
          git rev-parse HEAD | tee out/custom-officers/SOURCE_COMMIT.txt
          git archive --format=zip -o out/custom-officers/source.zip HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Core production command regressions
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-custom-officers.sh 2>&1 | tee out/custom-officers/core-tests.txt
          bash scripts/test-v066.sh 2>&1 | tee out/custom-officers/governance-regression.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Build production APK and instrumentation from pushed revision
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee out/custom-officers/build.txt
          cp app/build/outputs/apk/debug/app-debug.apk out/custom-officers/sanguo11-custom-officers.apk
          sha256sum out/custom-officers/sanguo11-custom-officers.apk > out/custom-officers/APK_SHA256.txt
      - name: Enable Android virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installed Android editor, document handlers, gameplay and process restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/verify-custom-officers-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: custom-officer-editor-${{ github.run_id }}
          path: out/custom-officers
          retention-days: 7
