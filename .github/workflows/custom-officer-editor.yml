name: Custom officer editor isolated integration
on:
  push:
    branches: [agent/custom-officer-editor-20260922-b7e4]
    paths:
      - .github/workflows/custom-officer-editor.yml
      - tools/integrate-custom-officers.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: officer-editor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/agent/custom-officer-editor-20260922-b7e4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Guarded shared entry integration and non-forced branch push
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/integrate-custom-officers.py
          git config user.name 'Officer editor integration'
          git config user.email 'officer-editor@users.noreply.github.com'
          git add app/src/main/java/game/sanguo/mobile/MainActivity.java app/src/main/java/game/sanguo/mobile/EditorUi.java
          if ! git diff --cached --quiet; then
            git commit -m 'feat(officers): wire persistent officer editor into start screen and PK menu'
            git push origin HEAD:refs/heads/agent/custom-officer-editor-20260922-b7e4
          fi
          mkdir -p out/custom-officers
          git rev-parse HEAD | tee out/custom-officers/SOURCE_COMMIT.txt
          git archive --format=zip -o out/custom-officers/source.zip HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Build production APK from pushed revision
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon :app:assembleDebug 2>&1 | tee out/custom-officers/build.txt
          cp app/build/outputs/apk/debug/app-debug.apk out/custom-officers/sanguo11-custom-officers.apk
          sha256sum out/custom-officers/sanguo11-custom-officers.apk > out/custom-officers/APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: custom-officer-editor-${{ github.run_id }}
          path: out/custom-officers
          retention-days: 7
