name: Delivered v0.28 displacement reproduction
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: displacement-${{ github.ref }}
  cancel-in-progress: true
jobs:
  displacement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build pinned v0.28 observation runner
        run: |
          mkdir -p /tmp/v028-observer app/build/baseline
          git fetch origin 7c2053bf36b0dd0637c74538c221c51021d64695
          git archive 7c2053bf36b0dd0637c74538c221c51021d64695 | tar -x -C /tmp/v028-observer
          python3 scripts/sync-displacement-observer.py /tmp/v028-observer
          (cd /tmp/v028-observer && ./gradlew --no-daemon :app:assembleDebugAndroidTest)
          cp /tmp/v028-observer/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk app/build/baseline/observer.apk
      - name: Download exact delivered v0.28 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/zjjxwpstcnsm-gif/sanguo11-mobile/actions/artifacts/10455463236/zip > /tmp/v028.zip
          unzip -j /tmp/v028.zip '*.apk' -d app/build/baseline
          mv app/build/baseline/sanguo11-mobile-v028-66417c0.apk app/build/baseline/v028.apk
          echo 'bd24da23469cf77ab4991dfa4982af30eb087e2ea3ef72e5228a4d8a6f2e3df1  app/build/baseline/v028.apk' | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/displacement-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v028-displacement-reproduction
          path: app/build/displacement
          retention-days: 30
