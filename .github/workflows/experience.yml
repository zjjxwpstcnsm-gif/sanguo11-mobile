name: Installed mobile experience comparison
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: experience-${{ github.ref }}
  cancel-in-progress: true
jobs:
  experience:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Harden bidirectional accessibility list search
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/androidTest/java/game/sanguo/mobile/GameSmokeRunner.java')
          s=p.read_text()
          old='''    private AccessibilityNodeInfo scrollToText(String text,boolean exact) {\n        AccessibilityNodeInfo node=null;long until=SystemClock.uptimeMillis()+12000;boolean forward=true;\n        while(node==null&&SystemClock.uptimeMillis()<until) {\n            waitForIdleSync();AccessibilityNodeInfo root=getUiAutomation().getRootInActiveWindow();node=find(root,text,exact);\n            // Lists retain their position across reopening/recreation. Search the full\n            // list in both directions, rather than bouncing around its last page.\n            if(node==null){if(forward&&!scroll(root))forward=false;if(!forward)scrollBack(root);SystemClock.sleep(250);}\n        }\n        if(node==null)throw new AssertionError("UI content not reachable by scrolling: "+text);\n        return node;\n    }\n'''
          new='''    private AccessibilityNodeInfo scrollToText(String text,boolean exact) {\n        AccessibilityNodeInfo node=null;long until=SystemClock.uptimeMillis()+12000;boolean forward=true;int directionSteps=0;\n        while(node==null&&SystemClock.uptimeMillis()<until) {\n            waitForIdleSync();AccessibilityNodeInfo root=getUiAutomation().getRootInActiveWindow();node=find(root,text,exact);\n            // Android accessibility can report a successful ListView scroll even when\n            // the viewport is already at an edge. Bound each directional sweep so a\n            // retained list position is always searched both forward and backward.\n            if(node==null){\n                boolean moved=forward?scroll(root):scrollBack(root);directionSteps++;\n                if(!moved||directionSteps>=20){forward=!forward;directionSteps=0;}\n                SystemClock.sleep(250);\n            }\n        }\n        if(node==null)throw new AssertionError("UI content not reachable by scrolling: "+text);\n        return node;\n    }\n'''
          if old in s:
              p.write_text(s.replace(old,new,1))
          elif new not in s:
              raise SystemExit('scrollToText target not found')
          PY
          git config user.name "sanguo11-mobile-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/androidTest/java/game/sanguo/mobile/GameSmokeRunner.java
          if ! git diff --cached --quiet; then
            git commit -m "test: make accessibility list search bidirectional"
            git push origin HEAD:agent/mobile-ux-geography-turn-v034
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build current app and pinned old observation runner
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          mkdir -p /tmp/v027-observer app/build/baseline
          git fetch origin a92f43697a05d42cc2bcd7c9766c8103f009e48b
          git archive a92f43697a05d42cc2bcd7c9766c8103f009e48b | tar -x -C /tmp/v027-observer
          python3 scripts/sync-experience-benchmark.py /tmp/v027-observer
          (cd /tmp/v027-observer && ./gradlew --no-daemon :app:assembleDebugAndroidTest)
          cp /tmp/v027-observer/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk app/build/baseline/observer.apk
      - name: Download exact delivered baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/zjjxwpstcnsm-gif/sanguo11-mobile/actions/artifacts/10446263614/zip > /tmp/v027.zip
          mkdir -p app/build/baseline
          unzip -j /tmp/v027.zip '*.apk' -d app/build/baseline
          mv app/build/baseline/sanguo11-mobile-v027-1884da6.apk app/build/baseline/v027.apk
          echo '8f0ca650ddbd0dc4615e3306ae407be6e8042aff6fc04bf0d3a4e2deb74c41dc  app/build/baseline/v027.apk' | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/experience-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-experience-comparison
          path: app/build/experience
          retention-days: 30
