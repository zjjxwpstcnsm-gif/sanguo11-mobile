name: Installed mobile experience comparison
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: experience-${{ github.ref }}
  cancel-in-progress: true
jobs:
  patch-city-smoke-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-ux-geography-turn-v034
          fetch-depth: 0
      - name: Clear temporary city search after locating
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/androidTest/java/game/sanguo/mobile/GameSmokeRunner.java')
          s=p.read_text()
          old='''        clickNav("城市");setInput("搜索城市或势力",city);click(city+" · "+w.faction(target.owner),false);waitText(city,true);\n    }\n'''
          new='''        clickNav("城市");setInput("搜索城市或势力",city);click(city+" · "+w.faction(target.owner),false);waitText(city,true);\n        runOnMainSync(()->{try{java.lang.reflect.Field f=MainActivity.class.getDeclaredField("ui");f.setAccessible(true);((ClientState)f.get(current)).cityQuery="";}catch(ReflectiveOperationException e){throw new RuntimeException(e);}});\n    }\n'''
          if old not in s:
              if new in s: raise SystemExit(0)
              raise SystemExit('locateCity cleanup target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "sanguo11-mobile-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/androidTest/java/game/sanguo/mobile/GameSmokeRunner.java
          if ! git diff --cached --quiet; then
            git commit -m "test: clear temporary city lookup filter"
            git push origin HEAD:agent/mobile-ux-geography-turn-v034
          fi
