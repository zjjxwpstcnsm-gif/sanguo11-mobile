name: Installed mobile experience comparison
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: experience-${{ github.ref }}
  cancel-in-progress: true
jobs:
  experience:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Apply v0.34 persistent-march visibility fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/game/sanguo/mobile/MainActivity.java')
          s = p.read_text()
          a = 'boolean mapContext="map".equals(ui.page)&&!aiRunning;'
          b = 'boolean mapContext="map".equals(ui.page)&&!aiRunning&&!ui.panelVisible;'
          if a in s:
              s = s.replace(a, b, 1)
          elif b not in s:
              raise SystemExit('quick navigator target not found')
          a = 'for(Button b:new Button[]{march,attack,tactics,plots,cancel})actions.addView(b,new LinearLayout.LayoutParams(0,dp(48),1));'
          b = 'for(Button b:new Button[]{march,attack,tactics,plots})actions.addView(b,new LinearLayout.LayoutParams(0,dp(48),1));\n            if(!(u instanceof Domestic.Mission)&&u.march!=null)actions.addView(button("停止行军",v->apply(world.marches.stop(u.id))),new LinearLayout.LayoutParams(0,dp(48),1));\n            actions.addView(cancel,new LinearLayout.LayoutParams(0,dp(48),1));'
          if a in s:
              s = s.replace(a, b, 1)
          elif 'if(!(u instanceof Domestic.Mission)&&u.march!=null)actions.addView(button("停止行军"' not in s:
              raise SystemExit('march command target not found')
          p.write_text(s)
          PY
          bash scripts/test-ui-models.sh
          if ! git diff --quiet -- app/src/main/java/game/sanguo/mobile/MainActivity.java; then
            git config user.name "zjjxwpstcnsm-gif"
            git config user.email "zjjxwpstcnsm@gmail.com"
            git add app/src/main/java/game/sanguo/mobile/MainActivity.java
            git commit -m "fix: keep active march controls reachable"
            git push origin HEAD:agent/mobile-ux-geography-turn-v034
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build current app and pinned old observation runner
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          mkdir -p /tmp/v027-observer app/build/baseline
          git fetch origin a92f43697a05d42cc2bcd7c9766c8103f009e48b
          git archive a92f43697a05d42cc2bcd7c9766c8103f009e48b | tar -x -C /tmp/v027-observer
          python3 scripts/sync-experience-benchmark.py /tmp/v027-observer
          (cd /tmp/v027-observer && ./gradlew --no-daemon :app:assembleDebugAndroidTest)
          cp /tmp/v027-observer/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk app/build/baseline/observer.apk
      - name: Download exact delivered baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/zjjxwpstcnsm-gif/sanguo11-mobile/actions/artifacts/10446263614/zip > /tmp/v027.zip
          mkdir -p app/build/baseline
          unzip -j /tmp/v027.zip '*.apk' -d app/build/baseline
          mv app/build/baseline/sanguo11-mobile-v027-1884da6.apk app/build/baseline/v027.apk
          echo '8f0ca650ddbd0dc4615e3306ae407be6e8042aff6fc04bf0d3a4e2deb74c41dc  app/build/baseline/v027.apk' | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/experience-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-experience-comparison
          path: app/build/experience
          retention-days: 30
