name: Governance66 exact source
on:
  push:
    branches: [agent/governance-wounded-ui-v066]
    paths: [.github/workflows/governance66-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Export tracked source
        run: |
          mkdir -p out
          git rev-parse HEAD > out/HEAD
          git archive --format=zip -o out/source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: governance66-source
          path: out
          retention-days: 3
