name: Governance66 production and installed validation
on:
  push:
    branches: [agent/governance-wounded-ui-v066]
    paths:
      - .github/workflows/governance66-verify.yml
      - 'core/**'
      - 'app/**'
      - scripts/test-v066.sh
      - scripts/verify-v066-android.sh
      - version.properties
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record exact checked-out source
        run: |
          mkdir -p out/v066
          git rev-parse HEAD | tee out/v066/SOURCE_COMMIT.txt
          git archive --format=zip -o out/v066/source.zip HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Production command, retained mechanics and presentation regressions
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-v066.sh 2>&1 | tee out/v066/core66.txt
          bash scripts/test-v064.sh 2>&1 | tee out/v066/core64.txt
          bash scripts/test-ui-models.sh 2>&1 | tee out/v066/presentation.txt
          python3 scripts/verify-map-release.py 2>&1 | tee out/v066/map-preservation.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Build production-source playtest APK and instrumentation
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon :app:assembleDebug 2>&1 | tee out/v066/android-build.txt
          cp app/build/outputs/apk/debug/app-debug.apk out/v066/sanguo11-mobile-v0.66.0.apk
          sha256sum out/v066/sanguo11-mobile-v0.66.0.apk > out/v066/APK_SHA256.txt
          gradle --no-daemon :app:assembleDebugAndroidTest 2>&1 | tee out/v066/instrumentation-build.txt
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Install and inspect production app at 320dp portrait and landscape
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/verify-v066-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance66-validation
          path: out/v066
          retention-days: 7
