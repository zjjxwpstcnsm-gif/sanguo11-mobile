name: Consolidated main standalone APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/main-consolidated-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: consolidated-main-apk
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Verify exact main ancestry and actual runtime scope
        run: |
          set -euo pipefail
          mkdir -p out
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          git merge-base --is-ancestor ca40692347dc785a6fa477d962780fe3e40ce1a2 HEAD
          git merge-base --is-ancestor 0563e5f7bf03d392f34adc1d6d99c042697749f6 HEAD
          git diff --exit-code 38a0da98924bc1aba3a43cf63661be319d72fd7a HEAD -- app/src/main core/src/main app/build.gradle version.properties tools/content/map-release-manifest.json
          git rev-parse HEAD > out/BUILD_COMMIT
          cp version.properties out/VERSION.properties
          cp docs/validation/main-integration-20260921/README.md out/SCOPE.md
          python3 scripts/verify-map-release.py | tee out/source-resource-verification.txt
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build fresh APKs from this main commit
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee out/build.txt
          short=$(git rev-parse --short=12 HEAD)
          cp app/build/outputs/apk/debug/app-debug.apk "out/sanguo11-mobile-main-${short}.apk"
          python3 scripts/verify-map-release.py "out/sanguo11-mobile-main-${short}.apk" | tee out/apk-resource-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "out/sanguo11-mobile-main-${short}.apk" > out/SIGNATURE.txt
          grep -q '8f64ee37f8ff58de8f5a199aac2ae745a5bc927d0d0eabac7540083a5e551f24' out/SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "out/sanguo11-mobile-main-${short}.apk" > out/APK_INFO.txt
          python3 - <<'PY'
          import hashlib,json,re,subprocess
          from pathlib import Path
          out=Path('out');apk=next(out.glob('sanguo11-mobile-main-*.apk'))
          info=(out/'APK_INFO.txt').read_text();m=re.search(r"package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'",info);assert m,info[:500]
          package,code,version=m.groups();assert package=='game.sanguo.mobile.dev' and int(code)==62 and version=='0.62.0-road-candidate'
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          identity={'build_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'package':package,'versionCode':int(code),'versionName':version,'mapRevision':61,'assetRevision':56,'SaveCodec':31,'apk_file':apk.name,'apk_bytes':apk.stat().st_size,'apk_sha256':sha(apk),'certificate_sha256':'8f64ee37f8ff58de8f5a199aac2ae745a5bc927d0d0eabac7540083a5e551f24','merged_prs':[51,52],'generated_art_deferred':True,'v063_gameplay_repairs_present':False,'physical_arm_tested':False,'workflow_run':'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}','resource_sha256':{p:sha(p) for p in ['core/src/main/resources/maps/national-map-v056.properties','core/src/main/resources/maps/national-exterior-v061.properties','app/src/main/assets/map/cities-v056/catalog.json','tools/content/map-release-manifest.json']}}
          (out/'APK_IDENTITY.json').write_text(json.dumps(identity,indent=2)+'\n')
          (out/'SHA256SUMS').write_text(identity['apk_sha256']+'  '+apk.name+'\n')
          PY
          git diff --exit-code
      - name: Retrieve exact previously published road APK for in-place upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/baseline
          gh release download v0.62.0-road-candidate-920827d015db --repo '${{ github.repository }}' --pattern 'sanguo11-mobile-v0.62.0-road-candidate-920827d015db.apk' --dir out/baseline
          echo '22a85277660a68215c3d6bf7a259ece07bffe3597bb6dc0bf86c4c358ff2d1a0  out/baseline/sanguo11-mobile-v0.62.0-road-candidate-920827d015db.apk' | sha256sum -c -
          cat > out/install-smoke.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p out/android
          apk=$(find out -maxdepth 1 -name 'sanguo11-mobile-main-*.apk' -print -quit)
          test -n "$apk"
          adb root
          adb wait-for-device
          adb shell wm size 1080x2340
          adb shell wm density 420
          adb install -r out/baseline/sanguo11-mobile-v0.62.0-road-candidate-920827d015db.apk | tee out/BASE_INSTALL.txt
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          probe() {
            phase="$1"
            adb shell am force-stop game.sanguo.mobile.dev
            adb shell rm -rf /sdcard/Android/data/game.sanguo.mobile.dev/files/smoke
            adb logcat -b all -c
            set +e
            timeout 420 adb shell am instrument -w -e native56 true game.sanguo.mobile.dev.test/game.sanguo.mobile.GameSmokeRunner > "out/${phase}-instrumentation.txt" 2>&1
            result=$?
            set -e
            adb logcat -b all -d -v threadtime > "out/${phase}-logcat.txt"
            adb pull /sdcard/Android/data/game.sanguo.mobile.dev/files/smoke "out/android/${phase}" || true
            test "$result" -eq 0
            grep -q 'NATIVE56 ANDROID PASS:' "out/${phase}-instrumentation.txt"
            if grep -q 'FATAL EXCEPTION' "out/${phase}-logcat.txt"; then exit 1; fi
          }
          probe baseline
          adb shell am force-stop game.sanguo.mobile.dev
          adb shell sha256sum /data/data/game.sanguo.mobile.dev/files/auto.sg11 > out/SAVE_BEFORE_INSTALL.txt
          (cd out; sha256sum -c SHA256SUMS)
          adb install -r "$apk" | tee out/INSTALL.txt
          adb shell sha256sum /data/data/game.sanguo.mobile.dev/files/auto.sg11 > out/SAVE_AFTER_INSTALL.txt
          cmp out/SAVE_BEFORE_INSTALL.txt out/SAVE_AFTER_INSTALL.txt
          adb shell dumpsys package game.sanguo.mobile.dev > out/INSTALLED_PACKAGE.txt
          adb logcat -b all -c
          adb shell am start -W -n game.sanguo.mobile.dev/game.sanguo.mobile.MainActivity > out/UPGRADE_LAUNCH.txt
          sleep 8
          adb shell pidof game.sanguo.mobile.dev > out/UPGRADE_PID.txt
          adb exec-out screencap -p > out/upgrade-launch.png
          adb logcat -b all -d -v threadtime > out/upgrade-launch-logcat.txt
          if grep -q 'FATAL EXCEPTION' out/upgrade-launch-logcat.txt; then exit 1; fi
          probe main
          (cd out; sha256sum -c SHA256SUMS)
          adb shell pm path game.sanguo.mobile.dev | tr -d '\r' | sed 's/^package://' > out/INSTALLED_APK_PATH.txt
          installed=$(head -n 1 out/INSTALLED_APK_PATH.txt)
          test -n "$installed"
          adb pull "$installed" out/installed-base.apk
          cmp "$apk" out/installed-base.apk
          python3 - <<'PY'
          from pathlib import Path
          import json
          out=Path('out')
          result={'api':29,'abi':'x86_64','baseline_apk_sha256':'22a85277660a68215c3d6bf7a259ece07bffe3597bb6dc0bf86c4c358ff2d1a0','baseline_native56_probe_passed':True,'signed_in_place_install_passed':True,'actual_baseline_save_bytes_preserved':True,'post_upgrade_launch_without_fatal_exception':True,'main_native56_probe_passed':True,'installed_apk_byte_identical_to_built_apk':True,'physical_arm_tested':False,'full_v063_acceptance':False}
          (out/'ANDROID_STATUS.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
          SH
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install exact baseline, upgrade to exact main APK, run retained-game smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash out/install-smoke.sh
      - name: Publish standalone APK and verify re-downloaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(cat out/BUILD_COMMIT)
          tag="main-integrated-${sha:0:12}"
          apk=$(find out -maxdepth 1 -name 'sanguo11-mobile-main-*.apk' -print -quit)
          (cd out;sha256sum -c SHA256SUMS)
          git diff --exit-code
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          out=Path('out')
          with zipfile.ZipFile(out/'android-smoke-screenshots-and-logs.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in (out/'android').rglob('*'):
                  if p.is_file():z.write(p,p.relative_to(out))
              for p in out.glob('*.txt'):z.write(p,p.name)
          PY
          gh release create "$tag" --repo '${{ github.repository }}' --target "$sha" --prerelease --title "Main consolidated rebuild ${sha:0:12} — art deferred" --notes-file out/SCOPE.md
          gh release upload "$tag" --repo '${{ github.repository }}' "$apk" out/APK_IDENTITY.json out/ANDROID_STATUS.json out/SIGNATURE.txt out/SHA256SUMS out/BUILD_COMMIT out/android-smoke-screenshots-and-logs.zip out/upgrade-launch.png
          mkdir -p out/release-check
          gh release download "$tag" --repo '${{ github.repository }}' --pattern "$(basename "$apk")" --dir out/release-check
          cmp "$apk" "out/release-check/$(basename "$apk")"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          out=Path('out');identity=json.loads((out/'APK_IDENTITY.json').read_text());p=out/'release-check'/identity['apk_file']
          actual=hashlib.sha256(p.read_bytes()).hexdigest();assert actual==identity['apk_sha256'];assert p.stat().st_size==identity['apk_bytes']
          (out/'RELEASE_VERIFICATION.json').write_text(json.dumps({'build_commit':identity['build_commit'],'apk_file':p.name,'apk_sha256':actual,'apk_bytes':p.stat().st_size,'downloaded_from_release':True,'byte_identical_to_installed_and_built_apk':True},indent=2)+'\n')
          PY
          gh release upload "$tag" --repo '${{ github.repository }}' out/RELEASE_VERIFICATION.json
          gh release view "$tag" --repo '${{ github.repository }}' --json url,tagName,targetCommitish,assets > out/PUBLICATION.json
          cat out/APK_IDENTITY.json out/ANDROID_STATUS.json out/RELEASE_VERIFICATION.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidated-main-apk
          path: out/sanguo11-mobile-main-*.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidated-main-evidence
          path: |
            out/*.json
            out/*.txt
            out/*.md
            out/SHA256SUMS
            out/BUILD_COMMIT
            out/*.properties
            out/upgrade-launch.png
            out/android/
          if-no-files-found: warn
