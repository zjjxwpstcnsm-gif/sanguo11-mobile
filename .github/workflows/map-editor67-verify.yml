name: Map editor67 installed verification
on:
  push:
    branches: [agent/in-game-map-editor-v067]
    paths:
      - .github/workflows/map-editor67-verify.yml
      - 'app/**'
      - 'core/**'
      - scripts/test-map-editor67.sh
      - scripts/verify-map-editor67-android.sh
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: map-editor67-installed-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve v31 migration fixture while accounting for appended v33 map section
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('core/src/test/java/game/sanguo/core/Governance66Test.java')
          s=p.read_text()
          old='byte[] encoded=SaveCodec.encode(w);int extensionSize=8+w.fieldUnits().size()*12+4+w.factions.length*6;'
          if old in s:
              b=p.read_bytes()
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='035d7b5b93fc0ad35ef216744fa0090cbd474497','Concurrent fixture edit'
              new='byte[] encoded=SaveCodec.encode(w);ByteArrayOutputStream mapExtension=new ByteArrayOutputStream();CustomMapSave.write(w,new DataOutputStream(mapExtension));\n        int extensionSize=8+w.fieldUnits().size()*12+4+w.factions.length*6+mapExtension.size();'
              p.write_text(s.replace(old,new))
          else:
              assert 'CustomMapSave.write(w,new DataOutputStream(mapExtension))' in s,'Unrecognized fixture'
          PY
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add core/src/test/java/game/sanguo/core/Governance66Test.java
            git commit -m 'test(save): preserve v31 migration fixture after appended custom-map section'
            git push origin HEAD:refs/heads/agent/in-game-map-editor-v067
          fi
          mkdir -p out/editor67
          git rev-parse HEAD | tee out/editor67/SOURCE_COMMIT.txt
          git archive --format=zip HEAD > out/editor67/source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Production map and retained gameplay tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-map-editor67.sh out/editor67/phone-export-fixture.json 2>&1 | tee out/editor67/editor-tests.txt
          bash scripts/test-v066.sh 2>&1 | tee out/editor67/core66.txt
          bash scripts/test-v064.sh 2>&1 | tee out/editor67/core64.txt
          bash scripts/test-ui-models.sh 2>&1 | tee out/editor67/ui-models.txt
          python3 scripts/verify-map-release.py 2>&1 | tee out/editor67/map-preservation.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Build exact pushed source and instrumentation
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          cp "$ANDROID_HOME/platforms/android-35/android.jar" out/editor67/android-platform.jar
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee out/editor67/android-build.txt
          cp app/build/outputs/apk/debug/app-debug.apk out/editor67/sanguo11-mobile-map-editor67.apk
          sha256sum out/editor67/sanguo11-mobile-map-editor67.apk > out/editor67/APK_SHA256.txt
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Install and operate the real Android editor
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/verify-map-editor67-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-editor67-installed
          path: out/editor67
          retention-days: 7
