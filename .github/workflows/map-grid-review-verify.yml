name: Map grid installed verification
on:
  push:
    branches: [agent/map-grid-review-20260920]
    paths: [.github/workflows/map-grid-review-verify.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Record exact sources and run regressions
        run: |
          mkdir -p out
          git rev-parse HEAD > out/BUILD_COMMIT
          bash scripts/test-ui-models.sh | tee out/ui-check.txt
          bash scripts/test-realm52.sh | tee out/rules-check.txt
          python3 tools/content/test_map_site_review.py | tee out/atlas-check.txt
          python3 scripts/verify-map-release.py | tee out/resource-check.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Build actual APK and instrumentation
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          python3 tools/check_apk_content.py app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/sanguo11-mobile-map-review.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/sanguo11-mobile-map-review.apk > out/SIGNATURE.txt
          grep -q '8f64ee37f8ff58de8f5a199aac2ae745a5bc927d0d0eabac7540083a5e551f24' out/SIGNATURE.txt
          sha256sum out/sanguo11-mobile-map-review.apk > out/SHA256SUMS
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, exercise regions and capture actual Android pixels
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e map50 true game.sanguo.mobile.dev.test/game.sanguo.mobile.GameSmokeRunner | tee out/map50-instrumentation.txt
            adb pull /sdcard/Android/data/game.sanguo.mobile.dev/files/smoke out/map50-evidence
            grep -q 'MAP50 PASS:' out/map50-instrumentation.txt
            adb shell am force-stop game.sanguo.mobile.dev
            adb shell am instrument -w -e map51 true game.sanguo.mobile.dev.test/game.sanguo.mobile.GameSmokeRunner | tee out/map51-instrumentation.txt
            adb pull /sdcard/Android/data/game.sanguo.mobile.dev/files/smoke out/map51-evidence
            grep -q 'MAP51 PASS:' out/map51-instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-grid-review-verified
          path: out
          retention-days: 14
          if-no-files-found: error
