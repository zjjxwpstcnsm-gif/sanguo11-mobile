name: Map grid review APK
on:
  push:
    branches: [agent/map-grid-review-20260920]
    paths: [.github/workflows/map-grid-review-workbench.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact locally tested runtime patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib
          encoded=''''''
          data=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(data).hexdigest()=='b8b93ffbaa6c5680012b1a27c376cc3ec569931e6d86f2ec511f6552d929bfb0'
          Path('/tmp/map-runtime.patch').write_bytes(data)
          PY
          git apply --check /tmp/map-runtime.patch
          git apply /tmp/map-runtime.patch
          rm .github/workflows/map-grid-review-workbench.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: staggered square rendering, picking and seams [skip ci]'
          git push origin HEAD:refs/heads/agent/map-grid-review-20260920
          mkdir -p out
          git rev-parse HEAD > out/BUILD_COMMIT
          cp /tmp/map-runtime.patch out/
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify geometry and existing gameplay
        run: |
          set -o pipefail
          bash scripts/test-ui-models.sh | tee out/ui-check.txt
          bash scripts/test-realm52.sh | tee out/rules-check.txt
          python3 scripts/verify-map-release.py | tee out/resource-check.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Build Android
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          python3 tools/check_apk_content.py app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/sanguo11-mobile-map-review.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/sanguo11-mobile-map-review.apk > out/SIGNATURE.txt
          grep -q '8f64ee37f8ff58de8f5a199aac2ae745a5bc927d0d0eabac7540083a5e551f24' out/SIGNATURE.txt
          sha256sum out/sanguo11-mobile-map-review.apk > out/SHA256SUMS
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual installed maps
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e map50 true game.sanguo.mobile.dev.test/game.sanguo.mobile.GameSmokeRunner | tee out/map50-instrumentation.txt
            grep -q 'INSTRUMENTATION_CODE: -1' out/map50-instrumentation.txt
            adb shell am force-stop game.sanguo.mobile.dev
            adb shell am instrument -w -e map51 true game.sanguo.mobile.dev.test/game.sanguo.mobile.GameSmokeRunner | tee out/map51-instrumentation.txt
            grep -q 'INSTRUMENTATION_CODE: -1' out/map51-instrumentation.txt
            adb pull /sdcard/Android/data/game.sanguo.mobile.dev/files/smoke out/installed-map-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-grid-review
          path: out
          retention-days: 14
          if-no-files-found: error
