name: Map57 targeted installed APK delivery
on:
  push:
    branches: [agent/map-tap-void-terrain-fix-v057]
    paths: [.github/workflows/map57-delivery.yml, '.ci/map57-bundle-*.b64', .ci/map57-build-trigger]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: map57-installed-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact verified v057 patch and push real source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if test -f .ci/map57-bundle-01.b64; then
            git merge-base --is-ancestor 7e3d88e5d91f3e398d843d6f8f44c7cab23ea1b5 HEAD
            python3 - <<'PY'
          import base64,hashlib,json,lzma,subprocess
          from pathlib import Path
          raw=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in sorted(Path('.ci').glob('map57-bundle-*.b64'))),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='2a9fe8160acf18cf3af4b04d8070f90b44b7dbddbc324ef1924fa2172478f523'
          bundle=json.loads(raw)
          assert len(bundle['files'])==33
          for name,meta in bundle['files'].items():
              p=Path(name)
              assert not p.is_absolute() and '..' not in p.parts and name not in ('tools/content/materialize_native56.py',)
              assert (hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None)==meta['before'],name
          subprocess.run(['git','apply','--index','--binary','-'],input=bundle['patch'].encode(),check=True)
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())
          assert actual==set(bundle['files'])
          for name,meta in bundle['files'].items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==meta['after'],name
          Path('out/APPLIED_PATCH.json').write_text(json.dumps(bundle['files'],indent=2)+'\n')
          PY
            python3 tools/content/audit_native57.py --check
            python3 scripts/verify-map-release.py
            rm .ci/map57-bundle-*.b64
            git add .ci
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(map): v057 ROAD details, flat roads, explicit void repairs and neutral dam safety'
            git push origin HEAD:agent/map-tap-void-terrain-fix-v057
          fi
          git rev-parse HEAD > out/BUILD_COMMIT
          git status --porcelain > out/WORKTREE_STATUS
          test ! -s out/WORKTREE_STATUS
          cp version.properties out/VERSION
          git archive --format=zip -o out/sanguo11-mobile-v057-source.zip HEAD
          cp docs/validation/v057/source-grid-audit.json out/
          cp data/map/reference-v057/terrain-corrections.json out/
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Targeted terrain, coordinates and retained city rules
        id: core
        continue-on-error: true
        run: bash scripts/test-map57.sh | tee out/map57-core.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Build final source APK and test APK
        id: build
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest | tee out/gradle.txt
          python3 tools/check_apk_content.py app/build/outputs/apk/debug/app-debug.apk | tee out/apk-content.txt
          python3 scripts/verify-map-release.py app/build/outputs/apk/debug/app-debug.apk | tee -a out/apk-content.txt
          sha=$(git rev-parse --short=12 HEAD)
          apk="out/sanguo11-mobile-v0.57.0-$sha.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > out/SIGNATURE.txt
          grep -q '8f64ee37f8ff58de8f5a199aac2ae745a5bc927d0d0eabac7540083a5e551f24' out/SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > out/APK_INFO.txt
          grep -q "versionCode='57' versionName='0.57.0'" out/APK_INFO.txt
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          apk=next(Path('out').glob('sanguo11*.apk'))
          with zipfile.ZipFile(apk) as z:
              native=z.read('maps/national-map-v056.properties').decode()
              assert 'columns=200\n' in native and 'rows=200\n' in native and 'revision=57\n' in native
              art=[n for n in z.namelist() if n.startswith('assets/map/cities-v056/') and n.endswith('.png')]
              assert len(art)==30 and not any('MAP_SAN11' in n for n in z.namelist())
              for n in z.namelist():
                  if n.endswith('.dex'):assert b'Lgame/sanguo/core/MapTap57Fixture;' not in z.read(n)
          Path('out/APK_IDENTITY.json').write_text(json.dumps({'source_sha':Path('out/BUILD_COMMIT').read_text().strip(),'versionName':'0.57.0','versionCode':57,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'bytes':apk.stat().st_size,'native_map_revision':57,'city_pngs':len(art)},indent=2)+'\n')
          PY
          (cd out; sha256sum sanguo11*.apk *source.zip > SHA256SUMS)
      - name: Build unmodified v056 baseline for actual crash reproduction
        id: baseline
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach out/baseline-source 7e3d88e5d91f3e398d843d6f8f44c7cab23ea1b5
          (cd out/baseline-source; ./gradlew --no-daemon :app:assembleDebug) | tee out/baseline-gradle.txt
          cp out/baseline-source/app/build/outputs/apk/debug/app-debug.apk out/baseline-v056.apk
          git worktree remove --force out/baseline-source
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce old crash and verify exact new APK through real touches
        id: installed
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/android-map57.sh
      - name: Record actual outcomes
        if: always()
        env:
          SOURCE: ${{ steps.source.outcome }}
          CORE: ${{ steps.core.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BASELINE: ${{ steps.baseline.outcome }}
          INSTALLED: ${{ steps.installed.outcome }}
        run: |
          mkdir -p out
          python3 - <<'PY'
          import os,json,shutil
          from pathlib import Path
          Path('out/VALIDATION_STATUS.json').write_text(json.dumps({k:os.environ.get(k,'unknown') for k in ['SOURCE','CORE','BUILD','BASELINE','INSTALLED']},indent=2)+'\n')
          shutil.rmtree('out/baseline-source',ignore_errors=True)
          Path('out/baseline-v056.apk').unlink(missing_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map57-installed-delivery
          path: out
          retention-days: 14
          if-no-files-found: error
      - name: Require targeted and installed evidence
        if: always()
        env:
          CORE: ${{ steps.core.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BASELINE: ${{ steps.baseline.outcome }}
          INSTALLED: ${{ steps.installed.outcome }}
        run: test "$CORE" = success && test "$BUILD" = success && test "$BASELINE" = success && test "$INSTALLED" = success
