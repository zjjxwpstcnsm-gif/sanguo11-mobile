name: R00-R14 repeat acceptance evidence snapshot
on:
  push:
    branches: [agent/native-pc-visual]
    paths: [.github/workflows/native-acceptance-repeat-snapshot.yml]
permissions: {contents: read, actions: read}
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Preserve exact source and verify production is unchanged
        run: |
          set -euo pipefail
          mkdir -p out/repeat-snapshot
          git rev-parse HEAD origin/main > out/repeat-snapshot/REFS.txt
          git diff --name-status 5f8997ebfef15f4680931d40532411a336506d0d HEAD > out/repeat-snapshot/CHANGES.txt
          git diff --exit-code 5f8997ebfef15f4680931d40532411a336506d0d HEAD -- app/src/main core game-api game-runtime data unity tools/3d version.properties app/build.gradle > out/repeat-snapshot/PRODUCTION.diff
          git ls-files '*AGENTS.md' > out/repeat-snapshot/AGENTS.txt
          git bundle create out/repeat-snapshot/source.bundle HEAD refs/remotes/origin/main
      - name: Read every attempt, job, artifact and available original log without changing CI or app results
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess, zipfile
          root=pathlib.Path('out/repeat-snapshot'); repo=os.environ['GH_REPO']; records=[]
          def fetch(endpoint, dest):
              dest=root/dest; dest.parent.mkdir(parents=True,exist_ok=True)
              with dest.open('wb') as out:
                  p=subprocess.run(['gh','api','repos/'+repo+'/'+endpoint],stdout=out,stderr=subprocess.PIPE,timeout=240)
              dest.with_suffix(dest.suffix+'.stderr').write_bytes(p.stderr)
              rec={'endpoint':endpoint,'path':str(dest.relative_to(root)),'exit':p.returncode,'bytes':dest.stat().st_size,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}; records.append(rec)
              if p.returncode: return None
              if dest.suffix=='.zip':
                  try:
                      with zipfile.ZipFile(dest) as z: rec.update(entries=len(z.infolist()),crc_error=z.testzip())
                  except Exception as e: rec['archive_error']=str(e)
                  return None
              try: return json.loads(dest.read_text())
              except (UnicodeError,json.JSONDecodeError): return None
          fetch('pulls/67','remote/pr67.json')
          fetch('branches/agent%2Fnative-pc-visual','remote/branch.json')
          fetch('branches/main','remote/main.json')
          fetch('releases?per_page=100','remote/releases-read.json')
          (root/'remote/RELEASE_SCOPE.txt').write_text('Read-only snapshot. No release creation/upload was attempted by this job; a successful GET is not proof of publication rights. Historical HTTP403 remains a historical result.\n')
          for run in [36213760665,36222182595,36222424271]:
              meta=fetch(f'actions/runs/{run}',f'ci/{run}/run.json')
              if not meta: continue
              for attempt in range(1,meta['run_attempt']+1):
                  fetch(f'actions/runs/{run}/attempts/{attempt}',f'ci/{run}/attempt-{attempt}/run.json')
                  page=1
                  while True:
                      data=fetch(f'actions/runs/{run}/attempts/{attempt}/jobs?per_page=100&page={page}',f'ci/{run}/attempt-{attempt}/jobs-{page}.json')
                      if not data: break
                      for job in data.get('jobs',[]):
                          if job['status']=='completed': fetch(f"actions/jobs/{job['id']}/logs",f"ci/{run}/attempt-{attempt}/job-{job['id']}.log")
                      if len(data.get('jobs',[]))<100: break
                      page+=1
                  fetch(f'actions/runs/{run}/attempts/{attempt}/logs',f'ci/{run}/attempt-{attempt}/logs.zip')
              page=1
              while True:
                  data=fetch(f'actions/runs/{run}/artifacts?per_page=100&page={page}',f'ci/{run}/artifacts-{page}.json')
                  if not data or len(data.get('artifacts',[]))<100: break
                  page+=1
          (root/'fetch-manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2)+'\n')
          (root/'SCOPE.txt').write_text('Evidence collection only. A successful snapshot is NOT acceptance PASS. In-progress jobs, missing logs, failed downloads and inherited results remain explicitly separate. No assertions, timeouts, production behavior, assets, rules, saves or source revisions changed.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: native-acceptance-repeat-snapshot, path: out/repeat-snapshot, if-no-files-found: error, retention-days: 14}
