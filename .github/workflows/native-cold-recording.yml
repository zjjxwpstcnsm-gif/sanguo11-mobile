name: Native exact v107 isolated cold start
on:
  push:
    branches: [agent/native-pc-visual]
    paths: ['.github/workflows/native-cold-recording.yml']
permissions:
  actions: read
  contents: write
jobs:
  record:
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with: {packages: ''}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build instrumentation only; preserve exact published production APK
        run: |
          ./gradlew --no-daemon :app:assembleDebugAndroidTest -PnativePcVisual=true -PunityBridgeProbe=false -PmapEditorProbe=true
          mkdir -p app/build/outputs/apk/debug out/remediation /tmp/v107-apk
          gh run download 36120063732 -n native-remediation-api29-apk-00 -D /tmp/v107-apk
          gh run download 36120063732 -n native-remediation-api29-apk-01 -D /tmp/v107-apk
          cat /tmp/v107-apk/remediation-apk-part-00 /tmp/v107-apk/remediation-apk-part-01 > app/build/outputs/apk/debug/app-debug.apk
          echo '0ad4cc9b9e57a4535cddedf2939541a60433bc02c74d0703e6640696172da486  app/build/outputs/apk/debug/app-debug.apk' | sha256sum -c -
          echo a4b09058c6b1ab8c80f57d96f1e22425673de94c > out/remediation/SOURCE_COMMIT
          echo "$GITHUB_SHA" > out/remediation/INSTRUMENTATION_COMMIT
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: bash scripts/verify-native-remediation.sh baseline cold-only
      - name: Preserve and validate exact original recording bytes
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          failed=0
          for video in out/remediation/baseline/*/*.mp4; do
            ffprobe -v error -show_format -show_streams "$video" > "$video.ffprobe.txt" 2>&1 || failed=1
          done
          echo "$failed" > out/remediation/VIDEO_EXIT.txt
          cd out/remediation
          zip -qr ../v107-p0-baseline.zip .
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "exact-v107-p0-baseline-api${{ matrix.api }}", path: out/v107-p0-baseline.zip, retention-days: 14}
