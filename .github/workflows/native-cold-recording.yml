name: Native P0 untouched v105 reproducible controls
on:
  push:
    branches: [agent/native-pc-visual]
    paths: ['.github/workflows/native-cold-recording.yml']
permissions:
  actions: read
  contents: read
jobs:
  record:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 29, mode: cold-only}
          - {api: 29, mode: all}
          - {api: 35, mode: all}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REMEDIATION_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with: {packages: '', log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install byte-identical original v105; only build instrumentation
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebugAndroidTest -PnativePcVisual=true -PunityBridgeProbe=false -PmapEditorProbe=true
          mkdir -p app/build/outputs/apk/debug out/remediation /tmp/control-apk
          gh run download 36108363433 -n native-remediation-api29-apk-00 -D /tmp/control-apk
          gh run download 36108363433 -n native-remediation-api29-apk-01 -D /tmp/control-apk
          cat /tmp/control-apk/remediation-apk-part-00 /tmp/control-apk/remediation-apk-part-01 > app/build/outputs/apk/debug/app-debug.apk
          echo '2b38ca4741b60650be58555ec118350f2aeff292765f6b3754adc138c1fdf55c  app/build/outputs/apk/debug/app-debug.apk' | sha256sum -c -
          echo ef54951dbb7056beaa782f97a3486eefa3a88ef9 > out/remediation/SOURCE_COMMIT
          echo "$GITHUB_SHA" > out/remediation/INSTRUMENTATION_COMMIT
          sha256sum app/build/outputs/apk/debug/app-debug.apk > out/remediation/APK_SHA256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: bash scripts/verify-native-remediation.sh baseline
      - name: Preserve untouched raw evidence even if any later validator fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-v105-api${{ matrix.api }}-${{ matrix.mode }}-raw
          path: out/remediation/
          if-no-files-found: error
          retention-days: 14
      - name: Validate each raw video without interactive stdin
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 scripts/verify-p0-videos.py out/remediation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-v105-api${{ matrix.api }}-${{ matrix.mode }}-video-validation
          path: |
            out/remediation/**/*.ffprobe.json*
            out/remediation/**/*.decode.log*
            out/remediation/VIDEO_*
          if-no-files-found: error
          retention-days: 14
