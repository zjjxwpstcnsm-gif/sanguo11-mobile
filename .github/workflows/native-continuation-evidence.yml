name: Preserve v104-v105 original runtime evidence
on:
  push:
    branches: [agent/native-pc-visual]
    paths: ['.github/workflows/native-continuation-evidence.yml']
permissions:
  actions: read
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait for exact final-source run without changing its conclusion
        run: gh run watch 36108363433 --interval 30 || true
      - name: Preserve original bytes in bounded transfer parts
        run: |
          set -euo pipefail
          mkdir -p raw parts
          for run in 36106137919 36108363433; do
            mkdir -p raw/$run
            gh run download "$run" --pattern 'native-remediation-*-evidence' --dir raw/$run
            gh api repos/$GH_REPO/actions/runs/$run > raw/$run/SOURCE_RUN.json
          done
          find raw -type f -print0 | sort -z | xargs -0 sha256sum > RAW_SHA256.txt
          tar -cf original-evidence.tar raw RAW_SHA256.txt
          sha256sum original-evidence.tar > parts/TRANSFER_SHA256.txt
          split -b 18M -d original-evidence.tar parts/part-
      - uses: actions/upload-artifact@v4
        with:
          name: continuation-transfer-identity
          path: parts/TRANSFER_SHA256.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: continuation-raw-part-00
          path: parts/part-00
          if-no-files-found: ignore
          retention-days: 30
