name: Native date no-recording control on original published APK
on:
  push:
    branches: [agent/native-pc-visual]
    paths: ['.github/workflows/native-date-control.yml']
permissions: {contents: read}
jobs:
  unchanged_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with: {packages: ''}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build test harness; verify original APK bytes without changing production
        run: |
          set -euo pipefail
          mkdir -p out/date-control
          git diff --exit-code 96719e971d74aa2b3f18d66a7f23832148a6dc8b HEAD -- app/src/main core game-api game-runtime data version.properties
          git rev-parse HEAD > out/date-control/INSTRUMENTATION_SOURCE
          ./gradlew --no-daemon :app:assembleDebugAndroidTest -PnativePcVisual=true -PunityBridgeProbe=false -PmapEditorProbe=true > out/date-control/test-build.log 2>&1
          curl -fL --retry 3 https://github.com/zjjxwpstcnsm-gif/sanguo11-mobile/releases/download/native-audit-badd7e56308b/sanguo11-native-r00-r14-audit.apk -o out/date-control/original.apk
          echo 'b4deb41359eb2cedcac949444f87c9454fe020ce5d52b94ab4565e36a79b1687  out/date-control/original.apk' | sha256sum -c -
          sha256sum out/date-control/original.apk > out/date-control/APK_SHA256
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/date-control/original.apk > out/date-control/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/date-control/original.apk > out/date-control/apk-metadata.txt
          printf 'source=badd7e56308b4f6a47d60353d49023be8fc492a2\nrecording=false\nproduction_apk=original published bytes, not rebuilt\n' > out/date-control/CONTROL.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: |
            adb root
            adb wait-for-device
            adb shell setprop dalvik.vm.heapgrowthlimit 256m
            adb shell setprop dalvik.vm.heapsize 512m
            adb shell setprop sys.boot_completed 0
            adb shell stop
            adb shell start
            adb shell 'for i in $(seq 1 60); do [ "$(getprop sys.boot_completed)" = "1" ] && exit 0; sleep 1; done; exit 1'
            adb shell input keyevent 82
            adb install -r out/date-control/original.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm clear game.sanguo.mobile.dev
            adb logcat -c
            control_rc=0; timeout 900 adb shell am instrument -w game.sanguo.mobile.dev.test/game.sanguo.mobile.NativeAuditInstrumentation > out/date-control/interaction.txt 2>&1 || control_rc=$?; printf '%s\n' "$control_rc" > out/date-control/shell-exit.txt
            adb logcat -d > out/date-control/logcat.txt
            adb pull /sdcard/Android/data/game.sanguo.mobile.dev/files/s01 out/date-control/images
            grep -q 'PASS AUDIT' out/date-control/interaction.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-date-original-apk-no-recording
          path: |
            out/date-control/
            !out/date-control/original.apk
          retention-days: 14
