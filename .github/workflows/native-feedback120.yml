name: Native selection forest and ghost feedback v120
on:
  push:
    branches: [agent/native-pc-visual]
    paths: ['.github/workflows/native-feedback120.yml', 'scripts/*feedback120*', 'app/src/**', 'version.properties']
permissions: {contents: read, actions: read}
concurrency: {group: native-feedback120, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with: {packages: '', log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Exact source, protected trees and affected host checks
        run: |
          set -euo pipefail
          mkdir -p out/feedback120
          python3 scripts/verify-candidate-source.py "$GITHUB_SHA" > out/feedback120/source-check.txt
          git diff --exit-code 252aeea39e4b7bdfb0cbdf4cc6884c5b400a45a7 HEAD -- core game-api game-runtime data unity app/src/main/assets > out/feedback120/protected.log
          git merge-base --is-ancestor ac29b458325b52d6e302ca44270d16552de4ed7f HEAD
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/feedback120-json.jar
          export JSON_TEST_JAR=/tmp/feedback120-json.jar
          for suite in test-feedback120 test-native-r09 test-native-r10 test-native-r02 test-native-r01 test-native-r12 test-architecture; do bash scripts/$suite.sh > out/feedback120/$suite.log 2>&1; done
      - name: Original core failure retained
        continue-on-error: true
        run: |
          set +e
          bash scripts/test-core.sh > out/feedback120/core.log 2>&1
          code=$?
          echo "$code" > out/feedback120/core.exit
          git worktree add --detach /tmp/feedback120-input 252aeea39e4b7bdfb0cbdf4cc6884c5b400a45a7
          (cd /tmp/feedback120-input && bash scripts/test-core.sh) > out/feedback120/core-input.log 2>&1
          input=$?
          echo "$input" > out/feedback120/core-input.exit
          exit "$code"
      - name: Build clean exact candidate
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug -PcandidateSource="$GITHUB_SHA" -PnativePcVisual=true -PunityBridgeProbe=false -PmapEditorProbe=true > out/feedback120/build.log 2>&1
          cp app/build/outputs/apk/debug/app-debug.apk out/feedback120/sanguo11-mobile-v120.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk out/feedback120/test.apk
          git rev-parse HEAD > out/feedback120/SOURCE_COMMIT
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/feedback120/sanguo11-mobile-v120.apk > out/feedback120/metadata.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/feedback120/sanguo11-mobile-v120.apk > out/feedback120/signature.txt
          python3 scripts/audit-3d-apk.py out/feedback120/sanguo11-mobile-v120.apk --require-16k > out/feedback120/apk-audit.txt
          python3 scripts/verify-r18-apk.py out/feedback120/sanguo11-mobile-v120.apk "$GITHUB_SHA" > out/feedback120/apk-identity.json
          sha256sum out/feedback120/*.apk > out/feedback120/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: native-feedback120-build, path: out/feedback120/, retention-days: 30, if-no-files-found: error}
  installed:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: {api: [29, 35]}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/download-artifact@v4
        with: {name: native-feedback120-build, path: out/feedback120/}
      - uses: actions/download-artifact@v4
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          run-id: 36518573174
          name: control119-build
          path: out/feedback120/baseline/
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '${{ matrix.api }}'
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: bash scripts/verify-feedback120.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'native-feedback120-api${{ matrix.api }}', path: out/feedback120/runtime/, retention-days: 30}
  physical_access:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read, id-token: write}
    env:
      FIREBASE_PROJECT_ID: '${{ vars.FIREBASE_PROJECT_ID }}'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: google-github-actions/auth@v3
        with:
          project_id: '${{ vars.FIREBASE_PROJECT_ID }}'
          workload_identity_provider: '${{ vars.FIREBASE_WIF_PROVIDER }}'
          service_account: '${{ vars.FIREBASE_SERVICE_ACCOUNT }}'
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read-only free device capacity; no submission or IAM changes
        run: python3 scripts/firebase-evidence-preflight.py --inventory-only
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: native-feedback120-physical-access, path: out/firebase-preflight/, retention-days: 30, if-no-files-found: warn}
