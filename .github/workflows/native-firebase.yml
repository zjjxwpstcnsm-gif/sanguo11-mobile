  recover_audit:
    if: >-
      github.event_name == 'push' && github.event.head_commit.message == 'ci(firebase): recover audit evidence 20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firebase-acceptance-raw
          run-id: 36365917134
          github-token: ${{ github.token }}
          path: recovered
      - name: Lossless bounded archive and small test summary
        run: |
          mkdir -p small parts
          python3 - <<'PY'
          import pathlib,shutil
          for p in pathlib.Path('recovered').rglob('*'):
              if p.is_file() and (p.suffix=='.xml' or p.name in ['acceptance-runtime.txt','cold-runtime.txt','instrumentation.results','PAIR.txt','gcloud.log']):
                  dest=pathlib.Path('small')/p.relative_to('recovered');dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dest)
                  if p.suffix=='.xml':print(p.read_text())
          PY
          tar -czf recovered.tar.gz recovered
          sha256sum recovered.tar.gz > small/ARCHIVE_SHA256.txt
          split -b 20M -d -a 2 recovered.tar.gz parts/recovered.part
