name: Native P0 passive capture control on unchanged APKs
on:
  push:
    branches: [agent/native-pc-visual]
    paths: [.github/workflows/native-p0-capture-control.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture-control:
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with: {packages: '', log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Single declared instrumentation variable, not a replacement for original R12
        run: |
          set -euo pipefail
          mkdir -p out/remediation
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/androidTest/java/game/sanguo/mobile/SceneInstrumentation.java')
          s=p.read_text()
          old='runOnMainSync(()->{try{((com.google.android.filament.Engine)field(view,"engine")).flushAndWait();}catch(Exception e){throw new RuntimeException(e);}});'
          assert s.count(old)==1
          p.write_text(s.replace(old,'android.util.Log.i("SceneAcceptance", "CONTROL passive readiness: no blocking test GPU drain; actual Surface PixelCopy remains required");'))
          PY
          git diff --check
          git diff --exit-code -- app/src/main core game-api game-runtime data version.properties
          git diff > out/remediation/TEST_ONLY_CAPTURE_CONTROL.patch
          echo "$GITHUB_SHA" > out/remediation/INSTRUMENTATION_BASE_COMMIT
          echo 'Only the test main-thread flushAndWait in ready() is absent. All readiness, UI draw, actual Surface, real-touch assertions and original timeout remain. This is an isolation control, not original R12 acceptance.' > out/remediation/CONTROL_SCOPE.txt
      - name: Build instrumentation and install unchanged archived v108 production APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebugAndroidTest -PnativePcVisual=true -PunityBridgeProbe=false -PmapEditorProbe=true
          mkdir -p app/build/outputs/apk/debug /tmp/input-apk
          gh run download 36140301821 -n p0-v108-build -D /tmp/input-apk
          test "$(cat /tmp/input-apk/SOURCE_COMMIT)" = 76c51ece009b6ebeff58b5a05adce4d769a41f30
          (cd /tmp/input-apk && sed 's@out/build/@@g' APK_SHA256.txt | sha256sum -c -)
          cp /tmp/input-apk/sanguo11-mobile-v108.apk app/build/outputs/apk/debug/app-debug.apk
          cp /tmp/input-apk/SOURCE_COMMIT out/remediation/SOURCE_COMMIT
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > out/remediation/APK_SHA256.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: bash scripts/verify-native-remediation.sh baseline
      - name: Preserve raw data independently of all validators
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-passive-v108-api${{ matrix.api }}-raw
          path: out/remediation/
          if-no-files-found: error
          retention-days: 14
      - name: Validate each raw video without interactive stdin
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 scripts/verify-p0-videos.py out/remediation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-passive-v108-api${{ matrix.api }}-video-validation
          path: |
            out/remediation/**/*.ffprobe.json*
            out/remediation/**/*.decode.log*
            out/remediation/VIDEO_*
          if-no-files-found: error
          retention-days: 14
