name: Native P0 passive capture control on unchanged APKs
on:
  push:
    branches: [agent/native-pc-visual]
    paths: [.github/workflows/native-p0-capture-control.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture-control:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 29, version: 105}
          - {api: 29, version: 108}
          - {api: 35, version: 108}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with: {packages: ''}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Declare single test-only variable; preserve every assertion and timeout
        run: |
          set -euo pipefail
          mkdir -p out/remediation
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/androidTest/java/game/sanguo/mobile/SceneInstrumentation.java')
          s=p.read_text()
          old='runOnMainSync(()->{try{((com.google.android.filament.Engine)field(view,"engine")).flushAndWait();}catch(Exception e){throw new RuntimeException(e);}});'
          assert s.count(old)==1
          s=s.replace(old,'android.util.Log.i("SceneAcceptance", "CONTROL passive readiness: no test-only blocking GPU drain; actual Surface PixelCopy still required");')
          p.write_text(s)
          PY
          git diff --check
          git diff --exit-code -- app/src/main core game-api game-runtime data version.properties
          git diff > out/remediation/TEST_ONLY_CAPTURE_CONTROL.patch
          echo "$GITHUB_SHA" > out/remediation/INSTRUMENTATION_BASE_COMMIT
          echo 'Only the test-only main-thread flushAndWait in ready() is absent. All readiness, UI draw, actual Surface, real-touch assertions and 120s timeout remain. This is an isolation control, not a substitute for original R12 acceptance.' > out/remediation/CONTROL_SCOPE.txt
      - name: Build instrumentation, install byte-identical archived production APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebugAndroidTest -PnativePcVisual=true -PunityBridgeProbe=false -PmapEditorProbe=true
          mkdir -p app/build/outputs/apk/debug /tmp/input-apk
          if [ "$VERSION" = 105 ]; then
            gh run download 36108363433 -n native-remediation-api29-apk-00 -D /tmp/input-apk
            gh run download 36108363433 -n native-remediation-api29-apk-01 -D /tmp/input-apk
            cat /tmp/input-apk/remediation-apk-part-00 /tmp/input-apk/remediation-apk-part-01 > app/build/outputs/apk/debug/app-debug.apk
            echo '2b38ca4741b60650be58555ec118350f2aeff292765f6b3754adc138c1fdf55c  app/build/outputs/apk/debug/app-debug.apk' | sha256sum -c -
            echo ef54951dbb7056beaa782f97a3486eefa3a88ef9 > out/remediation/SOURCE_COMMIT
          else
            gh run download 36140301821 -n p0-v108-build -D /tmp/input-apk
            test "$(cat /tmp/input-apk/SOURCE_COMMIT)" = 76c51ece009b6ebeff58b5a05adce4d769a41f30
            (cd /tmp/input-apk && sed 's@out/build/@@g' APK_SHA256.txt | sha256sum -c -)
            cp /tmp/input-apk/sanguo11-mobile-v108.apk app/build/outputs/apk/debug/app-debug.apk
            cp /tmp/input-apk/SOURCE_COMMIT out/remediation/SOURCE_COMMIT
          fi
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > out/remediation/APK_SHA256.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: bash scripts/verify-native-remediation.sh baseline
      - name: Preserve raw outputs and full video decode results
        if: always()
        run: |
          set -uo pipefail
          mkdir -p out/remediation
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          failed=0
          while IFS= read -r -d '' video; do
            rc=0
            ffprobe -v error -show_format -show_streams "$video" > "$video.ffprobe.txt" 2>&1 || rc=$?
            echo "$rc" > "$video.ffprobe.exit"
            [ "$rc" = 0 ] || failed=1
            rc=0
            ffmpeg -v warning -i "$video" -f null - > "$video.decode.txt" 2>&1 || rc=$?
            echo "$rc" > "$video.decode.exit"
            [ "$rc" = 0 ] || failed=1
          done < <(find out/remediation -name '*.mp4' -print0)
          echo "$failed" > out/remediation/VIDEO_EXIT.txt
          (cd out/remediation && zip -qr ../passive-control.zip .)
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-passive-v${{ matrix.version }}-api${{ matrix.api }}
          path: out/passive-control.zip
          retention-days: 14
