name: Native P0 v109 exact-source frame admission verification
on:
  push:
    branches: [agent/native-pc-visual]
    paths: [.github/workflows/native-p0-v109.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: native-p0-v109-delivery
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Require independently preserved original v105 evidence before production modification
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          set -euo pipefail
          mkdir -p out/build /tmp/v105-before
          gh run download 36204061381 -n p0-v105-api29-isolated-cold-raw -D /tmp/v105-before
          test "$(cat /tmp/v105-before/SOURCE_COMMIT)" = ef54951dbb7056beaa782f97a3486eefa3a88ef9
          grep -q 2b38ca4741b60650be58555ec118350f2aeff292765f6b3754adc138c1fdf55c /tmp/v105-before/APK_SHA256.txt
          grep -q 'FAIL COLD_START' /tmp/v105-before/baseline/cold-start/interaction.txt
          test -s /tmp/v105-before/baseline/cold-start/images/cold-national-preview-screen.png
          test -s /tmp/v105-before/baseline/cold-start/remediation-1.mp4
          cp /tmp/v105-before/baseline/cold-start/interaction.txt out/build/V105_BEFORE.txt
          echo 'Raw artifact 10893695919, run 36204061381; original SHA and original strict cold probe preserved before applying production repair.' > out/build/V105_PROVENANCE.txt
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with: {packages: '', log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Reproduce input control-flow defect then apply only the locally verified repair
        run: |
          set -euo pipefail
          input=0
          python3 scripts/test-native-frame-admission.py > out/build/frame-input.log 2>&1 || input=$?
          echo "$input" > out/build/frame-input.exit
          test "$input" = 1
          grep -q 'rejected frames must not attempt GPU preparation' out/build/frame-input.log
          python3 .ci/apply-native-p0-v109.py .
          echo '480a436b3cc829f6930be8c04f6e2d2ecd3f1071f5c949e103dcdef7a5a94eaf  app/src/main/java/game/sanguo/mobile/FilamentMapView.java' | sha256sum -c -
          echo '0f4259e71c4da4e0c6795dc9d98b4e506a506053e269001132f63258233018f5  app/src/androidTest/java/game/sanguo/mobile/NativeColdStartInstrumentation.java' | sha256sum -c -
          echo '8418c14f139293edfad2cda3fe521fd83d8343c68000e4ad7d7550781233d7f4  version.properties' | sha256sum -c -
          git diff --check
          git diff --exit-code -- core game-api game-runtime data app/src/main/assets unity
          git diff > out/build/PRODUCTION.patch
          python3 scripts/check-native-protected-assets.py > out/build/protected-assets.log
          python3 scripts/test-native-frame-admission.py > out/build/frame-candidate.log 2>&1
          bash scripts/test-native-ground-stream.sh > out/build/ground-stream.log 2>&1
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac -PnativePcVisual=true -PunityBridgeProbe=false -PmapEditorProbe=true > out/build/compile-precommit.log 2>&1
      - name: Commit and normal fast-forward push, no main or other branch write
        id: source
        run: |
          set -euo pipefail
          git fetch origin agent/native-pc-visual main
          test "$(git rev-parse origin/agent/native-pc-visual)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 76c51ece009b6ebeff58b5a05adce4d769a41f30 HEAD
          git merge-base --is-ancestor origin/main HEAD
          git config user.name 'Native P0 Repair Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/game/sanguo/mobile/FilamentMapView.java app/src/androidTest/java/game/sanguo/mobile/NativeColdStartInstrumentation.java version.properties
          git diff --cached --check
          git commit -m 'fix(native-p0): honor frame admission before bounded owner GPU updates'
          git push origin HEAD:refs/heads/agent/native-pc-visual
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin refs/heads/agent/native-pc-visual | cut -f1)" = "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$sha" > out/build/SOURCE_COMMIT
          git log -6 --oneline > out/build/COMMITS.txt
      - name: Build APK and instrumentation from this complete committed source SHA
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug -PnativePcVisual=true -PunityBridgeProbe=false -PmapEditorProbe=true > out/build/build.log 2>&1
          cp app/build/outputs/apk/debug/app-debug.apk out/build/sanguo11-mobile-v109.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk out/build/app-debug-androidTest.apk
          sha256sum out/build/*.apk > out/build/APK_SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/build/sanguo11-mobile-v109.apk > out/build/APK_METADATA.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/build/sanguo11-mobile-v109.apk > out/build/APK_SIGNATURE.txt
          grep -q '8f64ee37f8ff58de8f5a199aac2ae745a5bc927d0d0eabac7540083a5e551f24' out/build/APK_SIGNATURE.txt
          grep -q "name='game.sanguo.mobile.dev' versionCode='109'" out/build/APK_METADATA.txt
          unzip -l out/build/sanguo11-mobile-v109.apk > out/build/APK_CONTENTS.txt
          git diff --exit-code
          git bundle create out/build/source.bundle HEAD refs/remotes/origin/main
      - name: Attempt authorized Release, retain truthful outcome and independent artifact
        if: success()
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          set +e
          source=$(cat out/build/SOURCE_COMMIT)
          gh release create native-p0-v109-${source:0:12} out/build/sanguo11-mobile-v109.apk --target "$source" --prerelease --title 'v109 P0 frame-admission candidate (PARTIAL)' --notes 'Same PR67. Exact-source runtime candidate; publication does not assert P0 or visual acceptance. See CI raw evidence and final report.' > out/build/RELEASE_STDOUT.txt 2> out/build/RELEASE_STDERR.txt
          echo $? > out/build/RELEASE_EXIT.txt
          gh api repos/$GH_REPO/releases/tags/native-p0-v109-${source:0:12} > out/build/RELEASE_LOOKUP.json 2> out/build/RELEASE_LOOKUP.stderr
          echo $? > out/build/RELEASE_LOOKUP_EXIT.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: p0-v109-build, path: out/build/, if-no-files-found: error, retention-days: 14}
  host:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.build.outputs.source }}', fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Protected exact source and host dependencies
        run: |
          mkdir -p out/host/logs
          git rev-parse HEAD origin/main > out/host/REFS.txt
          git diff --exit-code 76c51ece009b6ebeff58b5a05adce4d769a41f30 HEAD -- core game-api game-runtime data app/src/main/assets unity > out/host/protected.log
          python3 scripts/check-native-protected-assets.py > out/host/protected-assets.log
          curl -fSL --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/json.jar
          echo JSON_TEST_JAR=/tmp/json.jar >> "$GITHUB_ENV"
      - name: All original host suites and new frame regression
        run: |
          failed=0
          for suite in test-native-r00-r14-audit $(printf 'test-native-r%02d ' $(seq 1 14)) test-architecture test-native-ground-stream; do
            code=0
            bash scripts/$suite.sh > out/host/logs/$suite.log 2>&1 || code=$?
            printf '%s\t%s\n' "$suite" "$code" >> out/host/HOST_EXIT_CODES.tsv
            [ "$code" = 0 ] || failed=1
          done
          code=0
          python3 scripts/test-native-frame-admission.py > out/host/logs/frame-admission.log 2>&1 || code=$?
          printf 'frame-admission\t%s\n' "$code" >> out/host/HOST_EXIT_CODES.tsv
          [ "$code" = 0 ] || failed=1
          exit "$failed"
      - name: Full original core plus every declared input and candidate invocation
        if: always()
        run: |
          set -uo pipefail
          mkdir -p out/host
          git worktree add --detach /tmp/p0-input 76c51ece009b6ebeff58b5a05adce4d769a41f30
          cp scripts/collect-core-results.sh /tmp/p0-input/scripts/collect-core-results.sh
          root="$PWD/out/host"
          a=0; (cd /tmp/p0-input && bash scripts/test-core.sh) > "$root/core-input.log" 2>&1 || a=$?
          b=0; bash scripts/test-core.sh > "$root/core-candidate.log" 2>&1 || b=$?
          printf 'input=%s\ncandidate=%s\n' "$a" "$b" > "$root/CORE_EXIT_CODES.txt"
          a=0; (cd /tmp/p0-input && bash scripts/collect-core-results.sh "$root/core-all-input") > "$root/core-all-input-driver.log" 2>&1 || a=$?
          b=0; bash scripts/collect-core-results.sh "$root/core-all-candidate" > "$root/core-all-candidate-driver.log" 2>&1 || b=$?
          printf 'input=%s\ncandidate=%s\n' "$a" "$b" > "$root/CORE_ALL_EXIT_CODES.txt"
          diff -u "$root/core-all-input/EXIT_CODES.tsv" "$root/core-all-candidate/EXIT_CODES.tsv" > "$root/CORE_ALL_COMPARISON.diff"
          test "$a" = 1 && test "$b" = 1
          grep -q 'CoreTest.logistics(CoreTest.java:75)' "$root/core-input.log"
          grep -q 'CoreTest.logistics(CoreTest.java:75)' "$root/core-candidate.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: p0-v109-host, path: out/host/, retention-days: 14}
  runtime:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 29, scope: all}
          - {api: 29, scope: cold-only}
          - {api: 35, scope: all}
          - {api: 35, scope: cold-only}
          - {api: 35, scope: lifecycle}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.build.outputs.source }}'}
      - uses: actions/download-artifact@v4
        with: {name: p0-v109-build, path: out/build}
      - name: Identity and installed APK paths
        run: |
          set -euo pipefail
          sha256sum -c out/build/APK_SHA256.txt
          mkdir -p app/build/outputs/apk/debug app/build/outputs/apk/androidTest/debug out/remediation
          cp out/build/sanguo11-mobile-v109.apk app/build/outputs/apk/debug/app-debug.apk
          cp out/build/app-debug-androidTest.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          cp out/build/SOURCE_COMMIT out/build/APK_SHA256.txt out/remediation/
          echo '${{ matrix.api }} x86_64 SwANGLE; scope=${{ matrix.scope }}; no ARM64 physical device' > out/remediation/DEVICE_SCOPE.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell getprop > out/remediation/DEVICE_PROPERTIES.txt
            adb shell dumpsys SurfaceFlinger > out/remediation/SURFACEFLINGER_START.txt
            if [ '${{ matrix.scope }}' = lifecycle ]; then python3 -c 'from pathlib import Path; s=Path("scripts/verify-native-remediation.sh").read_text(); marker="if [[ \"${2:-all}\" = cold-only ]]; then"; assert s.count(marker)==1; Path("out/r01-installed.sh").write_text(s.split(marker)[0]+"run_probe NativeR01Instrumentation lifecycle\ngrep -q \"PASS R01\" \"$root/lifecycle/interaction.txt\"\n")'; bash out/r01-installed.sh candidate; else bash scripts/verify-native-remediation.sh candidate '${{ matrix.scope }}'; fi
      - name: Preserve all raw images recordings and logs before any validator
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-v109-api${{ matrix.api }}-${{ matrix.scope }}-raw
          path: out/remediation/
          if-no-files-found: error
          retention-days: 14
      - name: Independent per-segment video validation
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 scripts/verify-p0-videos.py out/remediation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-v109-api${{ matrix.api }}-${{ matrix.scope }}-video-validation
          path: |
            out/remediation/**/*.ffprobe.json*
            out/remediation/**/*.decode.log*
            out/remediation/VIDEO_*
          retention-days: 14
