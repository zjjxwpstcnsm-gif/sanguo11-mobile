name: Native P0 untouched v109 driver and Surface control
on:
  push:
    branches: [agent/native-pc-visual]
    paths: [.github/workflows/native-p0-v110-driver-control.yml]
permissions:
  contents: read
  actions: read
jobs:
  driver:
    strategy:
      fail-fast: false
      matrix: {api: [29, 35]}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: 2cabdc369418a3e6a34f71dde1d700bc5565ad03, persist-credentials: false}
      - name: Verify exact unchanged v109 APK and archived test
        run: |
          set -euo pipefail
          mkdir -p out/remediation /tmp/input app/build/outputs/apk/debug app/build/outputs/apk/androidTest/debug
          gh run download 36204723427 -n p0-v109-build -D /tmp/input
          (cd /tmp/input && sed 's@out/build/@@g' APK_SHA256.txt | sha256sum -c -)
          test "$(cat /tmp/input/SOURCE_COMMIT)" = 1aecc5142ab4b0f2108a0bd04b91422790913f02
          cp /tmp/input/sanguo11-mobile-v109.apk app/build/outputs/apk/debug/app-debug.apk
          cp /tmp/input/app-debug-androidTest.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          cp /tmp/input/SOURCE_COMMIT out/remediation/SOURCE_COMMIT
          cp /tmp/input/APK_SHA256.txt out/remediation/APK_SHA256.txt
          echo 'Observation-only driver-stack sampling. Untouched production and tests, original ready timeout. Sampling can pause process briefly; this control is not performance acceptance.' > out/remediation/CONTROL_SCOPE.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell getprop > out/remediation/DEVICE_PROPERTIES.txt
            bash -c 'mkdir -p out/remediation/observer; (for sample in 1 2 3; do sleep 30; date -u --iso-8601=seconds > out/remediation/observer/time-$sample.txt; adb exec-out screencap -p > out/remediation/observer/screen-$sample.png; timeout 15 adb shell dumpsys SurfaceFlinger > out/remediation/observer/surface-$sample.txt 2>&1; timeout 15 adb shell dumpsys window > out/remediation/observer/window-$sample.txt 2>&1; timeout 15 adb shell dumpsys gfxinfo game.sanguo.mobile.dev framestats > out/remediation/observer/gfx-$sample.txt 2>&1; pid=$(adb shell pidof game.sanguo.mobile.dev | tr -d "\r"); if [[ "$pid" =~ ^[0-9]+$ ]]; then timeout 15 adb shell debuggerd -b "$pid" > out/remediation/observer/threads-$sample.txt 2>&1; else echo "No process; not zero memory" > out/remediation/observer/threads-$sample.txt; fi; done) & observer=$!; bash scripts/verify-native-remediation.sh baseline cold-only; rc=$?; wait "$observer"; exit "$rc"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-v110-driver-v109-api${{ matrix.api }}-raw
          path: out/remediation/
          if-no-files-found: error
          retention-days: 14
