name: Native P0 v110 exact-source overview material verification
on:
  push:
    branches: [agent/native-pc-visual]
    paths: [.github/workflows/native-p0-v110.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: native-p0-v110-delivery
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Require this session's untouched original v105 reproduction
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          set -euo pipefail
          mkdir -p out/build /tmp/v105-before
          gh run download 36208888111 -n p0-v110-before-v105-api29-cold-only-raw -D /tmp/v105-before
          test "$(cat /tmp/v105-before/SOURCE_COMMIT)" = ef54951dbb7056beaa782f97a3486eefa3a88ef9
          grep -q 2b38ca4741b60650be58555ec118350f2aeff292765f6b3754adc138c1fdf55c /tmp/v105-before/APK_SHA256.txt
          grep -q 'FAIL COLD_START' /tmp/v105-before/baseline/cold-start/interaction.txt
          test -s /tmp/v105-before/baseline/cold-start/images/cold-national-preview-screen.png
          test -s /tmp/v105-before/baseline/cold-start/remediation-1.mp4
          cp /tmp/v105-before/baseline/cold-start/interaction.txt out/build/V105_BEFORE.txt
          echo 'Fresh original control run 36208888111, raw artifact 10895146026. Actual national Surface reached; then original UI-overlay-progress assertion failed. Not a reproduced preview timeout in this sample.' > out/build/V105_PROVENANCE.txt
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with: {packages: '', log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Apply guarded real-source repair and compile only two new overview programs
        run: |
          set -euo pipefail
          python3 .ci/apply-native-p0-v110.py . > out/build/APPLY.log
          echo '3a83c6c455b152bccabf2a1b8b6a9280c1c980c2d5804ebb2dfc53848abb25da  app/src/main/java/game/sanguo/mobile/FilamentMapView.java' | sha256sum -c -
          echo '24112c77cdd58fa655e4ad1a45702de29808b3c482c4928eb691edaff1588be3  app/src/main/java/game/sanguo/mobile/TerrainMaterialLod.java' | sha256sum -c -
          python3 scripts/test-native-frame-admission.py > out/build/frame-admission.log 2>&1
          python3 scripts/test-native-overview-material.py > out/build/overview-host.log 2>&1
          mkdir -p /tmp/filament
          curl -fsSL --retry 3 https://github.com/google/filament/releases/download/v1.56.0/filament-v1.56.0-linux.tgz -o /tmp/filament.tgz
          sha256sum /tmp/filament.tgz > out/build/MATC_ARCHIVE_SHA256.txt
          tar xzf /tmp/filament.tgz -C /tmp/filament
          matc=$(find /tmp/filament -type f -name matc | head -1)
          "$matc" --version > out/build/MATC_VERSION.txt
          grep -q 56 out/build/MATC_VERSION.txt
          for name in ground water; do "$matc" -p mobile -a opengl -o app/src/main/assets/3d/terrain/$name-overview.filamat tools/3d/$name-overview.mat; done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('docs/native-pc-visual/remediation-assets.json');m=json.loads(p.read_text())
          for path,sha in m['assets'].items():assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==sha, 'inherited asset changed: '+path
          for name in ('ground','water'):
              asset='app/src/main/assets/3d/terrain/'+name+'-overview.filamat';source='tools/3d/'+name+'-overview.mat'
              sha=hashlib.sha256(Path(asset).read_bytes()).hexdigest();m['assets'][asset]=sha
              m['permitted_changes'][asset]={'runtime_sha256':sha,'source':source,'source_sha256':hashlib.sha256(Path(source).read_bytes()).hexdigest(),'version':'v110 / matc 1.56.0 / camera overview only','source_license':'repository-authored specialization of existing project material; existing project license','regression':'scripts/test-native-overview-material.py; original near programs and all inherited assets hash-identical; installed runtime and visual gates reported separately'}
          m['note']='Four inherited R14 programs plus two individually registered national overview programs. Every inherited runtime asset remains byte-identical; no directory-wide exemption or visual acceptance implied.'
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          git diff --check
          git diff --exit-code -- core game-api game-runtime data unity app/src/androidTest
          git diff > out/build/PRODUCTION.patch
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac -PnativePcVisual=true -PunityBridgeProbe=false -PmapEditorProbe=true > out/build/compile.log 2>&1
      - name: Commit and normal fast-forward push on PR67 branch only
        id: source
        run: |
          set -euo pipefail
          git fetch origin agent/native-pc-visual main
          test "$(git rev-parse origin/agent/native-pc-visual)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 2cabdc369418a3e6a34f71dde1d700bc5565ad03 HEAD
          git merge-base --is-ancestor origin/main HEAD
          git config user.name 'Native P0 Repair Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/game/sanguo/mobile/FilamentMapView.java app/src/main/java/game/sanguo/mobile/TerrainMaterialLod.java tools/3d/ground-overview.mat tools/3d/water-overview.mat app/src/main/assets/3d/terrain/ground-overview.filamat app/src/main/assets/3d/terrain/water-overview.filamat docs/native-pc-visual/remediation-assets.json version.properties
          git diff --cached --check
          git commit -m 'fix(native-p0): specialize national terrain materials with bounded owner LOD transitions'
          python3 scripts/check-native-protected-assets.py > out/build/protected-assets.log
          git push origin HEAD:refs/heads/agent/native-pc-visual
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin refs/heads/agent/native-pc-visual | cut -f1)" = "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$sha" > out/build/SOURCE_COMMIT
          git log -8 --oneline > out/build/COMMITS.txt
      - name: Build exact committed APK and original strict instrumentation
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug -PnativePcVisual=true -PunityBridgeProbe=false -PmapEditorProbe=true > out/build/build.log 2>&1
          cp app/build/outputs/apk/debug/app-debug.apk out/build/sanguo11-mobile-v110.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk out/build/app-debug-androidTest.apk
          sha256sum out/build/*.apk > out/build/APK_SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/build/sanguo11-mobile-v110.apk > out/build/APK_METADATA.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/build/sanguo11-mobile-v110.apk > out/build/APK_SIGNATURE.txt
          grep -q '8f64ee37f8ff58de8f5a199aac2ae745a5bc927d0d0eabac7540083a5e551f24' out/build/APK_SIGNATURE.txt
          grep -q "name='game.sanguo.mobile.dev' versionCode='110'" out/build/APK_METADATA.txt
          unzip -l out/build/sanguo11-mobile-v110.apk > out/build/APK_CONTENTS.txt
          git diff --exit-code
          git bundle create out/build/source.bundle HEAD refs/remotes/origin/main
          printf '%s\n' './gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug -PnativePcVisual=true -PunityBridgeProbe=false -PmapEditorProbe=true' > out/build/BUILD_COMMAND.txt
      - name: Attempt authorized prerelease and record actual publication result
        if: success()
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          set +e
          source=$(cat out/build/SOURCE_COMMIT)
          gh release create native-p0-v110-${source:0:12} out/build/sanguo11-mobile-v110.apk --target "$source" --prerelease --title 'v110 P0 national-material candidate (PARTIAL)' --notes 'Exact-source candidate on PR67. Runtime and whole-screen UI gates are not implied by publication. See original/control/candidate evidence and final report.' > out/build/RELEASE_STDOUT.txt 2> out/build/RELEASE_STDERR.txt
          echo $? > out/build/RELEASE_EXIT.txt
          gh api repos/$GH_REPO/releases/tags/native-p0-v110-${source:0:12} > out/build/RELEASE_LOOKUP.json 2> out/build/RELEASE_LOOKUP.stderr
          echo $? > out/build/RELEASE_LOOKUP_EXIT.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: p0-v110-build, path: out/build/, if-no-files-found: error, retention-days: 14}
  host:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.build.outputs.source }}', fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Exact source, protected logic and inherited assets
        run: |
          mkdir -p out/host/logs
          git rev-parse HEAD origin/main > out/host/REFS.txt
          git diff --exit-code 2cabdc369418a3e6a34f71dde1d700bc5565ad03 HEAD -- core game-api game-runtime data unity app/src/androidTest > out/host/protected.log
          python3 scripts/check-native-protected-assets.py > out/host/protected-assets.log
          curl -fSL --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/json.jar
          echo JSON_TEST_JAR=/tmp/json.jar >> "$GITHUB_ENV"
      - name: Original host suites and owner/material regressions
        run: |
          failed=0
          for suite in test-native-r00-r14-audit $(printf 'test-native-r%02d ' $(seq 1 14)) test-architecture test-native-ground-stream; do
            code=0; bash scripts/$suite.sh > out/host/logs/$suite.log 2>&1 || code=$?
            printf '%s\t%s\n' "$suite" "$code" >> out/host/HOST_EXIT_CODES.tsv
            [ "$code" = 0 ] || failed=1
          done
          for suite in test-native-frame-admission test-native-overview-material; do
            code=0; python3 scripts/$suite.py > out/host/logs/$suite.log 2>&1 || code=$?
            printf '%s\t%s\n' "$suite" "$code" >> out/host/HOST_EXIT_CODES.tsv
            [ "$code" = 0 ] || failed=1
          done
          exit "$failed"
      - name: Full original core and every input/candidate invocation without assertion edits
        if: always()
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/p0-input 2cabdc369418a3e6a34f71dde1d700bc5565ad03
          root="$PWD/out/host"
          a=0; (cd /tmp/p0-input && bash scripts/test-core.sh) > "$root/core-input.log" 2>&1 || a=$?
          b=0; bash scripts/test-core.sh > "$root/core-candidate.log" 2>&1 || b=$?
          printf 'input=%s\ncandidate=%s\n' "$a" "$b" > "$root/CORE_EXIT_CODES.txt"
          test "$a" = "$b"
          grep -q 'CoreTest.logistics(CoreTest.java:75)' "$root/core-input.log"
          grep -q 'CoreTest.logistics(CoreTest.java:75)' "$root/core-candidate.log"
          a=0; (cd /tmp/p0-input && bash scripts/collect-core-results.sh "$root/core-all-input") > "$root/core-all-input-driver.log" 2>&1 || a=$?
          b=0; bash scripts/collect-core-results.sh "$root/core-all-candidate" > "$root/core-all-candidate-driver.log" 2>&1 || b=$?
          printf 'input=%s\ncandidate=%s\n' "$a" "$b" > "$root/CORE_ALL_EXIT_CODES.txt"
          diff -u "$root/core-all-input/EXIT_CODES.tsv" "$root/core-all-candidate/EXIT_CODES.tsv" > "$root/CORE_ALL_COMPARISON.diff"
          test "$a" = "$b"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: p0-v110-host, path: out/host/, retention-days: 14}
  runtime:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 29, scope: all}
          - {api: 29, scope: cold-only}
          - {api: 35, scope: all}
          - {api: 35, scope: cold-only}
          - {api: 35, scope: lifecycle}
          - {api: 35, scope: parity}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.build.outputs.source }}'}
      - uses: actions/download-artifact@v4
        with: {name: p0-v110-build, path: out/build}
      - name: Install the exact same candidate APK in every scope
        run: |
          set -euo pipefail
          sha256sum -c out/build/APK_SHA256.txt
          mkdir -p app/build/outputs/apk/debug app/build/outputs/apk/androidTest/debug out/remediation
          cp out/build/sanguo11-mobile-v110.apk app/build/outputs/apk/debug/app-debug.apk
          cp out/build/app-debug-androidTest.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          cp out/build/SOURCE_COMMIT out/build/APK_SHA256.txt out/remediation/
          echo '${{ matrix.api }} x86_64 SwANGLE; scope=${{ matrix.scope }}; no ARM64 physical device' > out/remediation/DEVICE_SCOPE.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell getprop > out/remediation/DEVICE_PROPERTIES.txt
            adb shell dumpsys SurfaceFlinger > out/remediation/SURFACEFLINGER_START.txt
            if [ '${{ matrix.scope }}' = lifecycle ] || [ '${{ matrix.scope }}' = parity ]; then python3 -c 'from pathlib import Path; import sys; scope=sys.argv[1]; cls,mark=("NativeR01Instrumentation","PASS R01") if scope=="lifecycle" else ("NativeP0ParityInstrumentation","PASS P0_PARITY"); s=Path("scripts/verify-native-remediation.sh").read_text(); marker="if [[ \"${2:-all}\" = cold-only ]]; then"; assert s.count(marker)==1; Path("out/selected-installed.sh").write_text(s.split(marker)[0]+"run_probe "+cls+" "+scope+"\ngrep -q \""+mark+"\" \"$root/"+scope+"/interaction.txt\"\n")' '${{ matrix.scope }}'; bash out/selected-installed.sh candidate; else bash scripts/verify-native-remediation.sh candidate '${{ matrix.scope }}'; fi
      - name: Preserve raw images videos logs and exit codes before validation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-v110-api${{ matrix.api }}-${{ matrix.scope }}-raw
          path: out/remediation/
          if-no-files-found: error
          retention-days: 14
      - name: Validate every video segment independently
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 scripts/verify-p0-videos.py out/remediation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-v110-api${{ matrix.api }}-${{ matrix.scope }}-video-validation
          path: |
            out/remediation/**/*.ffprobe.json*
            out/remediation/**/*.decode.log*
            out/remediation/VIDEO_*
          retention-days: 14
