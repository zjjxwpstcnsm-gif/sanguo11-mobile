name: Native P0 original v105 Window loss causal control
on:
  push:
    branches: [agent/native-pc-visual]
    paths: [.github/workflows/native-p0-window-v105-control.yml]
permissions: {contents: read, actions: read}
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Original APK and identical diagnostic probe, no production or test edits
        run: |
          set -euo pipefail
          mkdir -p out/remediation /tmp/original /tmp/probe app/build/outputs/apk/debug app/build/outputs/apk/androidTest/debug
          gh run download 36108363433 -n native-remediation-api29-apk-00 -D /tmp/original
          gh run download 36108363433 -n native-remediation-api29-apk-01 -D /tmp/original
          cat /tmp/original/remediation-apk-part-00 /tmp/original/remediation-apk-part-01 > app/build/outputs/apk/debug/app-debug.apk
          echo '2b38ca4741b60650be58555ec118350f2aeff292765f6b3754adc138c1fdf55c  app/build/outputs/apk/debug/app-debug.apk' | sha256sum -c -
          gh run download 36210439423 -n p0-v109-api29-window-loss-control-raw -D /tmp/probe
          cp /tmp/probe/diagnostic-androidTest.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          cp /tmp/probe/DIAGNOSTIC_SOURCE_SHA256.txt /tmp/probe/SCOPE.txt out/remediation/
          echo ef54951dbb7056beaa782f97a3486eefa3a88ef9 > out/remediation/SOURCE_COMMIT
          echo 784aa748f371ed07f915dc0d0e030c8db895ee59 > out/remediation/INSTRUMENTATION_RECIPE_COMMIT
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > out/remediation/APK_SHA256.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell getprop > out/remediation/DEVICE_PROPERTIES.txt
            python3 -c 'from pathlib import Path; s=Path("scripts/verify-native-remediation.sh").read_text(); marker="if [[ \"${2:-all}\" = cold-only ]]; then"; assert s.count(marker)==1; Path("out/window-loss-control.sh").write_text(s.split(marker)[0]+"run_probe NativeWindowLossControl window-loss-control\ngrep -q \"DIAGNOSTIC_BACKING_REACQUIRED\" \"$root/window-loss-control/interaction.txt\"\n")'
            bash out/window-loss-control.sh baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: p0-v105-api29-window-loss-control-raw, path: out/remediation/, if-no-files-found: error, retention-days: 14}
      - name: Validate each diagnostic video independently
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 scripts/verify-p0-videos.py out/remediation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-v105-api29-window-loss-control-video-validation
          path: |
            out/remediation/**/*.ffprobe.json*
            out/remediation/**/*.decode.log*
            out/remediation/VIDEO_*
          retention-days: 14
