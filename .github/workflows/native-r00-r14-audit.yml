name: Native R00-R14 audit and exact APK
on:
  push:
    branches: [agent/native-pc-visual]
    paths:
      - '.github/workflows/native-r00-r14-audit.yml'
      - 'scripts/*r00-r14*'
      - 'app/src/main/java/game/sanguo/mobile/MapHost.java'
      - 'app/src/main/java/game/sanguo/mobile/SceneRenderGate.java'
      - 'app/src/androidTest/java/game/sanguo/mobile/NativeAuditInstrumentation.java'
permissions:
  contents: write
concurrency:
  group: native-r00-r14-audit-${{ github.sha }}
  cancel-in-progress: false
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Exact source, ancestry and immutable rules/assets
        run: |
          set -euo pipefail
          mkdir -p out/audit/host-logs
          git rev-parse HEAD origin/main > out/audit/refs.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor origin/main HEAD
          git diff --exit-code eeb09b4b0037a482b440816ec2fe718c9701ab75 HEAD -- core game-api game-runtime data app/src/main/assets unity > out/audit/protected.log
          curl -fSL --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/json.jar
          echo JSON_TEST_JAR=/tmp/json.jar >> "$GITHUB_ENV"
      - name: Execute all R01-R14 host suites and architecture
        run: |
          set -euo pipefail
          failed=0
          for suite in test-native-r00-r14-audit $(printf 'test-native-r%02d ' $(seq 1 14)) test-architecture; do
            code=0
            bash "scripts/$suite.sh" > "out/audit/host-logs/$suite.log" 2>&1 || code=$?
            printf '%s\t%s\n' "$suite" "$code" | tee -a out/audit/HOST_EXIT_CODES.tsv
            if [ "$code" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Independently retain baseline and candidate full-core outcomes
        if: always()
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/audit-core-baseline eeb09b4b0037a482b440816ec2fe718c9701ab75
          baseline=0
          (cd /tmp/audit-core-baseline && bash scripts/test-core.sh) > out/audit/core-baseline.log 2>&1 || baseline=$?
          candidate=0
          bash scripts/test-core.sh > out/audit/core-candidate.log 2>&1 || candidate=$?
          printf 'baseline=%s\ncandidate=%s\n' "$baseline" "$candidate" > out/audit/CORE_EXIT_CODES.txt
          # Classification checks only: both raw full-core failures remain failures.
          test "$baseline" -ne 0
          test "$baseline" -eq "$candidate"
          grep -q 'AI uses deployment commands' out/audit/core-baseline.log
          grep -q 'AI uses deployment commands' out/audit/core-candidate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: native-audit-host, path: out/audit/, retention-days: 14}
  android:
    strategy:
      fail-fast: false
      matrix: {mode: [baseline, candidate]}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with: {packages: ''}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Exact candidate or unchanged-production baseline reproduction
        env: {MODE: '${{ matrix.mode }}'}
        run: |
          set -euo pipefail
          mkdir -p out/audit
          echo "$GITHUB_SHA" > out/audit/CANDIDATE_COMMIT
          if [ "$MODE" = baseline ]; then
            cp app/src/androidTest/java/game/sanguo/mobile/NativeAuditInstrumentation.java /tmp/NativeAuditInstrumentation.java
            cp scripts/verify-native-r00-r14-audit.sh /tmp/verify-native-r00-r14-audit.sh
            git checkout --detach eeb09b4b0037a482b440816ec2fe718c9701ab75
            cp /tmp/NativeAuditInstrumentation.java app/src/androidTest/java/game/sanguo/mobile/
            cp /tmp/verify-native-r00-r14-audit.sh scripts/
            python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/androidTest/AndroidManifest.xml')
          p.write_text(p.read_text().replace('</manifest>','<instrumentation android:name="game.sanguo.mobile.NativeAuditInstrumentation" android:targetPackage="game.sanguo.mobile.dev" android:functionalTest="true" />\n</manifest>'))
          PY
            git diff --exit-code -- app/src/main core game-api game-runtime data
            git diff > out/audit/BASELINE_TEST_ONLY.patch
          else
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          git rev-parse HEAD > out/audit/SOURCE_COMMIT
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug -PnativePcVisual=true -PunityBridgeProbe=false -PmapEditorProbe=true 2>&1 | tee out/audit/build.log
          if [ "$MODE" = candidate ]; then
            cp app/build/outputs/apk/debug/app-debug.apk out/audit/sanguo11-native-r00-r14-audit.apk
            sha256sum out/audit/*.apk > out/audit/APK_SHA256
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/audit/*.apk > out/audit/apk-metadata.txt
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/audit/*.apk > out/audit/signature.txt
            unzip -l out/audit/*.apk > out/audit/apk-contents.txt
            split -b 18M -d out/audit/sanguo11-native-r00-r14-audit.apk out/audit-apk-part-
            git diff --exit-code
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.mode == 'candidate'
        with: {name: native-audit-apk-00, path: out/audit-apk-part-00, retention-days: 14}
      - uses: actions/upload-artifact@v4
        if: matrix.mode == 'candidate'
        with: {name: native-audit-apk-01, path: out/audit-apk-part-01, retention-days: 14}
      - uses: actions/upload-artifact@v4
        if: matrix.mode == 'candidate'
        with:
          name: native-audit-build-identity
          path: |
            out/audit/SOURCE_COMMIT
            out/audit/CANDIDATE_COMMIT
            out/audit/APK_SHA256
            out/audit/apk-*.txt
            out/audit/signature.txt
            out/audit/build.log
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: bash scripts/verify-native-r00-r14-audit.sh ${{ matrix.mode }}
      - name: Package raw outcomes and actual capture review
        if: always()
        env: {MODE: '${{ matrix.mode }}'}
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          import os,json,zipfile
          from pathlib import Path
          from PIL import Image
          root=Path('out/audit'); review=Path('out/audit-review'); review.mkdir(exist_ok=True)
          (root/'manifest.json').write_text(json.dumps({'candidate':os.environ['GITHUB_SHA'],'mode':os.environ['MODE'],'run':os.environ['GITHUB_RUN_ID'],'device':'API29 x86_64 SwANGLE','physical':'NOT_RUN','art':'NOT_ACCEPTED','note':'Baseline instrumentation failure is retained, not a gameplay PASS.'},indent=2))
          for p in root.rglob('*'):
              if not p.is_file():continue
              name='__'.join(p.relative_to(root).parts)
              if p.suffix=='.png':
                  im=Image.open(p).convert('RGB');im.thumbnail((1600,1600));im.save(review/(name+'.jpg'),quality=90)
              elif p.suffix in ('.txt','.log','.json','.tsv','.patch') or p.name in ('SOURCE_COMMIT','CANDIDATE_COMMIT','APK_SHA256'):
                  (review/name).write_bytes(p.read_bytes())
          with zipfile.ZipFile('out/audit-evidence.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix!='.apk':z.write(p,p.relative_to(root))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-audit-${{ matrix.mode }}-evidence
          path: out/audit-evidence.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-audit-${{ matrix.mode }}-review
          path: out/audit-review/
          retention-days: 14
      - name: Publish exact-source candidate with raw failed gates preserved
        if: always() && matrix.mode == 'candidate'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test -f out/audit/sanguo11-native-r00-r14-audit.apk || exit 0
          tag="native-audit-${GITHUB_SHA:0:12}"
          printf 'R00-R14 audit candidate source %s. PARTIAL: consult raw runtime and audit report. Physical ARM64 and PC-art acceptance are not claimed. No main merge or R15.\n' "$GITHUB_SHA" > out/audit-release.txt
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "R00-R14 audit ${GITHUB_SHA:0:12}" --notes-file out/audit-release.txt out/audit/sanguo11-native-r00-r14-audit.apk out/audit-evidence.zip
