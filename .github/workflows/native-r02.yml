name: Native R02 camera picking and input
on:
  pull_request:
    branches: [main]
    paths: ['app/**', 'version.properties', 'scripts/*r02*', '.github/workflows/native-r02.yml']
permissions:
  contents: read
concurrency:
  group: native-r02
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Host boundaries and regression
        run: |
          mkdir -p out/r02
          git rev-parse HEAD > out/r02/SOURCE_SHA
          set -o pipefail
          for suite in test-native-r02 test-native-r01 test-architecture test-3d-foundation test-3d-interaction; do
            bash scripts/$suite.sh 2>&1 | tee out/r02/$suite.log
          done
      - name: Build exact source
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug -PnativePcVisual=true 2>&1 | tee out/r02/build.log
          cp app/build/outputs/apk/debug/app-debug.apk out/r02/sanguo11-native-r02.apk
          sha256sum out/r02/sanguo11-native-r02.apk > out/r02/APK_SHA256
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/r02/sanguo11-native-r02.apk > out/r02/apk-metadata.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/r02/sanguo11-native-r02.apk > out/r02/signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-r02-apk
          path: out/r02/
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: bash scripts/verify-native-r02.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-r02-evidence
          path: out/r02/
          retention-days: 14
