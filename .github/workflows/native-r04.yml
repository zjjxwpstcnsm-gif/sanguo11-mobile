name: Native R04 continuous ground materials
on:
  pull_request:
    branches: [main]
    paths: ['app/**', 'version.properties', 'scripts/*r04*', 'tools/3d/**', '.github/workflows/native-r04.yml']
permissions:
  contents: read
concurrency:
  group: native-r04
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Host boundaries and regression
        run: |
          mkdir -p out/r04
          git rev-parse HEAD > out/r04/SOURCE_SHA
          set -o pipefail
          for suite in test-native-r04 test-native-r03 test-native-r02 test-native-r01 test-architecture test-3d-nationwide test-3d-interaction; do
            bash scripts/$suite.sh 2>&1 | tee out/r04/$suite.log
          done
      - name: Verify textures and exact material compiler
        run: |
          python3 -m pip install numpy Pillow
          python3 scripts/verify-terrain-materials.py | tee out/r04/assets.log
          curl -fsSL --retry 3 https://github.com/google/filament/releases/download/v1.56.0/filament-v1.56.0-linux.tgz -o /tmp/filament.tgz
          tar -xzf /tmp/filament.tgz -C /tmp
          test "$(/tmp/filament/bin/matc --version)" = 56
          /tmp/filament/bin/matc -p mobile -a opengl -o /tmp/ground.filamat tools/3d/ground.mat
          cmp /tmp/ground.filamat app/src/main/assets/3d/terrain/ground.filamat
      - name: Build exact source
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug -PnativePcVisual=true 2>&1 | tee out/r04/build.log
          cp app/build/outputs/apk/debug/app-debug.apk out/r04/sanguo11-native-r04.apk
          sha256sum out/r04/sanguo11-native-r04.apk > out/r04/APK_SHA256
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/r04/sanguo11-native-r04.apk > out/r04/apk-metadata.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/r04/sanguo11-native-r04.apk > out/r04/signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-r04-apk
          path: out/r04/
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: bash scripts/verify-native-r04.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-r04-evidence
          path: out/r04/
          retention-days: 14
