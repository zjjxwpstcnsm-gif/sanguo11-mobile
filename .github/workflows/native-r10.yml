name: Native R10 formations and authoritative motion
on:
  push:
    branches: [agent/native-pc-visual]
    paths: ['.ci/native-r10-*.b64', '.github/workflows/native-r10.yml', 'app/**', 'tools/3d/**', 'core/src/testFixtures/java/game/sanguo/core/UnitR10Fixture.java', 'scripts/*r10*', 'version.properties']
permissions:
  contents: write
concurrency:
  group: native-r10-delivery
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply audited exact text patch if present
        run: |
          set -euo pipefail
          mkdir -p out/r10
          git rev-parse HEAD > out/r10/TRANSPORT_COMMIT
          if test -f .ci/native-r10-0.b64; then
            python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          raw=''.join(Path(f'.ci/native-r10-{i}.b64').read_text().strip() for i in range(4))
          data=lzma.decompress(base64.b64decode(raw,validate=True))
          assert len(data)==84749
          assert hashlib.sha256(data).hexdigest()=='25271995ba0498c9a3f0c2dcf1988b14b065e2ea7ddbd3cb87336bba563fd19d'
          Path('/tmp/native-r10.patch').write_bytes(data)
          PY
            git apply --check --unidiff-zero /tmp/native-r10.patch
            git apply --unidiff-zero /tmp/native-r10.patch
            echo R10_APPLIED=true >> "$GITHUB_ENV"
          fi
      - name: Pinned export and material toolchain
        run: |
          set -euo pipefail
          python -m pip install -r tools/3d/texture-requirements.txt
          curl -fSL --retry 3 --retry-all-errors https://github.com/google/filament/releases/download/v1.56.0/filament-v1.56.0-linux.tgz -o /tmp/filament.tgz
          tar -xzf /tmp/filament.tgz -C /tmp
          test "$(/tmp/filament/bin/matc --version)" = 56
          for origin in https://repo.maven.apache.org/maven2 https://repo1.maven.org/maven2 https://maven-central.storage-download.googleapis.com/maven2; do
            if curl -fSL --max-time 35 "$origin/org/json/json/20240303/json-20240303.jar" -o /tmp/json.jar; then
              echo "$origin" > out/r10/JSON_ORIGIN
              break
            fi
          done
          test -s /tmp/json.jar
          echo JSON_TEST_JAR=/tmp/json.jar >> "$GITHUB_ENV"
          sha256sum /tmp/json.jar /tmp/filament.tgz > out/r10/TOOLCHAIN_SHA256
      - name: Reproducible runtime resources
        run: |
          set -euo pipefail
          if test "${R10_APPLIED:-false}" = true; then
            python tools/3d/asset_pipeline.py 2>&1 | tee out/r10/export.log
            /tmp/filament/bin/matc -p mobile -a opengl -o app/src/main/assets/3d/field/unit.filamat tools/3d/unit.mat
          fi
          python tools/3d/asset_pipeline.py --check 2>&1 | tee out/r10/reproducibility.log
          /tmp/filament/bin/matc -p mobile -a opengl -o /tmp/unit.filamat tools/3d/unit.mat
          cmp /tmp/unit.filamat app/src/main/assets/3d/field/unit.filamat
          npm ci --prefix tools/3d --ignore-scripts
          npm run validate --prefix tools/3d
          cp out/r06/khronos.json out/r10/khronos.json
          python scripts/check-architecture.py | tee out/r10/architecture-boundaries.log
          git diff --check
          test -z "$(git diff --name-only -- core/src/main game-api game-runtime app/src/main/assets/maps)"
          test -z "$(git diff --name-only -- app/src/main/assets/3d/sites app/src/main/assets/3d/terrain)"
      - name: Commit and fast-forward exact production sources
        if: env.R10_APPLIED == 'true'
        run: |
          set -euo pipefail
          git fetch origin agent/native-pc-visual main
          test "$(git rev-parse origin/agent/native-pc-visual)" = "$GITHUB_SHA"
          git merge-base --is-ancestor origin/main HEAD
          git config user.name 'sanguo11 R10 agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main app/src/androidTest app/src/test core/src/testFixtures tools/3d scripts docs version.properties
          git rm .ci/native-r10-0.b64 .ci/native-r10-1.b64 .ci/native-r10-2.b64 .ci/native-r10-3.b64
          git commit -m 'native-pc/R10: terrain-conforming instanced formations, unit rigs and exact journal validation'
          git push origin HEAD:refs/heads/agent/native-pc-visual
      - name: Capture exact source identity and bundle
        run: |
          git rev-parse HEAD > out/r10/SOURCE_COMMIT
          git rev-parse origin/main > out/r10/MAIN_COMMIT
          git diff --stat 7256316c779637ae678d98aca1abc2064fad6370 HEAD > out/r10/source-changes.txt
          mkdir -p /tmp/native-r10-final-source
          git bundle create /tmp/native-r10-final-source/source.bundle HEAD refs/remotes/origin/main
          cp out/r10/SOURCE_COMMIT /tmp/native-r10-final-source/
      - uses: actions/upload-artifact@v4
        with:
          name: native-r10-production-source
          path: /tmp/native-r10-final-source/
          retention-days: 7
      - name: Affected host and architecture regression
        run: |
          set -euo pipefail
          for suite in test-native-r10 test-native-r09 test-3d-foundation test-3d-interaction test-3d-combat test-architecture; do
            bash scripts/$suite.sh 2>&1 | tee out/r10/$suite.log
          done
      - name: Retain inherited full core result without suppressing assertions
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/test-core.sh 2>&1 | tee out/r10/core-regression.log
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build exact source APK and instrumentation
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug -PnativePcVisual=true 2>&1 | tee out/r10/build.log
          cp app/build/outputs/apk/debug/app-debug.apk out/r10/sanguo11-native-r10.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk out/r10/r10-instrumentation.apk
          sha256sum out/r10/*.apk > out/r10/APK_SHA256
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/r10/sanguo11-native-r10.apk > out/r10/apk-metadata.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/r10/sanguo11-native-r10.apk > out/r10/signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-r10-apk
          path: out/r10/
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: bash scripts/verify-native-r10.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-r10-evidence
          path: out/r10/
          retention-days: 14
