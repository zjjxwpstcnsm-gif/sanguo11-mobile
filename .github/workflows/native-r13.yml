name: Native R13 editor and custom save integration
# Exact-source editor, graphics and custom-campaign delivery
on:
  push:
    branches: [agent/native-pc-visual]
    paths: ['.github/workflows/native-r13.yml']
permissions:
  contents: write
concurrency:
  group: native-r13-delivery
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Exact identity and protected gameplay
        run: |
          set -euo pipefail
          mkdir -p out/r13
          git rev-parse HEAD > out/r13/SOURCE_COMMIT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git diff --exit-code 0fdd96fe18a70a5617a250a4bb31650e7cae0705 HEAD -- game-api game-runtime data app/src/main/assets core/src/main/java/game/sanguo/core/SaveCodec.java > out/r13/protected-cohorts.log
          git diff --stat e581b27064d71ebea4d476c6f7abaa7281de34c8 HEAD > out/r13/source-changes.txt
          curl -fSL --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/json.jar
          echo JSON_TEST_JAR=/tmp/json.jar >> "$GITHUB_ENV"
      - name: Host geometry, authority and architecture
        run: |
          set -euo pipefail
          for suite in test-native-r13 test-native-r12 test-architecture; do
            bash scripts/$suite.sh 2>&1 | tee out/r13/$suite.log
          done
      - name: Retain inherited full core result
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/test-core.sh 2>&1 | tee out/r13/core-regression.log
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build source-matched APK, tests and lint
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug -PnativePcVisual=true -PunityBridgeProbe=false -PmapEditorProbe=true 2>&1 | tee out/r13/build.log
          cp app/build/outputs/apk/debug/app-debug.apk out/r13/sanguo11-native-r13.apk
          sha256sum out/r13/*.apk > out/r13/APK_SHA256
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/r13/sanguo11-native-r13.apk > out/r13/apk-metadata.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/r13/sanguo11-native-r13.apk > out/r13/signature.txt
          unzip -l out/r13/sanguo11-native-r13.apk > out/r13/apk-contents.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: native-r13-apk
          path: out/r13/
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: bash scripts/verify-native-r13.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-r13-evidence
          path: |
            out/r13/
            out/editor67/
          retention-days: 14
      - name: Publish exact-source candidate and raw evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f out/r13/sanguo11-native-r13.apk || exit 0
          python3 - <<'PY'
          import os,zipfile,json
          from pathlib import Path
          root=Path('out/r13')
          (root/'manifest.json').write_text(json.dumps({'stage':'R13','source':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'backend':'Filament1.56/OpenGL','physical':'NOT_RUN','visual':'PARTIAL','runtime_log':'interaction.txt'},indent=2))
          with zipfile.ZipFile('out/r13-evidence.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix!='.apk': z.write(p,p.relative_to(root))
              for p in Path('out/editor67').rglob('*'):
                  if p.is_file(): z.write(p,Path('editor67')/p.relative_to('out/editor67'))
          PY
          tag="native-r13-${GITHUB_SHA:0:12}"
          printf 'R13 source %s. PARTIAL candidate: inspect interaction.txt for installed outcome. Physical ARM64 and PC art NOT accepted. No main merge.\n' "$GITHUB_SHA" > out/r13-release.txt
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "Native R13 ${GITHUB_SHA:0:12}" --notes-file out/r13-release.txt out/r13/sanguo11-native-r13.apk out/r13-evidence.zip
# Android API-compatible instrumentation writes; retain independent legacy/native installed outcomes.

# Register the retained editor runner via its existing Gradle selector.
