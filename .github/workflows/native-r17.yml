name: Native R17 compatibility and upgrade
on:
  push:
    branches: [agent/native-pc-visual]
    paths: ['.github/workflows/native-r17.yml', 'scripts/*r17*', 'app/src/**', 'version.properties']
permissions: {contents: read, actions: read}
concurrency: {group: native-r17, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with: {packages: '', log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Contracts and exact protected trees
        run: |
          set -euo pipefail
          mkdir -p out/r17
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor ac29b458325b52d6e302ca44270d16552de4ed7f HEAD
          git diff --exit-code 820cdfc2d490da4267f6dcc2fa25d356b367d94a HEAD -- core game-api game-runtime data unity app/src/main/assets > out/r17/protected.log
          for suite in test-native-r17 test-native-r01 test-architecture; do bash scripts/$suite.sh > out/r17/$suite.log 2>&1; done
      - name: Original complete core (failure remains visible)
        continue-on-error: true
        run: |
          set +e
          bash scripts/test-core.sh > out/r17/core.log 2>&1
          code=$?
          echo "$code" > out/r17/core.exit
          exit "$code"
      - name: Minified production APK and paired instrumentation
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug -PnativePcVisual=true -PunityBridgeProbe=false -PmapEditorProbe=true > out/r17/build.log 2>&1
          cp app/build/outputs/apk/debug/app-debug.apk out/r17/sanguo11-r17-v115.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk out/r17/test.apk
          git rev-parse HEAD > out/r17/SOURCE_COMMIT
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/r17/sanguo11-r17-v115.apk > out/r17/metadata.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/r17/sanguo11-r17-v115.apk > out/r17/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 out/r17/sanguo11-r17-v115.apk > out/r17/alignment.txt
          python3 scripts/audit-3d-apk.py out/r17/sanguo11-r17-v115.apk --require-16k > out/r17/apk-audit.txt
          sha256sum out/r17/*.apk > out/r17/SHA256SUMS
      - name: Retrieve exact previous delivered APK
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh run download 36376973379 -n native-r16-build -D /tmp/r16
          cp /tmp/r16/candidate/app.apk out/r17/previous.apk
          echo '7cd2bb3da12f66f959f93c1338dadb88cf9e3013c7d2a6257fe023e8ca1df753  out/r17/previous.apk' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: native-r17-build, path: out/r17/, retention-days: 30, if-no-files-found: error}
  installed:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: {api: [26, 35]}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/download-artifact@v4
        with: {name: native-r17-build, path: out/r17/}
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '${{ matrix.api }}'
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: bash scripts/verify-native-r17.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'native-r17-api${{ matrix.api }}', path: 'out/r17/runtime/', retention-days: 30}
