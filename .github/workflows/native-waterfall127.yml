name: Native waterfall v127 normal visibility
on:
  push:
    branches: [agent/native-pc-visual]
    paths: ['.github/workflows/native-waterfall127.yml', 'tools/3d/refine_blender127.py', 'tools/3d/scenery127.mat', 'version.properties', 'app/src/main/**', 'app/src/androidTest/java/game/sanguo/mobile/NativeWaterfall127Instrumentation.java', 'app/src/test/java/game/sanguo/mobile/NativeWaterfall127Test.java', 'scripts/test-waterfall127*.sh']
permissions: {contents: read, actions: read}
concurrency: {group: 'native-waterfall127-${{ github.sha }}', cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with: {packages: '', log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Reproduce actual Blender, ETC2 and pinned material
        run: |
          set -euo pipefail
          mkdir -p out/waterfall127
          curl -fsSL --retry 2 https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz -o /tmp/blender127.tar.xz
          tar -xJf /tmp/blender127.tar.xz -C /tmp
          /tmp/blender-4.2.3-linux-x64/blender --background --threads 2 --python-exit-code 1 --python tools/3d/refine_blender127.py -- out/waterfall127/reproduced > out/waterfall127/blender.log 2>&1
          python3 -m pip install etcpak==0.9.15 Pillow==12.3.0 numpy==2.3.5 texture2ddecoder==1.0.6
          ASSET_OUTPUT_ROOT=out/waterfall127/reproduced python3 tools/3d/compress_scenery127.py
          curl -fsSL --retry 2 https://github.com/google/filament/releases/download/v1.56.0/filament-v1.56.0-linux.tgz -o /tmp/filament127.tgz
          tar -xzf /tmp/filament127.tgz -C /tmp
          /tmp/filament/bin/matc -p mobile -a opengl -o /tmp/scenery127.filamat tools/3d/scenery127.mat
          cmp /tmp/scenery127.filamat app/src/main/assets/3d/field/v127/scenery.filamat
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('out/waterfall127/reproduced')
          for p in (root/'app/src/main/assets/3d/field/v127').iterdir():
              assert p.read_bytes()==Path(p.relative_to(root)).read_bytes(),p
          for p in ['feedback-v127-blender-assets.json','feedback-v127-texture-compression.json']:
              assert json.loads((root/'docs/native-pc-visual'/p).read_text())==json.loads((Path('docs/native-pc-visual')/p).read_text())
          print('PASS exact Blender/PNG/ETC2/material reproduction')
          PY
      - name: Authority, geometric visibility and format checks
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/json127.jar
          export JSON_TEST_JAR=/tmp/json127.jar
          bash scripts/test-waterfall127.sh > out/waterfall127/host.log 2>&1
          bash scripts/test-architecture.sh > out/waterfall127/architecture.log 2>&1
          npm ci --prefix tools/3d
          npm --prefix tools/3d run validate > out/waterfall127/khronos.log 2>&1
      - name: Preserve independent input and candidate rule failures
        continue-on-error: true
        run: |
          set +e
          git worktree add --detach /tmp/input127 3208cf3b78fcba4583e6e6e443535cfb42426990
          (cd /tmp/input127 && bash scripts/test-core.sh) > out/waterfall127/core-input.log 2>&1
          echo $? > out/waterfall127/core-input.exit
          bash scripts/test-core.sh > out/waterfall127/core-candidate.log 2>&1
          code=$?; echo "$code" > out/waterfall127/core-candidate.exit
          (cd /tmp/input127 && java -cp core/build/check:core/src/main/resources:core/src/test/resources game.sanguo.core.DisplacementTest) > out/waterfall127/displacement-input.log 2>&1
          echo $? > out/waterfall127/displacement-input.exit
          java -cp core/build/check:core/src/main/resources:core/src/test/resources game.sanguo.core.DisplacementTest > out/waterfall127/displacement-candidate.log 2>&1
          echo $? > out/waterfall127/displacement-candidate.exit
          exit "$code"
      - name: Build and audit exact production source
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug -PcandidateSource="$GITHUB_SHA" -PnativePcVisual=true -PunityBridgeProbe=false -PmapEditorProbe=true > out/waterfall127/build.log 2>&1
          cp app/build/outputs/apk/debug/app-debug.apk out/waterfall127/sanguo11-mobile-v127.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk out/waterfall127/test.apk
          echo "$GITHUB_SHA" > out/waterfall127/SOURCE_COMMIT
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/waterfall127/sanguo11-mobile-v127.apk > out/waterfall127/metadata.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/waterfall127/sanguo11-mobile-v127.apk > out/waterfall127/signature.txt
          python3 scripts/audit-3d-apk.py out/waterfall127/sanguo11-mobile-v127.apk --require-16k > out/waterfall127/apk-audit.json
          python3 scripts/verify-r18-apk.py out/waterfall127/sanguo11-mobile-v127.apk "$GITHUB_SHA" > out/waterfall127/apk-identity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: native-waterfall127-build, path: out/waterfall127/, retention-days: 30, if-no-files-found: error}
  installed:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
        mode: [hukou, taishan, southwest, lushan]
        variant: [candidate]
        include:
          - {api: 29, mode: hukou, variant: input}
          - {api: 35, mode: hukou, variant: input}
          - {api: 29, mode: taishan, variant: input}
          - {api: 35, mode: taishan, variant: input}
          - {api: 29, mode: southwest, variant: input}
          - {api: 35, mode: southwest, variant: input}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: matrix.variant == 'candidate'
        with: {name: native-waterfall127-build, path: out/waterfall127/}
      - uses: actions/download-artifact@v4
        if: matrix.variant == 'input'
        with:
          name: native-landmarks126-build
          path: out/waterfall127/
          run-id: 36659459089
          github-token: '${{ secrets.GITHUB_TOKEN }}'
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '${{ matrix.api }}'
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: bash scripts/test-waterfall127-installed.sh '${{ matrix.mode }}' '${{ matrix.variant }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'native-waterfall127-api${{ matrix.api }}-${{ matrix.mode }}-${{ matrix.variant }}', path: out/waterfall127/runtime/, retention-days: 30, if-no-files-found: warn}
