name: Reference58 fresh v057 baseline
on:
  push:
    branches: [agent/reference-terrain-cleanup-v058]
    paths: [.github/workflows/reference58-baseline.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29c18ec127b7baeafaf9faf9f3b03ee5c1cd2a78
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Build unchanged baseline application with test-only fresh-world sampling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          git rev-parse HEAD > out/BASELINE_COMMIT
          cat > app/src/androidTest/java/game/sanguo/mobile/MapTap57Probe.java <<'JAVA'
          package game.sanguo.mobile;
          import android.app.Instrumentation;
          import game.sanguo.core.*;
          import java.util.*;
          final class MapTap57Probe extends MapTap57Harness {
            MapTap57Probe(Instrumentation i){super(i);}
            void run() throws Exception {
              try {
                for(String id:new String[]{"coalition-190","heroes-250"}) {
                  launch(ScenarioCatalog.load(id,5,580L));World w=world();
                  require(w.mapRevision==57,"fresh shipped v057 world, not an old screenshot");
                  byte[] before=SaveCodec.encode(w);
                  for(int[] xy:new int[][]{{110,79},{182,109},{156,77},{46,128},{47,155},{26,1},{109,53},{77,76}}) {
                    Hex h=MapCoordinates.fromNationalSource(w,new SourceGridCoord(xy[0],xy[1]));
                    focus(h,3.4f);navigator(false);record(h,screen(h));
                    shot("baseline-"+id+"-"+xy[0]+"-"+xy[1]+"-near");
                    tap(h);report.append("CALLBACK "+field(activity,"selected")+" PANEL "+panelText()+"\n");
                    focus(h,.9f);shot("baseline-"+id+"-"+xy[0]+"-"+xy[1]+"-mid");
                  }
                  for(World.Terrain t:new World.Terrain[]{World.Terrain.VOID,World.Terrain.ROAD,World.Terrain.PLANK_ROAD,World.Terrain.MOUNTAIN_PATH}) {
                    Hex sample=null;
                    for(int y=30;y<180&&sample==null;y++)for(int x=10;x<190;x++) {
                      Hex h=MapCoordinates.axial(w,new SourceGridCoord(x,y));
                      if(w.terrain[h.q][h.r]==t&&w.cityAt(h)==null&&w.unitAt(h)==null){sample=h;break;}
                    }
                    require(sample!=null,"baseline sample "+t);focus(sample,3.4f);tap(sample);
                    report.append("CALLBACK "+field(activity,"selected")+" PANEL "+panelText()+"\n");
                    shot("baseline-"+id+"-"+t);
                  }
                  require(Arrays.equals(before,SaveCodec.encode(w)),"sampling did not alter the fresh world");
                  writeInternal("reference58-v057-"+id+".sg11",before);
                  try(java.io.OutputStream o=new java.io.FileOutputStream(new java.io.File(dir(),"baseline-v057-"+id+".sg11"))){o.write(before);}
                }
              } finally {flush("reference58-baseline-checks.txt");}
            }
          }
          JAVA
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest | tee out/build.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > out/BASELINE_APK_SHA256
          cp app/build/outputs/apk/debug/app-debug.apk out/baseline-v057.apk
          git diff --name-only > out/TEST_ONLY_CHANGE
          test "$(cat out/TEST_ONLY_CHANGE)" = app/src/androidTest/java/game/sanguo/mobile/MapTap57Probe.java
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size 1080x2340
            adb shell wm density 420
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -b all -c
            timeout 450 adb shell am instrument -w -e mapTap57 true game.sanguo.mobile.dev.test/game.sanguo.mobile.GameSmokeRunner > out/instrumentation.txt || true
            adb logcat -b all -d -v threadtime > out/logcat.txt
            adb pull /sdcard/Android/data/game.sanguo.mobile.dev/files/smoke out/android
            grep -q 'MAP57 ANDROID PASS:' out/instrumentation.txt
            '! grep -q "FATAL EXCEPTION" out/logcat.txt'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference58-fresh-v057-baseline
          path: out
          retention-days: 14
