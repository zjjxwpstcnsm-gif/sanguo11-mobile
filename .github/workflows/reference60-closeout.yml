name: Reference60 verified documentation closeout
on:
  push:
    branches: [agent/water-map-finalization-v060]
    paths: [.github/workflows/reference60-closeout.yml]
permissions:
  contents: write
  actions: read
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify completed delivery and publish durable screenshot logs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          gh run view 35551707443 --json conclusion,headSha > out/run.json
          gh run download 35551707443 -n reference60-apk-identity -D out/identity
          gh run download 35551707443 -n reference60-review-stills -D out/review
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          run=json.loads(Path('out/run.json').read_text())
          assert run['conclusion']=='success' and run['headSha']=='62ea911f5a8526e70e8afeba641a56da2de24bc9'
          r=Path('out/identity');i=json.loads((r/'APK_IDENTITY.json').read_text());s=json.loads((r/'VALIDATION_STATUS.json').read_text());a=json.loads((r/'ANDROID_STATUS.json').read_text())
          assert i['source_sha']=='fec13cba0906af101c3e76bbc397801797a9dfc9'
          assert i['sha256']=='50b2ed1df0dd405e6cc14b907c1968a69e837aee08f3af5f41c7fe34df88b412'
          assert i['map_sha256']=='9b9e8dc7682c787d90717e53a57c9f68471706273c2939fe4f01501a77b8b47d'
          assert all(s[k]=='success' for k in ['SOURCE','CORE','BUILD','INSTALLED'])
          assert a['reference60'] and a['retained_native200_gameplay'] and a['old_manual_save_byte_identical_after_install'] and not a['physical_arm_tested']
          apk=next(r.glob('*.apk'));assert hashlib.sha256(apk.read_bytes()).hexdigest()==i['sha256'] and apk.stat().st_size==22335219
          for n in ['TESTED_APK_SHA256','RELEASE_VERIFIED_APK_SHA256']:assert (r/n).read_text().split()[0]==i['sha256']
          assert (r/'UPGRADE_SAVE_BEFORE').read_bytes()==(r/'UPGRADE_SAVE_AFTER').read_bytes()
          assert hashlib.sha256(Path('core/src/main/resources/maps/national-map-v056.properties').read_bytes()).hexdigest()==i['map_sha256']
          with zipfile.ZipFile('out/reference60-screenshots-and-logs.zip','w',zipfile.ZIP_DEFLATED,6) as z:
              for p in sorted(Path('out/review').rglob('*')):
                  if p.is_file():
                      assert 'MAP_SAN11' not in p.name
                      z.write(p,p.relative_to('out/review'))
          PY
          gh release upload v0.60.0-fec13cba0906 out/reference60-screenshots-and-logs.zip --clobber
          gh release download v0.60.0-fec13cba0906 -p reference60-screenshots-and-logs.zip -D out/verify
          cmp out/reference60-screenshots-and-logs.zip out/verify/reference60-screenshots-and-logs.zip
          gh release view v0.60.0-fec13cba0906 --json url,tagName,targetCommitish,assets > out/release.json
      - name: Record actual assertions visual review and qualified A B C conclusions
        env:
          BUILD_COMMIT: fec13cba0906af101c3e76bbc397801797a9dfc9
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess
          build=os.environ['BUILD_COMMIT'];changed=subprocess.check_output(['git','diff','--name-only',build,'HEAD']).decode().splitlines()
          assert all(p=='progress.md' or p.startswith('docs/') or p=='.github/workflows/reference60-closeout.yml' for p in changed),changed
          # Previous documentation-only run failed closed on an obsolete local draft.
          # Keep a stronger exact-content guard, using the actual committed blobs.
          for p,sha in {'docs/validation/v060/README.md':'29ff108d00b4d9f559c6b6dab04956c4a771caee','progress.md':'d68d3a770d870a886d183bd6d0558bdd2296801d'}.items():
              assert subprocess.check_output(['git','hash-object',p]).decode().strip()==sha,p
          r=Path('out/identity');v=Path('docs/validation/v060');review=Path('out/review')
          result={'status':'DONE','functional_build_commit':build,'workflow_bootstrap_commit':'62ea911f5a8526e70e8afeba641a56da2de24bc9','build_install_release_run':35551707443,'doc_publication_run':int('${{ github.run_id }}'),'identity':json.loads((r/'APK_IDENTITY.json').read_text()),'validation':json.loads((r/'VALIDATION_STATUS.json').read_text()),'android':json.loads((r/'ANDROID_STATUS.json').read_text()),'android_assertions':{'reference60':978,'preserved_native200_gameplay':92},'real_old_apk_saves':8,'old_manual_install_sha256':(r/'UPGRADE_SAVE_BEFORE').read_text().split()[0],'screenshots_logs_sha256':hashlib.sha256(Path('out/reference60-screenshots-and-logs.zip').read_bytes()).hexdigest(),'publication':json.loads(Path('out/release.json').read_text()),'documentation_only':True,'failed_doc_only_run':35552701139,'failed_doc_reason':'Exact text guard rejected stale local English draft; actual committed Chinese README/progress re-read and blob-pinned. No production code or APK was changed.','note':'Documentation/publication HEAD is not BUILD_COMMIT. No production source, map, art, or APK changed after installed validation.'}
          (v/'final-publication.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          names=[]
          for xy in ['113-143','123-101','124-40','155-157','196-24','196-55','198-99','199-80','20-143','27-184','52-65']:
              for prefix in ['before','after']:names.append(prefix+'-coalition-190-'+xy+'-near.png')
          names+=['v060-coalition-190-corrected-123-101.png','v060-central-mobile-sandbox-crop.png','v060-jingxiang-mobile-sandbox-crop.png','v060-new-water-march-rejected.png','v060-reviewed-region-march-preview.png','v060-reviewed-region-march-completed.png','v060-normal-new-game.png','v060-fixture-0.png','v060-coalition-190-LOD-0.15.png']
          hashes={n:hashlib.sha256((review/n).read_bytes()).hexdigest() for n in names}
          visual={'mode':'Actual assistant visual examination in the development session; not automated assertions labelled as human inspection','paired_national_coordinates':11,'pairs_reviewed_via':'Labelled map-viewport montages of original baseline and current screenshots; same seed590, scale3.4, focus coordinate, device1080x2340/density420. Current123,101 additionally opened full size. Originals separately preserved.','additional_full_screenshot_review':'Eight UI screenshots reviewed in a labelled reduced-size sheet, full rejected-march screenshot and full far-LOD screenshot also opened.','observations':['All11 reviewed old dark water gaps now show connected water; no Q/W false shoreline or black separating seam observed in these samples.','Q at source123,101 is selectable and has blocked-water details; movement onto it rejected, neighboring unchanged road MOVE completes and saves.','Both actual local crops show correctly aligned selectable Q; normal new-game flow opens revision60.','DAM neutral fixture detail visible; fixture is androidTest-only, not a discovered natural dam.','Far view still contains retained northwestern/outer-outline VOID: no nationwide zero-hole or historical legality certification.','Inherited march preview title uses internal coordinate139,123 while terrain detail shows national source123,101. Recorded conversion and actual plan target agree; label convention remains a presentation inconsistency, not a new geography regression.'],'not_certified':['All40000 rendered cells individually','Physical ARM device and frame-rate target','Unobserved per-frame transient visual artifacts','Original navigation rights for987 newly visible water cells','Every retained VOID being legally outside the original map'],'original_screenshot_sha256':hashes}
          (v/'visual-review.json').write_text(json.dumps(visual,ensure_ascii=False,indent=2)+'\n')
          readme=v/'README.md';text=readme.read_text();lines=text.splitlines()
          marker='IN PROGRESS at this functional source commit:'
          assert sum(s.startswith(marker) for s in lines)==1
          done='DONE: 实际功能源 fec13cba0906af101c3e76bbc397801797a9dfc9 已完成构建、同签名覆盖安装、八份真实旧058/059存档校验与独立APK发布。构建/安装/发布运行35551707443 SUCCESS；Reference60Probe978断言、保留Native56Probe92断言通过。APK SHA256 50b2ed1df0dd405e6cc14b907c1968a69e837aee08f3af5f41c7fe34df88b412，22335219字节；测试包与Release重新下载包字节一致。11组同坐标前后截图已实际目视。详见[最终身份记录](final-publication.json)和[目视范围及截图摘要](visual-review.json)。'
          lines=[done if s.startswith(marker) else s for s in lines];text='\n'.join(lines)+'\n'
          old='B：模型、通行、保存、投影定向检查通过；最终实际APK安装验收待本次运行结论补录。'
          assert old in text
          text=text.replace(old,'B：模型、通行、保存、投影定向检查与实际APK安装验收通过，范围为API29/x86_64、两个全国及两个局部剧本、八份真实旧档、正常MapView触摸及真实出征/下一旬/保存流程。不等于物理ARM、全历史CI或帧率目标认证。')
          text+='\n## 发布后文档补录\n\nDONE: 截图与日志已单独发布为Release资产reference60-screenshots-and-logs.zip，并重新下载核验字节。原图与原图裁片未上传。文档/发布提交与实际BUILD_COMMIT分开；文档更新未改变app/core/data/tools/scripts/version.properties。\n\nTODO: 继承的行军预览标题仍显示内部格坐标（139,123），地形详情显示全国源坐标（123,101）；实际触摸、坐标变换和路径目标一致，但标题口径仍需统一。本轮未将其假称为新的命中修复。\n\n文档补录首次运行35552701139因旧草稿文本断言拒绝而停止；重新读取实际远端文档并固定blob摘要后重试，未放宽地图、测试或产物校验。\n'
          assert 'IN PROGRESS' not in text;readme.write_text(text)
          p=Path('progress.md');s=p.read_text();old='- IN PROGRESS: final-source APK build, exact signed in-place install, current MapView/gameplay probes, true58/59 old-save encoder comparison, screenshot review and independent APK publication.'
          assert s.count(old)==1
          s=s.replace(old,'- DONE: source fec13cba0906af101c3e76bbc397801797a9dfc9 built/installed/published in SUCCESS run35551707443; Reference60 Android978 + retained native200 gameplay92 assertions, eight real058/059 saves, signed in-place upgrade with old manual bytes unchanged. APK SHA25650b2ed1df0dd405e6cc14b907c1968a69e837aee08f3af5f41c7fe34df88b412,22335219bytes.\n- DONE:11 actual before/after paired-coordinate screenshots reviewed plus Q/local/march/new-game/labelled-DAM/LOD samples. Standalone APK and separate screenshot/log Release archive downloaded back and byte-verified. See docs/validation/v060/final-publication.json and visual-review.json.\n- A: confirmed987 water cells restored; retained1271 VOID classified but not all proven legal exterior. B: directed installed scope PASS, not physical ARM/FPS/full-history certification. C: original nav/old-estimate/plank/outline uncertainties remain.\n- Documentation/publication commits are not BUILD_COMMIT; no functional code/map/art changed after installation. PR48 targets main, not merged by this task.')
          p.write_text(s)
          PY
          git diff --check
          git add progress.md docs/validation/v060
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(map): close v060 delivery with verified installed hashes and visual review [skip ci]'
          git push origin HEAD:agent/water-map-finalization-v060
          git diff --exit-code fec13cba0906af101c3e76bbc397801797a9dfc9 -- app core data tools scripts version.properties
