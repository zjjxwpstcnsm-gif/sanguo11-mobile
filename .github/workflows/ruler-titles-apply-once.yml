name: Apply validated ruler title changes
on:
  push:
    branches: [agent/ruler-titles-offices-20260922]
    paths: [.github/workflows/ruler-titles-apply-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'zjjxwpstcnsm-gif/sanguo11-mobile' && github.ref == 'refs/heads/agent/ruler-titles-offices-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply exact verified source delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = e9acd137a411145fc73c46da40d892ee58d27be5
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = '''
          
          
          
          '''
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '8b7c55b88cf5f4f9f251f12f6b52e676dada2c95969c488a2033109f243b081b'
          Path('/tmp/ruler-titles.patch').write_bytes(patch)
          PY
          git apply --index --unidiff-zero --exclude=.github/workflows/ruler-titles-verify.yml /tmp/ruler-titles.patch
          git diff --cached --check
          bash scripts/test-ruler-titles.sh
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(governance): enforce researched civil and military offices through commands UI supply and AI'
          git push origin HEAD:refs/heads/agent/ruler-titles-offices-20260922
          git rev-parse HEAD
