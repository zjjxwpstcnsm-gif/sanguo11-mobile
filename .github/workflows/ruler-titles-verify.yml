name: Ruler titles production verification
on:
  push:
    branches: [agent/ruler-titles-offices-20260922]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ruler-titles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify titles, current governance and UI contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/ruler-titles
          git rev-parse HEAD > out/ruler-titles/SOURCE_COMMIT.txt
          bash scripts/test-ruler-titles.sh 2>&1 | tee out/ruler-titles/titles.txt
          bash scripts/test-v066.sh 2>&1 | tee out/ruler-titles/governance.txt
          bash scripts/test-v064.sh 2>&1 | tee out/ruler-titles/retained.txt
          bash scripts/test-ui-models.sh 2>&1 | tee out/ruler-titles/presentation.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Build actual application and instrumentation
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee out/ruler-titles/android-build.txt
          cp app/build/outputs/apk/debug/app-debug.apk out/ruler-titles/sanguo11-ruler-titles.apk
          sha256sum out/ruler-titles/sanguo11-ruler-titles.apk > out/ruler-titles/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruler-titles-validation
          path: out/ruler-titles
          retention-days: 7
