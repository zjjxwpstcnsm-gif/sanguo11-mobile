name: S01 Filament foundation
on:
  push:
    branches: [agent/3d-s01-renderer-foundation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: |
          mkdir -p evidence
          bash scripts/test-3d-foundation.sh | tee evidence/scene.txt
          bash scripts/test-ui-models.sh | tee evidence/ui.txt
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
          cp app/build/outputs/apk/debug/app-debug.apk evidence/sanguo11-s01.apk
          git rev-parse HEAD > evidence/BUILD_COMMIT
          sha256sum evidence/sanguo11-s01.apk > evidence/SHA256SUMS
          stat -c '%s' evidence/sanguo11-s01.apk > evidence/APK_BYTES
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w game.sanguo.mobile.dev.test/game.sanguo.mobile.SceneInstrumentation | tee evidence/installed.txt
            adb pull /sdcard/Android/data/game.sanguo.mobile.dev/files/s01 evidence/installed
            adb logcat -d > evidence/logcat.txt
            grep -q 'PASS S01' evidence/installed.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-${{ github.sha }}
          path: evidence
          if-no-files-found: error
