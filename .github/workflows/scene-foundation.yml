name: S01-S05 Filament scene acceptance
on:
  push:
    branches: [agent/3d-s01-renderer-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: |
          mkdir -p evidence
          bash scripts/test-3d-foundation.sh | tee evidence/scene.txt
          bash scripts/test-ui-models.sh | tee evidence/ui.txt
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/scene-json.jar
          JSON_TEST_JAR=/tmp/scene-json.jar bash scripts/test-3d-field.sh | tee evidence/field-assets.txt
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
          cp app/build/outputs/apk/debug/app-debug.apk evidence/sanguo11-s01.apk
          git rev-parse HEAD > evidence/BUILD_COMMIT
          sha256sum evidence/sanguo11-s01.apk > evidence/SHA256SUMS
          stat -c '%s' evidence/sanguo11-s01.apk > evidence/APK_BYTES
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb root
            adb wait-for-device
            adb shell setprop dalvik.vm.heapgrowthlimit 256m
            adb shell setprop dalvik.vm.heapsize 512m
            adb shell setprop sys.boot_completed 0
            adb shell stop
            adb shell start
            adb shell 'for i in $(seq 1 60); do [ "$(getprop sys.boot_completed)" = "1" ] && exit 0; sleep 1; done; exit 1'
            adb shell getprop dalvik.vm.heapgrowthlimit > evidence/java-heap-growth-limit.txt
            adb shell getprop dalvik.vm.heapsize > evidence/java-heap-max.txt
            adb shell input keyevent 82
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -G 16M
            adb shell screenrecord --time-limit 150 /sdcard/field-scene.mp4 >/dev/null 2>&1 &
            adb shell am instrument -w game.sanguo.mobile.dev.test/game.sanguo.mobile.FieldSceneInstrumentation | tee evidence/field-installed.txt
            adb shell am instrument -w game.sanguo.mobile.dev.test/game.sanguo.mobile.SceneInstrumentation | tee evidence/installed.txt
            adb pull /sdcard/Android/data/game.sanguo.mobile.dev/files/s01 evidence/installed
            adb logcat -d > evidence/logcat.txt
            python3 scripts/field-ci-summary.py evidence/logcat.txt
            adb pull /sdcard/field-scene.mp4 evidence/field-scene.mp4
            grep -q 'PASS S04 S05' evidence/field-installed.txt
            grep -q 'PASS S01' evidence/installed.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-${{ github.sha }}
          path: evidence
          if-no-files-found: error
