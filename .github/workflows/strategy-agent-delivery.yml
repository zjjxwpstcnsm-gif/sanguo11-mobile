name: Strategy Agent Verified Delivery
on:
  push:
    branches: [agent/strategy-officer-v04]
    paths: [.agent-strategy-transfer/**, .github/workflows/strategy-agent-delivery.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: strategy-agent-delivery
  cancel-in-progress: false
jobs:
  verify-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strategy-officer-v04
          fetch-depth: 0
      - name: Check baseline and apply verified local patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/agent/strategy-officer-v04
          git status
          git log --oneline -10
          git merge-base --is-ancestor f23d656a92781573226fbcf03aa92c79da46f2bf HEAD
          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          parts = sorted(Path('.agent-strategy-transfer').glob('part-*.b64'))
          assert len(parts) == 6
          encoded = ''.join(p.read_text() for p in parts)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '8e77d630830fbf93d6fb20f90ee1433c4302cea0554bbb191b9b9274eb6c8bd1'
          Path('/tmp/strategy-officer.patch').write_bytes(patch)
          PY
          git apply --check /tmp/strategy-officer.patch
          git apply /tmp/strategy-officer.patch
          git rm -r .agent-strategy-transfer .github/workflows/strategy-agent-delivery.yml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify complete core regression suite
        run: bash scripts/test-core.sh | tee "$RUNNER_TEMP/strategy-core-tests.txt"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Android unit tests, assemble and lint
        run: gradle --no-daemon :core:check :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Check bundled scenario resources
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              for name in ['scenarios/index.txt', 'scenarios/m0-skirmish.properties', 'scenarios/regional-sandbox.properties']:
                  assert name in apk.namelist(), name
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual installed game and personnel UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/smoke-android.sh
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS
      - name: Record successful verification, commit and push isolated branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, hashlib
          doc = Path('docs/handoffs/agent-strategy-officer-v04.md')
          run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          doc.write_text(doc.read_text() + '\n## 本分支 Android CI 实测\n\n'
              + f'- CI 运行：{run}\n'
              + '- JDK 17 / Gradle 8.11.1 / Android SDK 35：完整 core 回归、Android unit-test 任务、assembleDebug、assembleDebugAndroidTest、lintDebug 均通过。\n'
              + '- API 29 x86_64 安装运行：原装机全流程与新增搜索、登用、任命、褒奖、巡察、有限征兵、训练、重启存档一致性通过。\n'
              + '- APK 资源目录检查、apksigner 签名验证通过。\n'
              + f'- APK：{apk.stat().st_size} 字节；SHA-256 `{digest}`。开发调试签名，不是正式发布签名。\n'
              + '- 临时传输工作流和编码补丁已从最终分支文件树删除，不增加常驻 CI 配置。\n', encoding='utf-8')
          PY
          git diff --check
          git config user.name 'Strategy Officer Agent'
          git config user.email 'strategy-agent@users.noreply.github.com'
          git add .
          git commit -m 'feat: expand strategy and officer systems'
          git push -u origin HEAD:agent/strategy-officer-v04
          git status
          test -z "$(git status --porcelain)"
          git bundle create "$RUNNER_TEMP/strategy-officer-v04.bundle" HEAD refs/heads/agent/strategy-officer-v04
          git archive --format=zip HEAD -o "$RUNNER_TEMP/strategy-officer-v04-source.zip"
          git rev-parse HEAD | tee "$RUNNER_TEMP/strategy-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-officer-v04-handoff
          path: |
            ${{ runner.temp }}/strategy-officer-v04.bundle
            ${{ runner.temp }}/strategy-officer-v04-source.zip
            ${{ runner.temp }}/strategy-core-tests.txt
            ${{ runner.temp }}/strategy-commit.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: sanguo11-mobile-strategy-officer-v04-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-android-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-android-smoke
          path: app/build/smoke
          if-no-files-found: ignore
