name: v034-agent-apply
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-ux-geography-turn-v034
          fetch-depth: 0
      - name: Load migration script from main
        run: |
          git fetch origin main
          git show origin/main:tools/v034_apply.py > /tmp/v034_apply.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v034_apply.py');s=p.read_text()
          s=s.replace("r'(\\n\\s*private void refresh\\(\\)\\s*\\{)'","r'(\\n\\s*(?:private )?void refresh\\(\\)\\s*\\{)'")
          p.write_text(s)
          PY
      - name: Apply migration and regenerate content
        run: |
          python3 /tmp/v034_apply.py
          python3 tools/content/build_content.py
          python3 tools/content/build_mobile_scenarios.py
          python3 tools/content/build_historical_scenarios.py
          python3 tools/content/test_content.py
          python3 tools/content/test_geography_v034.py
          bash scripts/test-core.sh
          bash scripts/test-ui-models.sh
      - name: Commit verified source changes
        run: |
          git config user.name 'chatgpt-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app core data tools
          git commit -m 'feat: improve mobile navigation geography and turn flow'
          git push origin HEAD:agent/mobile-ux-geography-turn-v034
