name: v034-march-command-fix

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'retry: apply v0.34 march visibility fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-ux-geography-turn-v034
          fetch-depth: 0
      - name: Patch formal UI source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/game/sanguo/mobile/MainActivity.java')
          s = p.read_text()
          a = 'boolean mapContext="map".equals(ui.page)&&!aiRunning;'
          b = 'boolean mapContext="map".equals(ui.page)&&!aiRunning&&!ui.panelVisible;'
          if a in s:
              s = s.replace(a, b, 1)
          elif b not in s:
              raise SystemExit('quick navigator target not found')
          a = 'for(Button b:new Button[]{march,attack,tactics,plots,cancel})actions.addView(b,new LinearLayout.LayoutParams(0,dp(48),1));'
          b = 'for(Button b:new Button[]{march,attack,tactics,plots})actions.addView(b,new LinearLayout.LayoutParams(0,dp(48),1));\n            if(!(u instanceof Domestic.Mission)&&u.march!=null)actions.addView(button("停止行军",v->apply(world.marches.stop(u.id))),new LinearLayout.LayoutParams(0,dp(48),1));\n            actions.addView(cancel,new LinearLayout.LayoutParams(0,dp(48),1));'
          if a in s:
              s = s.replace(a, b, 1)
          elif 'if(!(u instanceof Domestic.Mission)&&u.march!=null)actions.addView(button("停止行军"' not in s:
              raise SystemExit('march command target not found')
          p.write_text(s)
          PY
      - name: Verify focused UI model suite
        run: bash scripts/test-ui-models.sh
      - name: Commit formal source fix
        shell: bash
        run: |
          git config user.name "zjjxwpstcnsm-gif"
          git config user.email "zjjxwpstcnsm@gmail.com"
          git add app/src/main/java/game/sanguo/mobile/MainActivity.java
          git commit -m "fix: keep active march controls reachable"
          git push origin HEAD:agent/mobile-ux-geography-turn-v034
