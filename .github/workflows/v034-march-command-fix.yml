name: v0.34 march command visibility fix

on:
  push:
    branches:
      - agent/mobile-ux-geography-turn-v034
    paths:
      - .github/workflows/v034-march-command-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-ux-geography-turn-v034
          fetch-depth: 0
      - name: Keep persistent march controls reachable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/game/sanguo/mobile/MainActivity.java')
          s=p.read_text()
          old='boolean mapContext="map".equals(ui.page)&&!aiRunning;'
          new='boolean mapContext="map".equals(ui.page)&&!aiRunning&&!ui.panelVisible;'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('quick navigator visibility target not found')
          old2='''            Button cancel=button("取消选中",v->clearUnitSelection());
            if(u instanceof Domestic.Mission){attack.setText("补给");attack.setOnClickListener(v->{if(error!=null)message("补给暂不可用",error);else convoySupply((Domestic.Mission)u);});tactics.setText("停止");tactics.setOnClickListener(v->apply(world.marches.stop(u.id)));plots.setText("货物");plots.setOnClickListener(v->{ui.panelVisible=true;refresh();revealPanel();});}
            for(Button b:new Button[]{march,attack,tactics,plots,cancel})actions.addView(b,new LinearLayout.LayoutParams(0,dp(48),1));
'''
          new2='''            Button cancel=button("取消选中",v->clearUnitSelection());
            if(u instanceof Domestic.Mission){attack.setText("补给");attack.setOnClickListener(v->{if(error!=null)message("补给暂不可用",error);else convoySupply((Domestic.Mission)u);});tactics.setText("停止");tactics.setOnClickListener(v->apply(world.marches.stop(u.id)));plots.setText("货物");plots.setOnClickListener(v->{ui.panelVisible=true;refresh();revealPanel();});}
            for(Button b:new Button[]{march,attack,tactics,plots})actions.addView(b,new LinearLayout.LayoutParams(0,dp(48),1));
            if(!(u instanceof Domestic.Mission)&&u.march!=null)actions.addView(button("停止行军",v->apply(world.marches.stop(u.id))),new LinearLayout.LayoutParams(0,dp(48),1));
            actions.addView(cancel,new LinearLayout.LayoutParams(0,dp(48),1));
'''
          if old2 in s:
              s=s.replace(old2,new2,1)
          elif new2 not in s:
              raise SystemExit('march command target not found')
          p.write_text(s)
          PY
      - name: Run focused presentation regression
        shell: bash
        run: |
          bash scripts/test-ui-models.sh
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "sanguo11-mobile-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/game/sanguo/mobile/MainActivity.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: keep active march controls reachable"
          git push origin HEAD:agent/mobile-ux-geography-turn-v034
