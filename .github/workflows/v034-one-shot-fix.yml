name: v034 one-shot UI smoke fix

on:
  push:
    branches:
      - agent/mobile-ux-geography-turn-v034

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v034-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-ux-geography-turn-v034
          fetch-depth: 0
      - name: Apply targeted v0.34 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/game/sanguo/mobile/MainActivity.java')
          s = main.read_text(encoding='utf-8')

          old = 'ui.page.equals("officers")?"武将":'
          new = 'ui.page.equals("officers")?"武将一览":'
          if old not in s:
              raise SystemExit('officer page title target not found')
          s = s.replace(old, new, 1)

          old = '''        ScrollView scroll=new ScrollView(this);scroll.setFillViewport(false);scroll.addView(list,new ScrollView.LayoutParams(-1,-2));
          dlg[0]=new AlertDialog.Builder(this).setTitle("选择剧本 · 六个年代与自制沙盘").setView(scroll).setNegativeButton("返回",null).create();
          dlg[0].setOnShowListener(d->{
              int rows=Math.min(5,Math.max(3,ss.size()));
              int target=dp(rows*56+16);
              int cap=Math.max(dp(180),getResources().getDisplayMetrics().heightPixels*58/100);
              scroll.getLayoutParams().height=Math.min(target,cap);scroll.requestLayout();
          });
          dlg[0].show();'''
          new = '''        ScrollView scroll=new ScrollView(this);scroll.setFillViewport(false);scroll.addView(list,new ScrollView.LayoutParams(-1,-2));
          int rows=Math.min(5,Math.max(3,ss.size()));
          int target=dp(rows*56+16);
          int cap=Math.max(dp(180),getResources().getDisplayMetrics().heightPixels*58/100);
          LinearLayout shell=UiViews.col(this);
          shell.addView(scroll,new LinearLayout.LayoutParams(-1,Math.min(target,cap)));
          dlg[0]=new AlertDialog.Builder(this).setTitle("选择剧本 · 六个年代与自制沙盘").setView(shell).setNegativeButton("返回",null).create();
          dlg[0].show();'''
          if old not in s:
              raise SystemExit('scenario picker target not found')
          s = s.replace(old, new, 1)
          main.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/game/sanguo/mobile/MainActivity.java
          git commit -m "fix: stabilize overview and scenario picker [v034-patch]"
          git push origin HEAD:agent/mobile-ux-geography-turn-v034
