name: v0.34 quick navigator regression fix

on:
  push:
    branches:
      - agent/mobile-ux-geography-turn-v034
    paths:
      - .github/workflows/v034-ui-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-ux-geography-turn-v034
          fetch-depth: 0
      - name: Scope quick navigator to map context
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/game/sanguo/mobile/MainActivity.java')
          s = p.read_text()
          prefix_old = '    private void refreshQuickNavigator(){\n        if(quickCityStrip==null||quickUnitStrip==null||world==null)return;\n        quickCityStrip.removeAllViews();quickUnitStrip.removeAllViews();\n'
          prefix_new = '    private void refreshQuickNavigator(){\n        if(quickCityStrip==null||quickUnitStrip==null||world==null)return;\n        View cityRow=(View)quickCityStrip.getParent().getParent();View unitRow=(View)quickUnitStrip.getParent().getParent();\n        boolean mapContext="map".equals(ui.page)&&!aiRunning;\n        if(!mapContext){\n            quickCityStrip.removeAllViews();quickUnitStrip.removeAllViews();\n            cityRow.setVisibility(View.GONE);unitRow.setVisibility(View.GONE);return;\n        }\n        quickCityStrip.removeAllViews();quickUnitStrip.removeAllViews();\n'
          tail_old = '        View cityRow=(View)quickCityStrip.getParent().getParent();View unitRow=(View)quickUnitStrip.getParent().getParent();cityRow.setVisibility(ownCities.isEmpty()?View.GONE:View.VISIBLE);unitRow.setVisibility(ownUnits.isEmpty()?View.GONE:View.VISIBLE);\n'
          tail_new = '        cityRow.setVisibility(ownCities.isEmpty()?View.GONE:View.VISIBLE);unitRow.setVisibility(ownUnits.isEmpty()?View.GONE:View.VISIBLE);\n'
          if prefix_old not in s or tail_old not in s:
              raise SystemExit('target refreshQuickNavigator anchors not found')
          s = s.replace(prefix_old, prefix_new, 1).replace(tail_old, tail_new, 1)
          p.write_text(s)
          PY
      - name: Run focused regression tests
        shell: bash
        run: |
          bash scripts/test-ui-models.sh
          bash scripts/test-core.sh
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "sanguo11-mobile-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/game/sanguo/mobile/MainActivity.java
          git commit -m "fix: scope quick navigation to map context"
          git push origin HEAD:agent/mobile-ux-geography-turn-v034
