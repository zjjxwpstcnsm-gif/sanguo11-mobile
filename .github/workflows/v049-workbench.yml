name: v049 personnel stats and rations
run-name: v0.49 audited source, rules and installed Android verification
on:
  push:
    branches: [agent/personnel-v049-workbench]
    paths: ['.github/workflows/v049-workbench.yml', '.ci/v049.*.b64', '.ci/v049.fixes.json']
permissions:
  contents: write
concurrency:
  group: v049-workbench
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 24
      - name: Materialize hash-checked v49 changes on exact v48 base
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          base='f06ba4cf7f60012a6a9113deff78f76ccbace718'
          expected=['142061efedd21ecf3081898865e24d7e77f9dda9c3709c0127e3952b3478e851','75da47058c892114476091902343bfd1ca3d70acffebbeee8559289911ac09fa','1fcd059664dddbc54e1a4ff6da88496225ee4f05a57385a4c3de331a46c8cac2','4d32e9a4ab749bbb28e03bd8b039dcfadaedfeceaa05a52763269506f70a0434']
          chunks=[]
          for i,want in enumerate(expected):
              text=pathlib.Path(f'.ci/v049.{i}.b64').read_text().strip()
              assert hashlib.sha256(text.encode()).hexdigest()==want,f'chunk {i} mismatch'
              chunks.append(text)
          raw=lzma.decompress(base64.b64decode(''.join(chunks),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='491100d7ef77159521cb4bd1e47d95ae1ad63cb04ef46e37c93b447df3429c99'
          fixes=pathlib.Path('.ci/v049.fixes.json')
          items=json.loads(raw)+(json.loads(fixes.read_text()) if fixes.exists() else [])
          subprocess.run(['git','checkout','--detach',base],check=True)
          hashes={}
          for item in items:
              p=pathlib.Path(item['path']);assert not p.is_absolute() and '..' not in p.parts
              old=p.read_bytes() if p.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None)==item['base'],str(p)+' base mismatch'
              lines=[] if old is None else old.decode().splitlines(keepends=True)
              for start,end,text in reversed(item['ops']):lines[start:end]=[text]
              result=''.join(lines).encode();assert hashlib.sha256(result).hexdigest()==item['result'],str(p)+' output mismatch'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(result);hashes[str(p)]=item['result']
          subprocess.run(['git','add','-A'],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only',base],text=True).splitlines()
          assert sorted(changed)==sorted(hashes),'Unexpected source changes'
          pathlib.Path('/tmp/SOURCE_CHECKSUMS.json').write_text(json.dumps(hashes,indent=2)+'\n')
          print('Verified source files:',len(hashes))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          source=$(printf '%s\n' 'feat: unit stats, loyalty defection, compatibility and rations v0.49.0 [skip ci]' | git commit-tree "$tree" -p f06ba4cf7f60012a6a9113deff78f76ccbace718)
          git checkout --detach "$source"
          echo "SOURCE_COMMIT=$source" >> "$GITHUB_ENV"
          mkdir -p dist
          git rev-parse HEAD > dist/BUILD_COMMIT
          cp /tmp/SOURCE_CHECKSUMS.json dist/SOURCE_CHECKSUMS.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Focused rules, UI models and retained map resources
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-personnel49.sh 2>&1 | tee dist/core-checks.txt
          bash scripts/test-ui-models.sh 2>&1 | tee dist/ui-model-checks.txt
          python3 scripts/verify-map-release.py | tee dist/map-source-checks.txt
      - name: Compile Android app and installed probes
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Package exact compiled APK and source
        id: package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git diff --exit-code
          short=$(git rev-parse --short=12 HEAD)
          name="sanguo11-mobile-v049-$short.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$name"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "dist/$name" | tee dist/SIGNATURE.txt
          grep -Fq '8f64ee37f8ff58de8f5a199aac2ae745a5bc927d0d0eabac7540083a5e551f24' dist/SIGNATURE.txt
          python3 scripts/verify-map-release.py "dist/$name" | tee dist/map-apk-checks.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "dist/$name" > dist/APK_BADGING.txt
          grep -Fq "versionCode='49' versionName='0.49.0'" dist/APK_BADGING.txt
          git diff --binary f06ba4cf7f60012a6a9113deff78f76ccbace718 HEAD > dist/v049-source.patch
          git archive --format=zip HEAD -o dist/v049-source.zip
          (cd dist && sha256sum "$name" v049-source.zip v049-source.patch > SHA256SUMS)
          echo "name=sanguo11-mobile-v049-$short" >> "$GITHUB_OUTPUT"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installed stats, slider, rotation, recommendations and v48 turn flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 360
            adb shell settings put system accelerometer_rotation 0
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -r -e systems49 true game.sanguo.mobile.dev.test/game.sanguo.mobile.GameSmokeRunner > dist/installed-systems49.txt 2>&1
            adb logcat -d > dist/logcat-systems49.txt
            adb pull /sdcard/Android/data/game.sanguo.mobile.dev/files/smoke dist/screenshots || true
            cat dist/installed-systems49.txt
            grep -q 'SYSTEMS49 PASS' dist/installed-systems49.txt
            adb shell am force-stop game.sanguo.mobile.dev
            adb shell am instrument -w -r -e flow48 true game.sanguo.mobile.dev.test/game.sanguo.mobile.GameSmokeRunner > dist/installed-flow48.txt 2>&1
            adb logcat -d > dist/logcat-flow48.txt
            adb pull /sdcard/Android/data/game.sanguo.mobile.dev/files/smoke dist/screenshots-flow48 || true
            cat dist/installed-flow48.txt
            grep -q 'FLOW48 PASS' dist/installed-flow48.txt
      - name: Publish verified source branch
        run: git push origin "$SOURCE_COMMIT:refs/heads/agent/v049-ready"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.package.outputs.name || 'sanguo11-mobile-v049-diagnostics' }}
          path: dist/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
