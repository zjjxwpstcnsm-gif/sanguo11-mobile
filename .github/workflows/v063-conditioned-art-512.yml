name: V063 dimension-bounded projection-conditioned art
on:
  push:
    branches: [agent/generated-art-city-movement-ports-v063]
    paths: [.github/workflows/v063-conditioned-art-512.yml]
permissions:
  contents: read
jobs:
  generate:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [city, harbor-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      ART_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: v063-lcm-a85df6a8bd976cdd08b4fd8f3b73f229c9e54df5
      - run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install diffusers==0.35.1 transformers==4.56.2 accelerate==1.10.1 huggingface_hub==0.35.3 safetensors==0.6.2 Pillow==11.3.0
      - name: Generate at an explicitly bounded 512-pixel inference resolution
        timeout-minutes: 10
        run: |
          mkdir -p out/mothers
          python - <<'PY'
          import os,json,time,hashlib
          from pathlib import Path
          from PIL import Image
          import torch,diffusers
          from diffusers import AutoPipelineForImage2Image
          out=Path('out/mothers');repo='SimianLuo/LCM_Dreamshaper_v7';revision='a85df6a8bd976cdd08b4fd8f3b73f229c9e54df5';torch.set_num_threads(4)
          pipe=AutoPipelineForImage2Image.from_pretrained(repo,revision=revision,torch_dtype=torch.float32,use_safetensors=True,low_cpu_mem_usage=True)
          pipe.to('cpu');pipe.enable_attention_slicing();pipe.enable_vae_slicing()
          prompts={
            'standard':'isometric Chinese walled city game sprite, isolated on white, complete low perimeter walls enclosing many tiny grey tiled houses, detailed courtyards and lanes, realistic ancient weathered architecture, grey stone and timber, entire compact city in frame, overhead orthographic view, 35 degree camera, subtle natural colors, soft upper left light',
            'port':'isometric Chinese harbor game sprite, isolated on white, three small grey tiled timber warehouses behind long narrow wooden piers and piles, entire compact dock in frame, detailed weathered wood and realistic tiles, overhead orthographic view, 35 degree camera, subtle natural colors, soft upper left light',
            'gate':'isometric ancient Chinese fortified gate game sprite, isolated on white, grey tiled gatehouse above an arched stone gateway, two modest fortified stone wall wings, entire compact fort in frame, realistic detailed tiles and masonry, overhead orthographic view, 35 degree camera, soft upper left light'
          }
          jobs=[('standard-055','standard',0.55),('standard-070','standard',0.70)] if os.environ['ART_GROUP']=='city' else [('port','port',0.65),('gate','gate',0.65)]
          records=[]
          for i,(key,kind,strength) in enumerate(jobs):
            source=Path('app/src/main/assets/map/cities-v056')/(kind+'-near.png');rgba=Image.open(source).convert('RGBA');original_size=list(rgba.size)
            init=Image.new('RGBA',rgba.size,'white');init.alpha_composite(rgba);init=init.convert('RGB').resize((512,512),Image.Resampling.LANCZOS)
            assert init.size==(512,512)
            start=time.time();seed=630601+(0 if os.environ['ART_GROUP']=='city' else 10)+i
            result=pipe(prompt=prompts[kind],image=init,num_inference_steps=12,strength=strength,guidance_scale=5.0,generator=torch.Generator('cpu').manual_seed(seed))
            if getattr(result,'nsfw_content_detected',None) and any(result.nsfw_content_detected):raise RuntimeError('Safety rejection: do not retry around it')
            image=result.images[0];assert image.size==(512,512);file=out/(key+'.png');image.save(file)
            records.append({'key':key,'generation':'NEW_V063_ACTUAL_DIFFUSION_IMG2IMG_512','status':'FILE_OBTAINED_VISUAL_REVIEW_REQUIRED','model_repository':repo,'model_revision':revision,'device':'cpu','pipeline_class':type(pipe).__name__,'prompt':prompts[kind],'reference_source':str(source),'reference_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),'reference_original_size':original_size,'inference_reference_size':[512,512],'reference_role':'projection and original footprint only','strength':strength,'steps':12,'guidance_scale':5.0,'seed':seed,'file':file.name,'dimensions':list(image.size),'sha256':hashlib.sha256(file.read_bytes()).hexdigest(),'seconds':round(time.time()-start,3)})
            (out/'generation-record.json').write_text(json.dumps(records,indent=2)+'\n');print(json.dumps(records[-1]),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v063-conditioned-512-${{ matrix.group }}-actual-files
          path: out/
          retention-days: 14
      - uses: actions/cache/save@v4
        if: success() && matrix.group == 'city'
        with:
          path: ~/.cache/huggingface
          key: v063-lcm-a85df6a8bd976cdd08b4fd8f3b73f229c9e54df5
