name: V063 projection-conditioned image generation and baseline build
on:
  push:
    branches: [agent/generated-art-city-movement-ports-v063]
    paths: [.github/workflows/v063-conditioned-art-and-baseline.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_COMMIT: 38a0da98924bc1aba3a43cf63661be319d72fd7a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 38a0da98924bc1aba3a43cf63661be319d72fd7a
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use and export the runner's already installed Android platform
        run: |
          set -euo pipefail
          mkdir -p out
          ls "$ANDROID_HOME/platforms" | tee out/INSTALLED_PLATFORMS.txt
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          cp "$ANDROID_HOME/platforms/android-35/android.jar" out/android-35.jar
          python3 -m pip install Pillow==11.3.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build exact v062 main candidate for before screenshots and upgrade tests
        run: |
          set -euo pipefail
          git rev-parse HEAD > out/BUILD_COMMIT
          test "$(cat out/BUILD_COMMIT)" = "$BUILD_COMMIT"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 > out/baseline-build.log 2>&1
          cp app/build/outputs/apk/debug/app-debug.apk out/v062-exact-main-baseline.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/v062-exact-main-baseline.apk > out/BASELINE_PACKAGE.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/v062-exact-main-baseline.apk > out/BASELINE_SIGNATURE.txt
          sha256sum out/v062-exact-main-baseline.apk out/android-35.jar > out/SHA256SUMS
          sha256sum core/src/main/resources/maps/national-map-v056.properties core/src/main/resources/maps/national-exterior-v061.properties > out/GEOGRAPHY_SHA256
      - name: Diagnose inherited test compilation without misreporting it as success
        if: success()
        run: |
          if ./gradlew :app:compileDebugAndroidTestJavaWithJavac --no-daemon --max-workers=2 > out/inherited-test-compile.log 2>&1; then
            echo PASS > out/INHERITED_TEST_COMPILE_STATUS
          else
            echo BLOCKER_INHERITED_TEST_COMPILE > out/INHERITED_TEST_COMPILE_STATUS
            grep -A7 -B2 'error:' out/inherited-test-compile.log || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v063-road-baseline-apk-and-compiler
          path: out/
          retention-days: 14
  conditioned-art:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install diffusers==0.35.1 transformers==4.56.2 accelerate==1.10.1 huggingface_hub==0.35.3 safetensors==0.6.2 Pillow==11.3.0
      - name: Run actual image-to-image diffusion with the existing projection as reference
        run: |
          mkdir -p out/mothers
          python - <<'PY'
          import json,time,hashlib,inspect
          from pathlib import Path
          from PIL import Image
          import torch,diffusers
          from diffusers import AutoPipelineForImage2Image
          out=Path('out/mothers');repo='SimianLuo/LCM_Dreamshaper_v7';revision='a85df6a8bd976cdd08b4fd8f3b73f229c9e54df5'
          torch.set_num_threads(4)
          pipe=AutoPipelineForImage2Image.from_pretrained(repo,revision=revision,torch_dtype=torch.float32,use_safetensors=True,low_cpu_mem_usage=True)
          pipe.to('cpu');pipe.enable_attention_slicing();pipe.enable_vae_slicing()
          prompts={
            'standard':'isometric Chinese walled city game sprite, isolated on white, complete low perimeter walls enclosing many tiny grey tiled houses, detailed courtyards and lanes, realistic ancient weathered architecture, grey stone and timber, entire compact city in frame, overhead orthographic view, 35 degree camera, subtle natural colors, soft upper left light',
            'port':'isometric Chinese harbor game sprite, isolated on white, three small grey tiled timber warehouses behind long narrow wooden piers and piles, entire compact dock in frame, detailed weathered wood and realistic tiles, overhead orthographic view, 35 degree camera, subtle natural colors, soft upper left light',
            'gate':'isometric ancient Chinese fortified gate game sprite, isolated on white, grey tiled gatehouse above an arched stone gateway, two modest fortified stone wall wings, entire compact fort in frame, realistic detailed tiles and masonry, overhead orthographic view, 35 degree camera, soft upper left light'
          }
          records=[]
          for i,(key,kind,strength) in enumerate([('standard-055','standard',0.55),('standard-070','standard',0.70),('port','port',0.65),('gate','gate',0.65)]):
            source=Path('app/src/main/assets/map/cities-v056')/(kind+'-near.png')
            rgba=Image.open(source).convert('RGBA');init=Image.new('RGBA',rgba.size,'white');init.alpha_composite(rgba);init=init.convert('RGB')
            start=time.time();seed=630501+i
            result=pipe(prompt=prompts[kind],image=init,num_inference_steps=12,strength=strength,guidance_scale=5.0,generator=torch.Generator('cpu').manual_seed(seed))
            if getattr(result,'nsfw_content_detected',None) and any(result.nsfw_content_detected):raise RuntimeError('Safety rejection: do not retry around it')
            image=result.images[0];file=out/(key+'.png');image.save(file)
            records.append({'key':key,'generation':'NEW_V063_ACTUAL_DIFFUSION_IMG2IMG','status':'FILE_OBTAINED_VISUAL_REVIEW_REQUIRED','model_repository':repo,'model_revision':revision,'device':'cpu','pipeline_class':type(pipe).__name__,'prompt':prompts[kind],'reference_source':str(source),'reference_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),'reference_role':'projection and original footprint only; reference not claimed to be newly generated','strength':strength,'steps':12,'guidance_scale':5.0,'seed':seed,'file':file.name,'dimensions':list(image.size),'sha256':hashlib.sha256(file.read_bytes()).hexdigest(),'seconds':round(time.time()-start,3)})
            (out/'generation-record.json').write_text(json.dumps(records,indent=2)+'\n');print(key,records[-1]['seconds'],records[-1]['sha256'],flush=True)
          (out/'runtime.json').write_text(json.dumps({'torch':torch.__version__,'diffusers':diffusers.__version__,'model_revision':revision,'device':'cpu','threads':4,'call_signature':str(inspect.signature(pipe.__call__))},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v063-projection-conditioned-actual-mothers
          path: out/
          retention-days: 14
