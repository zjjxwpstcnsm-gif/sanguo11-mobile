name: V063 persist city runtime
on:
  push:
    branches: [agent/city-movement-ports-void-v063]
    paths: [.ci/v063-city.patch.b64, .github/workflows/v063-persist-city.yml]
permissions:
  contents: write
jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate preimage and apply the locally tested production delta
        run: |
          set -euo pipefail
          mkdir -p out/classes
          git merge-base --is-ancestor 55e374d1278260f24b7f833eab146f18caefed48 HEAD
          git diff --exit-code 55e374d1278260f24b7f833eab146f18caefed48 HEAD -- app/src/main core/src/main core/src/test/java
          python3 - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          text=Path('.ci/v063-city.patch.b64').read_text()
          assert hashlib.sha256(text.encode()).hexdigest()=='26ede8a13a6155e52e85aa7e01f5f1935c9ce109bc470bf61eb5afc3efb5d615'
          # Exact byte comparison of the downloaded relay artifact found these seven transcription errors.
          for a,b,value in reversed([[231,232,''],[310,311,''],[411,412,''],[426,427,''],[458,459,''],[525,526,'H'],[2392,2393,'']]):
              text=text[:a]+value+text[b:]
          assert len(text)==10136
          raw=gzip.decompress(base64.b64decode(text,validate=True))
          assert len(raw)==27070
          assert hashlib.sha256(raw).hexdigest()=='8294ef153cb761484559643ffa749c5d1de5ea597de76f9fdaea872ad517664a'
          Path('out/city.patch').write_bytes(raw)
          PY
          git apply --unidiff-zero --check out/city.patch
          git apply --unidiff-zero out/city.patch
          find core/src/main/java -name '*.java' > out/sources
          javac -encoding UTF-8 -d out/classes @out/sources
          javac -encoding UTF-8 -cp out/classes -d out/classes core/src/test/java/game/sanguo/core/CityFootprint55Test.java core/src/test/java/game/sanguo/core/CityMovement63Test.java
          java -cp out/classes:core/src/main/resources:core/src/test/resources game.sanguo.core.CityMovement63Test | tee out/city63.txt
      - name: Commit actual production files to the same PR branch, removing all temporary relays
        run: |
          set -euo pipefail
          git diff --exit-code -- app/src/main/assets core/src/main/resources
          rm .ci/v063-city.patch.b64 .github/workflows/v063-persist-city.yml .github/workflows/v063-relay-diagnostics.yml
          git add app/src/main/java core/src/main/java core/src/test/java/game/sanguo/core/CityMovement63Test.java .ci/v063-city.patch.b64 .github/workflows/v063-persist-city.yml .github/workflows/v063-relay-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v063): bill weighted center departures across army transport and AI; persist seven-cell city objectives'
          git push origin HEAD:agent/city-movement-ports-void-v063
          git rev-parse HEAD > out/RUNTIME_COMMIT
          git diff --stat 55e374d1278260f24b7f833eab146f18caefed48 HEAD > out/ACTUAL_CHANGED_FILES.txt
          git archive --format=zip -o out/source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v063-city-runtime
          path: |
            out/source.zip
            out/RUNTIME_COMMIT
            out/ACTUAL_CHANGED_FILES.txt
            out/city63.txt
          retention-days: 7
