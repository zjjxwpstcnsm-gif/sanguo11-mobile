name: V063 persist reviewed geography
on:
  push:
    branches: [agent/city-movement-ports-void-v063]
    paths: [.github/workflows/v063-persist-geography.yml]
permissions:
  contents: write
jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Exact preimage, protected parcels and individual reviewed source cells
        run: |
          set -euo pipefail
          mkdir -p out/classes
          git diff --exit-code 697faf35a4634e2cc21f7651548ca3e2340adcc6 HEAD -- app/src/main core/src/main version.properties tools/content/map-release-manifest.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          sys.path.insert(0,'tools/content')
          from audit_native57 import properties,neighbors
          from audit_native58 import footprint
          sha=lambda b:hashlib.sha256(b).hexdigest()
          before='d5d5659e40a23619dd8515713d21997715733d20cc937a964662591e22f076c4'
          after='75bcd0e68187acc1832cf70f046879d6e5cdc5fb60a8ab2dab598fb18162d95d'
          file=Path('core/src/main/resources/maps/national-map-v056.properties');raw=file.read_bytes()
          assert sha(raw)==before
          text=raw.decode();p=properties(text);g=[p['terrain.'+str(y)] for y in range(200)]
          assert p['revision']=='61' and p['columns']==p['rows']=='200'
          protected,plots=footprint(p);assert len(plots)==591
          cells=[(18,24,'A'),(29,24,'R'),(30,24,'R'),(33,15,'M'),(34,15,'M'),(34,18,'M'),(35,14,'M'),(37,15,'M'),(37,20,'M'),(37,21,'M'),(37,22,'M'),(37,23,'M'),(37,24,'M'),(38,15,'M')]
          assert len({(x,y) for x,y,c in cells})==14
          rows={}
          for x,y,c in cells:
              assert 18<=x<=38 and 14<=y<=24 and g[y][x]=='V' and (x,y) not in protected|plots
              rows.setdefault(y,list(g[y]))[x]=c
          for y,row in rows.items():text=text.replace('terrain.'+str(y)+'='+g[y],'terrain.'+str(y)+'='+''.join(row))
          ports=[(20060,148,110,149,110),(20061,123,66,123,65),(20070,177,101,177,100),(20074,116,137,115,136),(20079,70,110,70,109),(20080,99,133,100,133),(20062,101,72,101,71)]
          assert len({i for i,x,y,a,b in ports})==7
          for i,x,y,a,b in ports:
              assert p['site.'+str(i)]==f'{x},{y}' and (a,b) in set(neighbors(x,y)) and (a,b) not in protected|plots
              assert g[b][a] in 'PFR' and any(g[yy][xx] in 'WO' for xx,yy in neighbors(a,b))
              text=text.replace(f'site.{i}={x},{y}\n',f'site.{i}={a},{b}\n')
          text=text.replace('revision=61\n','revision=63\n')
          text+='\n# v063: reviewed surfaces with unconfirmed traversal; explicit legal-origin restrictions.\n'
          for x,y,c in cells:text+=f'blocked.{x}.{y}={c}\n'
          assert sha(text.encode())==after
          exterior=Path('core/src/main/resources/maps/national-exterior-v061.properties').read_bytes()
          assert sha(exterior)=='451fed332f742aaef8a88e5781c15eda8e1ad0fd29ae7d20c3e0dbe82214a60f'
          new=properties(text);mask=[tuple(map(int,k.split('.')[1:])) for k in properties(exterior.decode()) if k.startswith('outside.')]
          assert len(mask)==len(set(mask))==1051
          assert all(new['terrain.'+str(y)][x]=='V' for x,y in mask)
          assert sum(new['terrain.'+str(y)].count('V') for y in range(200))==1051
          file.write_text(text)
          def replace(path,old,new):
              file=Path(path);s=file.read_text();assert s.count(old)==1,(path,old);file.write_text(s.replace(old,new))
          replace('core/src/main/java/game/sanguo/core/Army.java','if (u == null || from == null || to == null || !w.inside(from) || !w.inside(to)) return -1;','if (u == null || from == null || to == null || !w.inside(from) || !w.inside(to) || NationalMap.restricted(w,from) || NationalMap.restricted(w,to)) return -1;')
          replace('core/src/main/java/game/sanguo/core/World.java','if(h==null||weapon==null||!inside(h)||events.at(h)!=null)return -1;','if(h==null||weapon==null||!inside(h)||events.at(h)!=null||NationalMap.restricted(this,h))return -1;')
          replace('core/src/main/java/game/sanguo/core/NationalExterior.java','bound to revision 61; older saves keep their own map.','bound to known revisions 61 and 63; older saves keep their own map.')
          replace('core/src/main/java/game/sanguo/core/NationalExterior.java','w.mapRevision!=REVISION||','(w.mapRevision!=REVISION&&w.mapRevision!=63)||')
          version=Path('version.properties');assert version.read_text()=='versionName=0.62.0-road-candidate\nversionCode=62\n';version.write_text('versionName=0.63.0\nversionCode=63\n')
          file=Path('tools/content/map-release-manifest.json');manifest=json.loads(file.read_text());assert manifest['release']=='0.62.0-road-candidate';manifest['release']='0.63.0'
          entry=next(e for e in manifest['files'] if e['source_path']=='core/src/main/resources/maps/national-map-v056.properties');assert entry['sha256']==before;entry['sha256']=after
          file.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          Path('out/map-transaction.json').write_text(json.dumps({'before_sha256':before,'after_sha256':after,'reviewed_cells':cells,'all_cells_evidence':'ESTIMATED; conservative surface reconstruction, original passability not asserted','ports':ports,'additional_port':20062,'port_water_terrain_changes':0,'inherited_exterior':1051,'new_exterior':0,'asset_revision':56},ensure_ascii=False,indent=2)+'\n')
          PY
          python3 scripts/verify-map-release.py | tee out/resource-check.txt
          find core/src/main/java -name '*.java' > out/sources
          javac -encoding UTF-8 -d out/classes @out/sources
          javac -encoding UTF-8 -cp out/classes -d out/classes core/src/test/java/game/sanguo/core/CityFootprint55Test.java core/src/test/java/game/sanguo/core/CityMovement63Test.java
          java -cp out/classes:core/src/main/resources:core/src/test/resources game.sanguo.core.CityMovement63Test | tee out/city63-map63.txt
      - name: Commit actual geography, not a staged source patch
        run: |
          set -euo pipefail
          git diff --exit-code 5aede9ea20e5d81054ce48ae3d7783626c36dc48 HEAD -- app/src/main/assets core/src/main/java/game/sanguo/core/SaveCodec.java
          git diff --exit-code -- app/src/main/assets core/src/main/java/game/sanguo/core/SaveCodec.java
          rm .github/workflows/v063-persist-geography.yml
          git add core/src/main/java core/src/main/resources/maps/national-map-v056.properties version.properties tools/content/map-release-manifest.json .github/workflows/v063-persist-geography.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(map63): shoreline-adjacent logical docks and 14 reviewed blocked surfaces; retain exterior and art'
          git push origin HEAD:agent/city-movement-ports-void-v063
          git rev-parse HEAD > out/GEOGRAPHY_COMMIT
          git diff --stat 5aede9ea20e5d81054ce48ae3d7783626c36dc48 HEAD > out/ACTUAL_CHANGED_FILES.txt
          git archive --format=zip -o out/source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v063-geography-runtime
          path: |
            out/source.zip
            out/GEOGRAPHY_COMMIT
            out/ACTUAL_CHANGED_FILES.txt
            out/map-transaction.json
            out/resource-check.txt
            out/city63-map63.txt
          retention-days: 7
