name: V064 production verification
on:
  push:
    branches: [agent/district-recruit-ui-v064]
    paths: [.github/workflows/v064-apply-and-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/district-recruit-ui-v064
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply verified production source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          digest=lambda text:hashlib.sha256(text.encode()).hexdigest()
          edits=[]
          for i in range(3): edits.extend(json.loads(Path(f'.ci/v064-delta{i}.json').read_text()))
          for item in edits:
              p=Path(item['path'])
              text=p.read_text() if p.exists() else None
              if text is not None and digest(text)==item['after']:continue
              if item['before'] is None:
                  assert text is None, f'Unexpected existing file: {p}'
                  text=item['content']
              else:
                  assert text is not None and digest(text)==item['before'], f'Baseline hash mismatch: {p}'
                  for start,end,replacement in reversed(item['edits']): text=text[:start]+replacement+text[end:]
              assert digest(text)==item['after'], f'Result hash mismatch: {p}'
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(text)
              print('Verified:',p)
          Path('/tmp/v064-paths').write_text('\n'.join(item['path'] for item in edits)+'\n')
          PY
          mkdir -p out/v064 /tmp/v064-classes
          find core/src/main/java -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 --release 17 -d /tmp/v064-classes
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --pathspec-from-file=/tmp/v064-paths
            git commit -m 'feat(v064): city delegation, recruiting energy and reserves, selection UX and real facility ranges [skip ci]'
            git push origin HEAD:agent/district-recruit-ui-v064
          fi
          git rev-parse HEAD | tee out/v064/SOURCE_COMMIT
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Build actual Android application
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon :app:assembleDebug -PdebuggablePlaytest=true 2>&1 | tee out/v064/android-build.log
          cp app/build/outputs/apk/debug/app-debug.apk out/v064/sanguo11-mobile-v064.apk
          sha256sum out/v064/sanguo11-mobile-v064.apk > out/v064/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v064-production-verification
          path: out/v064/
          retention-days: 7
