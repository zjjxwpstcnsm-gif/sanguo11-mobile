name: V064 focused rules and Android build
on:
  push:
    branches: [agent/district-recruit-ui-v064]
    paths:
      - .github/workflows/v064-regression.yml
      - 'core/**'
      - 'app/**'
      - scripts/test-v064.sh
      - version.properties
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v064-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Run focused production regressions
        run: |
          set -euo pipefail
          mkdir -p out/v064
          git rev-parse HEAD > out/v064/SOURCE_COMMIT
          bash scripts/test-v064.sh 2>&1 | tee out/v064/core-tests.log
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Build actual Android application
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon :app:assembleDebug 2>&1 | tee out/v064/android-build.log
          cp app/build/outputs/apk/debug/app-debug.apk out/v064/sanguo11-mobile-v064.apk
          sha256sum out/v064/sanguo11-mobile-v064.apk > out/v064/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v064-rules-and-apk
          path: out/v064/
          retention-days: 7
