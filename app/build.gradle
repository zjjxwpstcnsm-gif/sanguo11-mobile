plugins { id 'com.android.application' }
android {
    namespace 'game.sanguo.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'game.sanguo.mobile'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'game.sanguo.mobile.GameSmokeRunner'
        versionCode 3
        versionName '0.3.0-strategy-dev'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation project(':core') }
