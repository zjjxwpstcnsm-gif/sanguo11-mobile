plugins { id 'com.android.application' }
def release = new Properties()
rootProject.file('version.properties').withInputStream { release.load(it) }
def revision = providers.exec {
    workingDir rootProject.projectDir
    commandLine 'git', 'rev-parse', '--short=12', 'HEAD'
    ignoreExitValue = true
}.standardOutput.asText.get().trim()
android {
    buildFeatures { buildConfig true }
    namespace 'game.sanguo.mobile'
    compileSdk 35
    sourceSets.androidTest.java.srcDir rootProject.file("core/src/testFixtures/java")
    sourceSets.androidTest.java.exclude 'game/sanguo/core/battle/**'
    sourceSets.androidTest.resources.srcDir rootProject.file("core/src/test/resources")
    sourceSets.test.java.srcDir rootProject.file("core/src/testFixtures/java")
    sourceSets.test.java.exclude 'game/sanguo/core/battle/**'
    sourceSets.test.resources.srcDir rootProject.file("core/src/test/resources")
    defaultConfig {
        applicationId 'game.sanguo.mobile.dev'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'game.sanguo.mobile.GameSmokeRunner'
        versionCode release.getProperty('versionCode').toInteger()
        versionName release.getProperty('versionName')
        buildConfigField 'String', 'SOURCE_REVISION', '"' + (revision ?: 'source-archive') + '"'
    }
    signingConfigs {
        debug {
            // Public development-only key. Never use for production or privileged distribution.
            storeFile rootProject.file('tools/android/dev-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation project(':core') }

// Execute plain Java presentation regressions without adding a runtime/test framework dependency.
tasks.register('verifyPresentation', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'scripts/test-ui-models.sh'
}
tasks.named('check').configure { dependsOn 'verifyPresentation' }
tasks.matching { it.name == 'test' || it.name.endsWith('UnitTest') }.configureEach { dependsOn 'verifyPresentation' }

// Prevent a numerically newer release from silently dropping the delivered map or sprite atlases.
tasks.register('verifyMapRelease', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/verify-map-release.py'
}
tasks.named('preBuild').configure { dependsOn 'verifyMapRelease' }
