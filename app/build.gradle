plugins { id 'com.android.application' }
android {
    namespace 'game.sanguo.mobile'
    compileSdk 35
    sourceSets.androidTest.java.srcDir rootProject.file("core/src/testFixtures/java")
    sourceSets.androidTest.java.exclude 'game/sanguo/core/battle/**'
    sourceSets.androidTest.resources.srcDir rootProject.file("core/src/test/resources")
    defaultConfig {
        applicationId 'game.sanguo.mobile.dev'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'game.sanguo.mobile.GameSmokeRunner'
        versionCode 32
        versionName '0.32.0-navigation-defense-dev'
    }
    signingConfigs {
        debug {
            // Public development-only key. Never use for production or privileged distribution.
            storeFile rootProject.file('tools/android/dev-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation project(':core') }

// Execute plain Java presentation regressions without adding a runtime/test framework dependency.
tasks.register('verifyPresentation', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'scripts/test-ui-models.sh'
}
tasks.named('check').configure { dependsOn 'verifyPresentation' }
tasks.matching { it.name == 'test' || it.name.endsWith('UnitTest') }.configureEach { dependsOn 'verifyPresentation' }
