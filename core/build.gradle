    tasks.register("verify${suite}", JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "game.sanguo.core.${suite}Test"
    }
    tasks.named('check') { dependsOn "verify${suite}" }
}

