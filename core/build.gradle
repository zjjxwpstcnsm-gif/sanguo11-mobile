plugins { id 'java-library' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('verifyCore', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'game.sanguo.core.CoreTest'
}
check.dependsOn verifyCore

tasks.register('verifyScenarios', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'game.sanguo.core.ScenarioTest'
}
check.dependsOn verifyScenarios

tasks.register('verifyDomestic', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'game.sanguo.core.DomesticTest'
}
check.dependsOn verifyDomestic

// Independent tactical battle verification (Agent 2).
apply from: "tactical-battle.gradle"

tasks.register('verifyStrategy', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'game.sanguo.core.StrategyTest'
}
tasks.named('check') { dependsOn 'verifyStrategy' }
tasks.named('test') { dependsOn 'verifyStrategy' }

tasks.register('verifyCampaign', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'game.sanguo.core.CampaignTest'
}
tasks.named('check') { dependsOn 'verifyCampaign' }
tasks.named('test') { dependsOn 'verifyCampaign' }

tasks.register('verifyArmy', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'game.sanguo.core.ArmyTest'
}
tasks.named('check') { dependsOn 'verifyArmy' }
tasks.named('test') { dependsOn 'verifyArmy' }

 tasks.register('verifyRulesParity', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'game.sanguo.core.RulesParityTest'
}
tasks.named('check') { dependsOn 'verifyRulesParity' }
tasks.named('test') { dependsOn 'verifyRulesParity' }

tasks.register('verifyGovernment', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'game.sanguo.core.GovernmentTest'
}
tasks.register('verifySupply', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'game.sanguo.core.SupplyTest'
}
tasks.named('check') { dependsOn 'verifyGovernment', 'verifySupply' }
