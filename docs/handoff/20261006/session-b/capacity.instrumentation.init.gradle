// Own capacity runner; no production build/manifest or A file mutation.
gradle.beforeProject { project ->
    project.plugins.withId('com.android.application') {
        project.extensions.getByName('androidComponents').finalizeDsl { android ->
            android.defaultConfig.testInstrumentationRunner = 'game.sanguo.mobile.SessionBCapacityInstrumentation'
        }
    }
}
